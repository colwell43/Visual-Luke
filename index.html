s=\"v\">6<\/sup> They couldn’t answer him regarding these things."},{"type":"q","id":"14.1","field":"q102","text":"<b>Head:<\/b> Look at the image that opens this chapter. Jesus went to eat at the house of a Pharisee “on a Sabbath to eat bread, they were watching him” (v. 1). He asked, “Is it lawful to heal on the Sabbath?” (v. 3). Why do you think the leaders stayed silent?"},{"type":"h2","text":"Take the Lowest Place"},{"type":"img","src":"img/luke14-v07.jpg","w":1100,"h":733,"alt":"Empty chairs and tables in a dining room"},{"type":"p","html":"<sup class=\"v\">7<\/sup> He spoke a parable to those who were invited, when he noticed how they chose the best seats, and said to them, <sup class=\"v\">8<\/sup> “When you are invited by anyone to a wedding feast, don’t sit in the best seat, since perhaps someone more honorable than you might be invited by him, <sup class=\"v\">9<\/sup> and he who invited both of you would come and tell you, ‘Make room for this person.’ Then you would begin, with shame, to take the lowest place. <sup class=\"v\">10<\/sup> But when you are invited, go and sit in the lowest place, so that when he who invited you comes, he may tell you, ‘Friend, move up higher.’ Then you will be honored in the presence of all who sit at the table with you. <sup class=\"v\">11<\/sup> For everyone who exalts himself will be humbled, and whoever humbles himself will be exalted.”"},{"type":"q","id":"14.2","field":"q103","text":"<b>Heart:<\/b> Consider the image of the chairs. “For everyone who exalts himself will be humbled, and whoever humbles himself will be exalted” (v. 11). Where do you find yourself looking for the place of honor?"},{"type":"h2","text":"Invite Those Who Cannot Repay"},{"type":"p","html":"<sup class=\"v\">12<\/sup> He also said to the one who had invited him, “When you make a dinner or a supper, don’t call your friends, nor your brothers, nor your kinsmen, nor rich neighbors, or perhaps they might also return the favor, and pay you back. <sup class=\"v\">13<\/sup> But when you make a feast, ask the poor, the maimed, the lame, or the blind; <sup class=\"v\">14<\/sup> and you will be blessed, because they don’t have the resources to repay you. For you will be repaid in the resurrection of the righteous.”"},{"type":"q","id":"14.3","field":"q104","text":"<b>Action:<\/b> “But when you make a feast, ask the poor, the maimed, the lame, or the blind” (v. 13). Whom will you invite this week who cannot repay you?"},{"type":"h2","text":"The Great Banquet"},{"type":"img","src":"img/luke14-v15.jpg","w":1100,"h":734,"alt":"A round table filled with dishes for a feast"},{"type":"p","html":"<sup class=\"v\">15<\/sup> When one of those who sat at the table with him heard these things, he said to him, “Blessed is he who will feast in God’s Kingdom!”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> But he said to him, “A certain man made a great supper, and he invited many people. <sup class=\"v\">17<\/sup> He sent out his servant at supper time to tell those who were invited, ‘Come, for everything is ready now.’ <sup class=\"v\">18<\/sup> They all as one began to make excuses."},{"type":"p","html":"“The first said to him, ‘I have bought a field, and I must go and see it. Please have me excused.’"},{"type":"p","html":"<sup class=\"v\">19<\/sup> “Another said, ‘I have bought five yoke of oxen, and I must go try them out. Please have me excused.’"},{"type":"p","html":"<sup class=\"v\">20<\/sup> “Another said, ‘I have married a wife, and therefore I can’t come.’"},{"type":"p","html":"<sup class=\"v\">21<\/sup> “That servant came, and told his lord these things. Then the master of the house, being angry, said to his servant, ‘Go out quickly into the streets and lanes of the city, and bring in the poor, maimed, blind, and lame.’"},{"type":"p","html":"<sup class=\"v\">22<\/sup> “The servant said, ‘Lord, it is done as you commanded, and there is still room.’"},{"type":"p","html":"<sup class=\"v\">23<\/sup> “The lord said to the servant, ‘Go out into the highways and hedges, and compel them to come in, that my house may be filled. <sup class=\"v\">24<\/sup> For I tell you that none of those men who were invited will taste of my supper.’ ”"},{"type":"q","id":"14.4","field":"q105","text":"<b>Head:<\/b> Consider the image of the feast. The invited guests “all as one began to make excuses” (v. 18). Why do people turn down God’s invitation?"},{"type":"q","id":"14.5","field":"q106","text":"<b>Heart:<\/b> The master said, “Go out quickly into the streets and lanes of the city, and bring in the poor, maimed, blind, and lame” (v. 21). How does it feel to know you are invited to God’s feast?"},{"type":"h2","text":"The Cost of Being a Disciple"},{"type":"img","src":"img/luke14-v25.jpg","w":1100,"h":733,"alt":"A construction crane beside a building under construction"},{"type":"p","html":"<sup class=\"v\">25<\/sup> Now great multitudes were going with him. He turned and said to them, <sup class=\"v\">26<\/sup> “If anyone comes to me, and doesn’t disregard his own father, mother, wife, children, brothers, and sisters, yes, and his own life also, he can’t be my disciple. <sup class=\"v\">27<\/sup> Whoever doesn’t bear his own cross, and come after me, can’t be my disciple. <sup class=\"v\">28<\/sup> For which of you, desiring to build a tower, doesn’t first sit down and count the cost, to see if he has enough to complete it? <sup class=\"v\">29<\/sup> Or perhaps, when he has laid a foundation, and is not able to finish, everyone who sees begins to mock him, <sup class=\"v\">30<\/sup> saying, ‘This man began to build, and wasn’t able to finish.’ <sup class=\"v\">31<\/sup> Or what king, as he goes to encounter another king in war, will not sit down first and consider whether he is able with ten thousand to meet him who comes against him with twenty thousand? <sup class=\"v\">32<\/sup> Or else, while the other is yet a great way off, he sends an envoy, and asks for conditions of peace. <sup class=\"v\">33<\/sup> So therefore whoever of you who doesn’t renounce all that he has, he can’t be my disciple. <sup class=\"v\">34<\/sup> Salt is good, but if the salt becomes flat and tasteless, with what do you season it? <sup class=\"v\">35<\/sup> It is fit neither for the soil nor for the manure pile. It is thrown out. He who has ears to hear, let him hear.”"},{"type":"q","id":"14.6","field":"q107","text":"<b>Action:<\/b> Consider the image of the crane. Jesus asked, “which of you, desiring to build a tower, doesn’t first sit down and count the cost” (v. 28)? What cost of following Jesus will you accept this week?"},{"type":"q","id":"14.7","field":"q108","text":"<b>Head:<\/b> “Salt is good, but if the salt becomes flat and tasteless, with what do you season it?” (v. 34). What makes a follower of Jesus like good salt?"}],"prayer":"God, you invite the poor, the maimed, the blind and the lame to your great banquet (14:21). Give me wisdom as I read, and help me follow Jesus whatever it costs (14:27)."},{"num":15,"hero":{"src":"img/luke15-hero.jpg","w":1100,"h":734,"alt":"Sheep standing alone on a rocky hillside"},"blocks":[{"type":"h2","text":"The Lost Sheep"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now all the tax collectors and sinners were coming close to him to hear him. <sup class=\"v\">2<\/sup> The Pharisees and the scribes murmured, saying, “This man welcomes sinners, and eats with them.”"},{"type":"q","id":"15.1","field":"q109","text":"<b>Head:<\/b> Look at the image that opens this chapter. The Pharisees and scribes grumbled, “This man welcomes sinners, and eats with them” (v. 2). Why do you think Jesus answered with three stories about lost things?"},{"type":"p","html":"<sup class=\"v\">3<\/sup> He told them this parable. <sup class=\"v\">4<\/sup> “Which of you men, if you had one hundred sheep, and lost one of them, wouldn’t leave the ninety-nine in the wilderness, and go after the one that was lost, until he found it? <sup class=\"v\">5<\/sup> When he has found it, he carries it on his shoulders, rejoicing. <sup class=\"v\">6<\/sup> When he comes home, he calls together his friends and his neighbors, saying to them, ‘Rejoice with me, for I have found my sheep which was lost!’ <sup class=\"v\">7<\/sup> I tell you that even so there will be more joy in heaven over one sinner who repents, than over ninety-nine righteous people who need no repentance."},{"type":"q","id":"15.2","field":"q110","text":"<b>Heart:<\/b> The shepherd will “go after the one that was lost, until he found it” (v. 4). When have you felt lost? How did God find you?"},{"type":"h2","text":"The Lost Coin"},{"type":"img","src":"img/luke15-v08.jpg","w":1100,"h":733,"alt":"A broom sweeping dust from a wooden floor"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Or what woman, if she had ten drachma coins, if she lost one drachma coin, wouldn’t light a lamp, sweep the house, and seek diligently until she found it? <sup class=\"v\">9<\/sup> When she has found it, she calls together her friends and neighbors, saying, ‘Rejoice with me, for I have found the drachma which I had lost.’ <sup class=\"v\">10<\/sup> Even so, I tell you, there is joy in the presence of the angels of God over one sinner repenting.”"},{"type":"q","id":"15.3","field":"q111","text":"<b>Action:<\/b> Consider the image of the broom. The woman swept her house until she found her lost coin (v. 8). “There is joy in the presence of the angels of God over one sinner repenting” (v. 10). Pray by name each day this week for someone you know who is far from God."},{"type":"h2","text":"The Lost Son"},{"type":"p","html":"<sup class=\"v\">11<\/sup> He said, “A certain man had two sons. <sup class=\"v\">12<\/sup> The younger of them said to his father, ‘Father, give me my share of your property.’ He divided his livelihood between them. <sup class=\"v\">13<\/sup> Not many days after, the younger son gathered all of this together and traveled into a far country. There he wasted his property with riotous living. <sup class=\"v\">14<\/sup> When he had spent all of it, there arose a severe famine in that country, and he began to be in need. <sup class=\"v\">15<\/sup> He went and joined himself to one of the citizens of that country, and he sent him into his fields to feed pigs. <sup class=\"v\">16<\/sup> He wanted to fill his belly with the husks that the pigs ate, but no one gave him any. <sup class=\"v\">17<\/sup> But when he came to himself he said, ‘How many hired servants of my father’s have bread enough to spare, and I’m dying with hunger! <sup class=\"v\">18<\/sup> I will get up and go to my father, and will tell him, “Father, I have sinned against heaven, and in your sight. <sup class=\"v\">19<\/sup> I am no more worthy to be called your son. Make me as one of your hired servants.” ’"},{"type":"q","id":"15.4","field":"q112","text":"<b>Heart:<\/b> The younger son “came to himself” (v. 17) when he was hungry and alone. What helps you come to your senses when you wander from God?"},{"type":"img","src":"img/luke15-v20.jpg","w":1100,"h":733,"alt":"A father and son sharing a tender moment"},{"type":"p","html":"<sup class=\"v\">20<\/sup> “He arose, and came to his father. But while he was still far off, his father saw him, and was moved with compassion, and ran, and fell on his neck, and kissed him. <sup class=\"v\">21<\/sup> The son said to him, ‘Father, I have sinned against heaven and in your sight. I am no longer worthy to be called your son.’"},{"type":"p","html":"<sup class=\"v\">22<\/sup> “But the father said to his servants, ‘Bring out the best robe, and put it on him. Put a ring on his hand, and sandals on his feet. <sup class=\"v\">23<\/sup> Bring the fattened calf, kill it, and let’s eat, and celebrate; <sup class=\"v\">24<\/sup> for this, my son, was dead, and is alive again. He was lost, and is found.’ Then they began to celebrate."},{"type":"q","id":"15.5","field":"q113","text":"<b>Heart:<\/b> Consider the image of the embrace. “But while he was still far off, his father saw him, and was moved with compassion, and ran, and fell on his neck, and kissed him” (v. 20). What does this picture tell you about God the Father?"},{"type":"h2","text":"The Older Brother"},{"type":"img","src":"img/luke15-v25.jpg","w":1100,"h":733,"alt":"A young man standing with his arms crossed"},{"type":"p","html":"<sup class=\"v\">25<\/sup> “Now his elder son was in the field. As he came near to the house, he heard music and dancing. <sup class=\"v\">26<\/sup> He called one of the servants to him, and asked what was going on. <sup class=\"v\">27<\/sup> He said to him, ‘Your brother has come, and your father has killed the fattened calf, because he has received him back safe and healthy.’ <sup class=\"v\">28<\/sup> But he was angry, and would not go in. Therefore his father came out, and begged him. <sup class=\"v\">29<\/sup> But he answered his father, ‘Behold, these many years I have served you, and I never disobeyed a commandment of yours, but you never gave me a goat, that I might celebrate with my friends. <sup class=\"v\">30<\/sup> But when this your son came, who has devoured your living with prostitutes, you killed the fattened calf for him.’"},{"type":"p","html":"<sup class=\"v\">31<\/sup> “He said to him, ‘Son, you are always with me, and all that is mine is yours. <sup class=\"v\">32<\/sup> But it was appropriate to celebrate and be glad, for this, your brother, was dead, and is alive again. He was lost, and is found.’ ”"},{"type":"q","id":"15.6","field":"q114","text":"<b>Head:<\/b> Consider the image of the angry young man. The older brother “was angry, and would not go in” (v. 28). Why do you think he was so angry? What did he misunderstand about his father?"},{"type":"q","id":"15.7","field":"q115","text":"<b>Action:<\/b> The father said, “it was appropriate to celebrate and be glad” (v. 32). Whom will you welcome or celebrate this week?"}],"prayer":"Father in heaven, you search for the lost and run to welcome them home (15:4, 20). Give me wisdom as I read, and help me rejoice when anyone comes home to you."},{"num":16,"hero":{"src":"img/luke16-hero.jpg","w":1100,"h":731,"alt":"Pages of an old handwritten account ledger"},"blocks":[{"type":"h2","text":"The Shrewd Manager"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He also said to his disciples, “There was a certain rich man who had a manager. An accusation was made to him that this man was wasting his possessions. <sup class=\"v\">2<\/sup> He called him, and said to him, ‘What is this that I hear about you? Give an accounting of your management, for you can no longer be manager.’"},{"type":"p","html":"<sup class=\"v\">3<\/sup> “The manager said within himself, ‘What will I do, seeing that my lord is taking away the management position from me? I don’t have strength to dig. I am ashamed to beg. <sup class=\"v\">4<\/sup> I know what I will do, so that when I am removed from management, they may receive me into their houses.’ <sup class=\"v\">5<\/sup> Calling each one of his lord’s debtors to him, he said to the first, ‘How much do you owe to my lord?’ <sup class=\"v\">6<\/sup> He said, ‘A hundred batos of oil.’ He said to him, ‘Take your bill, and sit down quickly and write fifty.’ <sup class=\"v\">7<\/sup> Then he said to another, ‘How much do you owe?’ He said, ‘A hundred cors of wheat.’ He said to him, ‘Take your bill, and write eighty.’"},{"type":"p","html":"<sup class=\"v\">8<\/sup> “His lord commended the dishonest manager because he had done wisely, for the children of this world are, in their own generation, wiser than the children of the light. <sup class=\"v\">9<\/sup> I tell you, make for yourselves friends by means of unrighteous mammon, so that when you fail, they may receive you into the eternal tents. <sup class=\"v\">10<\/sup> He who is faithful in a very little is faithful also in much. He who is dishonest in a very little is also dishonest in much. <sup class=\"v\">11<\/sup> If therefore you have not been faithful in the unrighteous mammon, who will commit to your trust the true riches? <sup class=\"v\">12<\/sup> If you have not been faithful in that which is another’s, who will give you that which is your own? <sup class=\"v\">13<\/sup> No servant can serve two masters, for either he will hate the one, and love the other; or else he will hold to one, and despise the other. You aren’t able to serve God and Mammon.”"},{"type":"q","id":"16.1","field":"q116","text":"<b>Head:<\/b> Look at the image that opens this chapter. The master “commended the dishonest manager because he had done wisely” (v. 8). What do you think Jesus wants us to learn from this surprising story?"},{"type":"q","id":"16.2","field":"q117","text":"<b>Action:<\/b> “He who is faithful in a very little is faithful also in much” (v. 10). Where will you be faithful in small things this week?"},{"type":"h2","text":"The Law and the Kingdom"},{"type":"img","src":"img/luke16-v14.jpg","w":1100,"h":733,"alt":"Stacks and piles of coins"},{"type":"p","html":"<sup class=\"v\">14<\/sup> The Pharisees, who were lovers of money, also heard all these things, and they scoffed at him. <sup class=\"v\">15<\/sup> He said to them, “You are those who justify yourselves in the sight of men, but God knows your hearts. For that which is exalted among men is an abomination in the sight of God. <sup class=\"v\">16<\/sup> The law and the prophets were until John. From that time the Good News of God’s Kingdom is preached, and everyone is forcing his way into it. <sup class=\"v\">17<\/sup> But it is easier for heaven and earth to pass away, than for one tiny stroke of a pen in the law to fall. <sup class=\"v\">18<\/sup> Everyone who divorces his wife and marries another commits adultery. He who marries one who is divorced from a husband commits adultery."},{"type":"q","id":"16.3","field":"q118","text":"<b>Heart:<\/b> Consider the image of the coins. The Pharisees “were lovers of money” (v. 14). Jesus said, “You aren’t able to serve God and Mammon” (v. 13). Where does money compete with God for your heart?"},{"type":"h2","text":"The Rich Man and Lazarus"},{"type":"img","src":"img/luke16-v19.jpg","w":1100,"h":733,"alt":"An old man sitting alone on a city curb"},{"type":"p","html":"<sup class=\"v\">19<\/sup> “Now there was a certain rich man, and he was clothed in purple and fine linen, living in luxury every day. <sup class=\"v\">20<\/sup> A certain beggar, named Lazarus, was taken to his gate, full of sores, <sup class=\"v\">21<\/sup> and desiring to be fed with the crumbs that fell from the rich man’s table. Yes, even the dogs came and licked his sores. <sup class=\"v\">22<\/sup> The beggar died, and he was carried away by the angels to Abraham’s bosom. The rich man also died, and was buried. <sup class=\"v\">23<\/sup> In Hades, he lifted up his eyes, being in torment, and saw Abraham far off, and Lazarus at his bosom. <sup class=\"v\">24<\/sup> He cried and said, ‘Father Abraham, have mercy on me, and send Lazarus, that he may dip the tip of his finger in water, and cool my tongue! For I am in anguish in this flame.’"},{"type":"q","id":"16.4","field":"q119","text":"<b>Action:<\/b> Consider the image of the man at the gate. A poor man named Lazarus lay at the rich man’s gate (v. 20), and the rich man did nothing. Who is at your gate? How will you help them this week?"},{"type":"img","src":"img/luke16-v25.jpg","w":1100,"h":733,"alt":"A deep canyon between steep red cliffs"},{"type":"p","html":"<sup class=\"v\">25<\/sup> “But Abraham said, ‘Son, remember that you, in your lifetime, received your good things, and Lazarus, in the same way, bad things. But here he is now comforted, and you are in anguish. <sup class=\"v\">26<\/sup> Besides all this, between us and you there is a great gulf fixed, that those who want to pass from here to you are not able, and that no one may cross over from there to us.’"},{"type":"p","html":"<sup class=\"v\">27<\/sup> “He said, ‘I ask you therefore, father, that you would send him to my father’s house; <sup class=\"v\">28<\/sup> for I have five brothers, that he may testify to them, so they won’t also come into this place of torment.’"},{"type":"p","html":"<sup class=\"v\">29<\/sup> “But Abraham said to him, ‘They have Moses and the prophets. Let them listen to them.’"},{"type":"p","html":"<sup class=\"v\">30<\/sup> “He said, ‘No, father Abraham, but if one goes to them from the dead, they will repent.’"},{"type":"p","html":"<sup class=\"v\">31<\/sup> “He said to him, ‘If they don’t listen to Moses and the prophets, neither will they be persuaded if one rises from the dead.’ ”"},{"type":"q","id":"16.5","field":"q120","text":"<b>Head:<\/b> Consider the image of the canyon. Abraham said, “between us and you there is a great gulf fixed” (v. 26). What does this story teach about the choices we make in this life?"},{"type":"q","id":"16.6","field":"q121","text":"<b>Heart:<\/b> “If they don’t listen to Moses and the prophets, neither will they be persuaded if one rises from the dead” (v. 31). What helps your heart stay open to God’s word?"}],"prayer":"God, you know our hearts (16:15). Give me wisdom as I read, and help me be faithful with what you have given me and serve you, not money (16:10, 13)."},{"num":17,"hero":{"src":"img/luke17-hero.jpg","w":1100,"h":733,"alt":"Two friends talking on a park bench"},"blocks":[{"type":"h2","text":"Forgive and Have Faith"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He said to the disciples, “It is impossible that no occasions of stumbling should come, but woe to him through whom they come! <sup class=\"v\">2<\/sup> It would be better for him if a millstone were hung around his neck, and he were thrown into the sea, rather than that he should cause one of these little ones to stumble. <sup class=\"v\">3<\/sup> Be careful. If your brother sins against you, rebuke him. If he repents, forgive him. <sup class=\"v\">4<\/sup> If he sins against you seven times in the day, and seven times returns, saying, ‘I repent,’ you shall forgive him.”"},{"type":"q","id":"17.1","field":"q122","text":"<b>Action:<\/b> Look at the image that opens this chapter. “If your brother sins against you, rebuke him. If he repents, forgive him” (v. 3). Whom do you need to forgive? What step will you take this week?"},{"type":"p","html":"<sup class=\"v\">5<\/sup> The apostles said to the Lord, “Increase our faith.”"},{"type":"p","html":"<sup class=\"v\">6<\/sup> The Lord said, “If you had faith like a grain of mustard seed, you would tell this sycamore tree, ‘Be uprooted, and be planted in the sea,’ and it would obey you."},{"type":"q","id":"17.2","field":"q123","text":"<b>Head:<\/b> The apostles said, “Increase our faith” (v. 5). Jesus answered by talking about “faith like a grain of mustard seed” (v. 6). What is Jesus teaching about faith?"},{"type":"h2","text":"Unworthy Servants"},{"type":"img","src":"img/luke17-v07.jpg","w":1100,"h":733,"alt":"A waiter carrying plates of food to a table"},{"type":"p","html":"<sup class=\"v\">7<\/sup> But who is there among you, having a servant plowing or keeping sheep, that will say when he comes in from the field, ‘Come immediately and sit down at the table,’ <sup class=\"v\">8<\/sup> and will not rather tell him, ‘Prepare my supper, clothe yourself properly, and serve me, while I eat and drink. Afterward you shall eat and drink’? <sup class=\"v\">9<\/sup> Does he thank that servant because he did the things that were commanded? I think not. <sup class=\"v\">10<\/sup> Even so you also, when you have done all the things that are commanded you, say, ‘We are unworthy servants. We have done our duty.’ ”"},{"type":"q","id":"17.3","field":"q124","text":"<b>Heart:<\/b> Consider the image of the waiter. Jesus said his servants should say, “We are unworthy servants. We have done our duty” (v. 10). How does it feel to serve God without expecting thanks?"},{"type":"h2","text":"Ten Lepers Healed"},{"type":"img","src":"img/luke17-v11.jpg","w":1100,"h":731,"alt":"A small plant with a “thank you” note"},{"type":"p","html":"<sup class=\"v\">11<\/sup> As he was on his way to Jerusalem, he was passing along the borders of Samaria and Galilee. <sup class=\"v\">12<\/sup> As he entered into a certain village, ten men who were lepers met him, who stood at a distance. <sup class=\"v\">13<\/sup> They lifted up their voices, saying, “Jesus, Master, have mercy on us!”"},{"type":"p","html":"<sup class=\"v\">14<\/sup> When he saw them, he said to them, “Go and show yourselves to the priests.” As they went, they were cleansed. <sup class=\"v\">15<\/sup> One of them, when he saw that he was healed, turned back, glorifying God with a loud voice. <sup class=\"v\">16<\/sup> He fell on his face at Jesus’ feet, giving him thanks; and he was a Samaritan. <sup class=\"v\">17<\/sup> Jesus answered, “Weren’t the ten cleansed? But where are the nine? <sup class=\"v\">18<\/sup> Were there none found who returned to give glory to God, except this foreigner?” <sup class=\"v\">19<\/sup> Then he said to him, “Get up, and go your way. Your faith has healed you.”"},{"type":"q","id":"17.4","field":"q125","text":"<b>Heart:<\/b> Consider the image of the thank-you note. One leper “turned back, glorifying God with a loud voice” (v. 15). Jesus asked, “But where are the nine?” (v. 17). Which blessings have you forgotten to thank God for?"},{"type":"q","id":"17.5","field":"q126","text":"<b>Action:<\/b> Write down three things you will thank God for this week, and tell someone about one of them."},{"type":"h2","text":"The Coming of the Kingdom"},{"type":"img","src":"img/luke17-v20.jpg","w":1100,"h":733,"alt":"Lightning flashing across a purple sky"},{"type":"p","html":"<sup class=\"v\">20<\/sup> Being asked by the Pharisees when God’s Kingdom would come, he answered them, “God’s Kingdom doesn’t come with observation; <sup class=\"v\">21<\/sup> neither will they say, ‘Look, here!’ or, ‘Look, there!’ for behold, God’s Kingdom is within you.”"},{"type":"q","id":"17.6","field":"q127","text":"<b>Head:<\/b> Jesus said, “God’s Kingdom is within you” (v. 21). What do you think he meant?"},{"type":"p","html":"<sup class=\"v\">22<\/sup> He said to the disciples, “The days will come when you will desire to see one of the days of the Son of Man, and you will not see it. <sup class=\"v\">23<\/sup> They will tell you, ‘Look, here!’ or ‘Look, there!’ Don’t go away or follow after them, <sup class=\"v\">24<\/sup> for as the lightning, when it flashes out of one part under the sky, shines to another part under the sky; so will the Son of Man be in his day. <sup class=\"v\">25<\/sup> But first, he must suffer many things and be rejected by this generation. <sup class=\"v\">26<\/sup> As it was in the days of Noah, even so will it be also in the days of the Son of Man. <sup class=\"v\">27<\/sup> They ate, they drank, they married, and they were given in marriage until the day that Noah entered into the ship, and the flood came and destroyed them all. <sup class=\"v\">28<\/sup> Likewise, even as it was in the days of Lot: they ate, they drank, they bought, they sold, they planted, they built; <sup class=\"v\">29<\/sup> but in the day that Lot went out from Sodom, it rained fire and sulfur from the sky and destroyed them all. <sup class=\"v\">30<\/sup> It will be the same way in the day that the Son of Man is revealed. <sup class=\"v\">31<\/sup> In that day, he who will be on the housetop and his goods in the house, let him not go down to take them away. Let him who is in the field likewise not turn back. <sup class=\"v\">32<\/sup> Remember Lot’s wife! <sup class=\"v\">33<\/sup> Whoever seeks to save his life loses it, but whoever loses his life preserves it. <sup class=\"v\">34<\/sup> I tell you, in that night there will be two people in one bed. One will be taken and the other will be left. <sup class=\"v\">35<\/sup> There will be two grinding grain together. One will be taken and the other will be left.”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> They, answering, asked him, “Where, Lord?”"},{"type":"q","id":"17.7","field":"q128","text":"<b>Heart:<\/b> Consider the image of the lightning. Jesus said, “so will the Son of Man be in his day” (v. 24), and he warned, “Remember Lot’s wife!” (v. 32). What things might make you look back instead of forward?"},{"type":"p","html":"He said to them, “Where the body is, there the vultures will also be gathered together.”"}],"prayer":"Father in heaven, your Son had mercy on ten lepers and welcomed the one who came back to give thanks (17:13–16). Give me wisdom as I read, and make me a grateful person."},{"num":18,"hero":{"src":"img/luke18-hero.jpg","w":1100,"h":733,"alt":"A judge’s gavel on a wooden block"},"blocks":[{"type":"h2","text":"The Persistent Widow"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He also spoke a parable to them that they must always pray, and not give up, <sup class=\"v\">2<\/sup> saying, “There was a judge in a certain city who didn’t fear God, and didn’t respect man. <sup class=\"v\">3<\/sup> A widow was in that city, and she often came to him, saying, ‘Defend me from my adversary!’ <sup class=\"v\">4<\/sup> He wouldn’t for a while, but afterward he said to himself, ‘Though I neither fear God, nor respect man, <sup class=\"v\">5<\/sup> yet because this widow bothers me, I will defend her, or else she will wear me out by her continual coming.’ ”"},{"type":"p","html":"<sup class=\"v\">6<\/sup> The Lord said, “Listen to what the unrighteous judge says. <sup class=\"v\">7<\/sup> Won’t God avenge his chosen ones who are crying out to him day and night, and yet he exercises patience with them? <sup class=\"v\">8<\/sup> I tell you that he will avenge them quickly. Nevertheless, when the Son of Man comes, will he find faith on the earth?”"},{"type":"q","id":"18.1","field":"q129","text":"<b>Action:<\/b> Look at the image that opens this chapter. Jesus told this story to show “that they must always pray, and not give up” (v. 1). What prayer will you keep praying this week without giving up?"},{"type":"q","id":"18.2","field":"q130","text":"<b>Head:<\/b> Jesus asked, “when the Son of Man comes, will he find faith on the earth?” (v. 8). Why do you think Jesus ends this story with a question about faith?"},{"type":"h2","text":"The Pharisee and the Tax Collector"},{"type":"img","src":"img/luke18-v09.jpg","w":1100,"h":734,"alt":"A man bowed in prayer between church pews"},{"type":"p","html":"<sup class=\"v\">9<\/sup> He spoke also this parable to certain people who were convinced of their own righteousness, and who despised all others. <sup class=\"v\">10<\/sup> “Two men went up into the temple to pray; one was a Pharisee, and the other was a tax collector. <sup class=\"v\">11<\/sup> The Pharisee stood and prayed to himself like this: ‘God, I thank you that I am not like the rest of men, extortionists, unrighteous, adulterers, or even like this tax collector. <sup class=\"v\">12<\/sup> I fast twice a week. I give tithes of all that I get.’ <sup class=\"v\">13<\/sup> But the tax collector, standing far away, wouldn’t even lift up his eyes to heaven, but beat his breast, saying, ‘God, be merciful to me, a sinner!’ <sup class=\"v\">14<\/sup> I tell you, this man went down to his house justified rather than the other; for everyone who exalts himself will be humbled, but he who humbles himself will be exalted.”"},{"type":"q","id":"18.3","field":"q131","text":"<b>Heart:<\/b> Consider the image of the man praying. The tax collector prayed, “God, be merciful to me, a sinner!” (v. 13). Which of the two men are you more like when you pray?"},{"type":"h2","text":"Jesus Blesses Children"},{"type":"img","src":"img/luke18-v15.jpg","w":1100,"h":733,"alt":"A little girl running happily through a field"},{"type":"p","html":"<sup class=\"v\">15<\/sup> They were also bringing their babies to him, that he might touch them. But when the disciples saw it, they rebuked them. <sup class=\"v\">16<\/sup> Jesus summoned them, saying, “Allow the little children to come to me, and don’t hinder them, for God’s Kingdom belongs to such as these. <sup class=\"v\">17<\/sup> Most certainly, I tell you, whoever doesn’t receive God’s Kingdom like a little child, he will in no way enter into it.”"},{"type":"q","id":"18.4","field":"q132","text":"<b>Heart:<\/b> Consider the image of the child running. Jesus said, “Allow the little children to come to me” (v. 16). What would it mean for you to receive God’s Kingdom like a little child (v. 17)?"},{"type":"h2","text":"The Rich Ruler"},{"type":"p","html":"<sup class=\"v\">18<\/sup> A certain ruler asked him, saying, “Good Teacher, what shall I do to inherit eternal life?”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> Jesus asked him, “Why do you call me good? No one is good, except one: God. <sup class=\"v\">20<\/sup> You know the commandments: ‘Don’t commit adultery,’ ‘Don’t murder,’ ‘Don’t steal,’ ‘Don’t give false testimony,’ ‘Honor your father and your mother.’ ”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> He said, “I have observed all these things from my youth up.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> When Jesus heard these things, he said to him, “You still lack one thing. Sell all that you have, and distribute it to the poor. Then you will have treasure in heaven; then come, follow me.”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> But when he heard these things, he became very sad, for he was very rich."},{"type":"p","html":"<sup class=\"v\">24<\/sup> Jesus, seeing that he became very sad, said, “How hard it is for those who have riches to enter into God’s Kingdom! <sup class=\"v\">25<\/sup> For it is easier for a camel to enter in through a needle’s eye than for a rich man to enter into God’s Kingdom.”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> Those who heard it said, “Then who can be saved?”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> But he said, “The things which are impossible with men are possible with God.”"},{"type":"q","id":"18.5","field":"q133","text":"<b>Head:<\/b> “The things which are impossible with men are possible with God” (v. 27). Why was it so hard for the rich ruler to follow Jesus?"},{"type":"p","html":"<sup class=\"v\">28<\/sup> Peter said, “Look, we have left everything and followed you.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> He said to them, “Most certainly I tell you, there is no one who has left house, or wife, or brothers, or parents, or children, for God’s Kingdom’s sake, <sup class=\"v\">30<\/sup> who will not receive many times more in this time, and in the world to come, eternal life.”"},{"type":"q","id":"18.6","field":"q134","text":"<b>Action:<\/b> Peter said, “Look, we have left everything and followed you” (v. 28). What will you let go of this week in order to follow Jesus more freely?"},{"type":"h2","text":"Jesus Foretells His Death"},{"type":"p","html":"<sup class=\"v\">31<\/sup> He took the twelve aside, and said to them, “Behold, we are going up to Jerusalem, and all the things that are written through the prophets concerning the Son of Man will be completed. <sup class=\"v\">32<\/sup> For he will be delivered up to the Gentiles, will be mocked, treated shamefully, and spit on. <sup class=\"v\">33<\/sup> They will scourge and kill him. On the third day, he will rise again.”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> They understood none of these things. This saying was hidden from them, and they didn’t understand the things that were said."},{"type":"h2","text":"A Blind Beggar Sees"},{"type":"img","src":"img/luke18-v35.jpg","w":1100,"h":733,"alt":"An older man’s hand resting on a wooden cane"},{"type":"p","html":"<sup class=\"v\">35<\/sup> As he came near Jericho, a certain blind man sat by the road, begging. <sup class=\"v\">36<\/sup> Hearing a multitude going by, he asked what this meant. <sup class=\"v\">37<\/sup> They told him that Jesus of Nazareth was passing by. <sup class=\"v\">38<\/sup> He cried out, “Jesus, you son of David, have mercy on me!” <sup class=\"v\">39<\/sup> Those who led the way rebuked him, that he should be quiet; but he cried out all the more, “You son of David, have mercy on me!”"},{"type":"p","html":"<sup class=\"v\">40<\/sup> Standing still, Jesus commanded him to be brought to him. When he had come near, he asked him, <sup class=\"v\">41<\/sup> “What do you want me to do?”"},{"type":"p","html":"He said, “Lord, that I may see again.”"},{"type":"p","html":"<sup class=\"v\">42<\/sup> Jesus said to him, “Receive your sight. Your faith has healed you.”"},{"type":"p","html":"<sup class=\"v\">43<\/sup> Immediately he received his sight and followed him, glorifying God. All the people, when they saw it, praised God."},{"type":"q","id":"18.7","field":"q135","text":"<b>Heart:<\/b> Consider the image of the man with the cane. Jesus asked the blind beggar, “What do you want me to do?” (v. 41). How would you answer Jesus today?"}],"prayer":"God, you hear those who cry out to you day and night, and you show mercy to the humble (18:7, 13–14). Give me wisdom as I read, and help me pray and not give up (18:1)."},{"num":19,"hero":{"src":"img/luke19-hero.jpg","w":1100,"h":733,"alt":"A child climbing a tree"},"blocks":[{"type":"h2","text":"Jesus and Zacchaeus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He entered and was passing through Jericho. <sup class=\"v\">2<\/sup> There was a man named Zacchaeus. He was a chief tax collector, and he was rich. <sup class=\"v\">3<\/sup> He was trying to see who Jesus was, and couldn’t because of the crowd, because he was short. <sup class=\"v\">4<\/sup> He ran on ahead, and climbed up into a sycamore tree to see him, for he was going to pass that way. <sup class=\"v\">5<\/sup> When Jesus came to the place, he looked up and saw him, and said to him, “Zacchaeus, hurry and come down, for today I must stay at your house.” <sup class=\"v\">6<\/sup> He hurried, came down, and received him joyfully. <sup class=\"v\">7<\/sup> When they saw it, they all murmured, saying, “He has gone in to lodge with a man who is a sinner.”"},{"type":"q","id":"19.1","field":"q136","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Zacchaeus “ran on ahead, and climbed up into a sycamore tree to see him” (v. 4). How far would you go in order to see Jesus?"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Zacchaeus stood and said to the Lord, “Behold, Lord, half of my goods I give to the poor. If I have wrongfully exacted anything of anyone, I restore four times as much.”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Jesus said to him, “Today, salvation has come to this house, because he also is a son of Abraham. <sup class=\"v\">10<\/sup> For the Son of Man came to seek and to save that which was lost.”"},{"type":"q","id":"19.2","field":"q137","text":"<b>Head:<\/b> Jesus said, “Zacchaeus, hurry and come down, for today I must stay at your house” (v. 5). Why do you think Jesus chose Zacchaeus’ house?"},{"type":"q","id":"19.3","field":"q138","text":"<b>Action:<\/b> Zacchaeus said, “Behold, Lord, half of my goods I give to the poor” (v. 8), and he promised to repay anyone he had cheated. What wrong will you make right this week?"},{"type":"q","id":"19.4","field":"q139","text":"<b>Heart:<\/b> “For the Son of Man came to seek and to save that which was lost” (v. 10). How does this verse describe your own story?"},{"type":"h2","text":"The Story of the Ten Servants"},{"type":"img","src":"img/luke19-v11.jpg","w":1100,"h":733,"alt":"Stacks of coins growing taller"},{"type":"p","html":"<sup class=\"v\">11<\/sup> As they heard these things, he went on and told a parable, because he was near Jerusalem, and they supposed that God’s Kingdom would be revealed immediately. <sup class=\"v\">12<\/sup> He said therefore, “A certain nobleman went into a far country to receive for himself a kingdom and to return. <sup class=\"v\">13<\/sup> He called ten servants of his and gave them ten mina coins, and told them, ‘Conduct business until I come.’ <sup class=\"v\">14<\/sup> But his citizens hated him, and sent an envoy after him, saying, ‘We don’t want this man to reign over us.’"},{"type":"p","html":"<sup class=\"v\">15<\/sup> “When he had come back again, having received the kingdom, he commanded these servants, to whom he had given the money, to be called to him, that he might know what they had gained by conducting business. <sup class=\"v\">16<\/sup> The first came before him, saying, ‘Lord, your mina has made ten more minas.’"},{"type":"p","html":"<sup class=\"v\">17<\/sup> “He said to him, ‘Well done, you good servant! Because you were found faithful with very little, you shall have authority over ten cities.’"},{"type":"p","html":"<sup class=\"v\">18<\/sup> “The second came, saying, ‘Your mina, Lord, has made five minas.’"},{"type":"p","html":"<sup class=\"v\">19<\/sup> “So he said to him, ‘And you are to be over five cities.’ <sup class=\"v\">20<\/sup> Another came, saying, ‘Lord, behold, your mina, which I kept laid away in a handkerchief, <sup class=\"v\">21<\/sup> for I feared you, because you are an exacting man. You take up that which you didn’t lay down, and reap that which you didn’t sow.’"},{"type":"p","html":"<sup class=\"v\">22<\/sup> “He said to him, ‘Out of your own mouth I will judge you, you wicked servant! You knew that I am an exacting man, taking up that which I didn’t lay down, and reaping that which I didn’t sow. <sup class=\"v\">23<\/sup> Then why didn’t you deposit my money in the bank, and at my coming, I might have earned interest on it?’ <sup class=\"v\">24<\/sup> He said to those who stood by, ‘Take the mina away from him and give it to him who has the ten minas.’"},{"type":"p","html":"<sup class=\"v\">25<\/sup> “They said to him, ‘Lord, he has ten minas!’ <sup class=\"v\">26<\/sup> ‘For I tell you that to everyone who has, will more be given; but from him who doesn’t have, even that which he has will be taken away from him. <sup class=\"v\">27<\/sup> But bring those enemies of mine who didn’t want me to reign over them here, and kill them before me.’ ”"},{"type":"q","id":"19.5","field":"q140","text":"<b>Action:<\/b> Consider the image of the coins. The master said, “Well done, you good servant! Because you were found faithful with very little” (v. 17). What has God entrusted to you? How will you use it this week?"},{"type":"h2","text":"Jesus Enters Jerusalem"},{"type":"img","src":"img/luke19-v28.jpg","w":1100,"h":697,"alt":"A donkey grazing on grass"},{"type":"p","html":"<sup class=\"v\">28<\/sup> Having said these things, he went on ahead, going up to Jerusalem."},{"type":"p","html":"<sup class=\"v\">29<\/sup> When he came near to Bethsphage and Bethany, at the mountain that is called Olivet, he sent two of his disciples, <sup class=\"v\">30<\/sup> saying, “Go your way into the village on the other side, in which, as you enter, you will find a colt tied, which no man had ever sat upon. Untie it and bring it. <sup class=\"v\">31<\/sup> If anyone asks you, ‘Why are you untying it?’ say to him: ‘The Lord needs it.’ ”"},{"type":"p","html":"<sup class=\"v\">32<\/sup> Those who were sent went away, and found things just as he had told them. <sup class=\"v\">33<\/sup> As they were untying the colt, its owners said to them, “Why are you untying the colt?” <sup class=\"v\">34<\/sup> They said, “The Lord needs it.” <sup class=\"v\">35<\/sup> Then they brought it to Jesus. They threw their cloaks on the colt, and sat Jesus on them. <sup class=\"v\">36<\/sup> As he went, they spread their cloaks on the road. <sup class=\"v\">37<\/sup> As he was now getting near, at the descent of the Mount of Olives, the whole multitude of the disciples began to rejoice and praise God with a loud voice for all the mighty works which they had seen, <sup class=\"v\">38<\/sup> saying, “Blessed is the King who comes in the name of the Lord! Peace in heaven, and glory in the highest!”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> Some of the Pharisees from the multitude said to him, “Teacher, rebuke your disciples!”"},{"type":"p","html":"<sup class=\"v\">40<\/sup> He answered them, “I tell you that if these were silent, the stones would cry out.”"},{"type":"q","id":"19.6","field":"q141","text":"<b>Head:<\/b> Consider the image of the donkey. Jesus rode into Jerusalem on a colt, and when some told him to quiet his disciples, he said, “if these were silent, the stones would cry out” (v. 40). What was Jesus showing about who he is?"},{"type":"h2","text":"Jesus Weeps over the City"},{"type":"img","src":"img/luke19-v41.jpg","w":1100,"h":619,"alt":"A hilltop town at dusk"},{"type":"p","html":"<sup class=\"v\">41<\/sup> When he came near, he saw the city and wept over it, <sup class=\"v\">42<\/sup> saying, “If you, even you, had known today the things which belong to your peace! But now, they are hidden from your eyes. <sup class=\"v\">43<\/sup> For the days will come on you, when your enemies will throw up a barricade against you, surround you, hem you in on every side, <sup class=\"v\">44<\/sup> and will dash you and your children within you to the ground. They will not leave in you one stone on another, because you didn’t know the time of your visitation.”"},{"type":"q","id":"19.7","field":"q142","text":"<b>Heart:<\/b> Consider the image of the city. “When he came near, he saw the city and wept over it” (v. 41). What do you think makes Jesus weep today? Does it move you?"},{"type":"h2","text":"Jesus Clears the Temple"},{"type":"p","html":"<sup class=\"v\">45<\/sup> He entered into the temple, and began to drive out those who bought and sold in it, <sup class=\"v\">46<\/sup> saying to them, “It is written, ‘My house is a house of prayer,’ but you have made it a ‘den of robbers’!”"},{"type":"p","html":"<sup class=\"v\">47<\/sup> He was teaching daily in the temple, but the chief priests, the scribes, and the leading men among the people sought to destroy him. <sup class=\"v\">48<\/sup> They couldn’t find what they might do, for all the people hung on to every word that he said."},{"type":"q","id":"19.8","field":"q143","text":"<b>Head:<\/b> Jesus said, “My house is a house of prayer” (v. 46). What was Jesus angry about in the temple?"}],"prayer":"Father in heaven, your Son came “to seek and to save that which was lost” (19:10). Give me wisdom as I read, and help me welcome him gladly, as Zacchaeus did (19:6)."},{"num":20,"hero":{"src":"img/luke20-hero.jpg","w":1100,"h":733,"alt":"Rows of a vineyard in autumn"},"blocks":[{"type":"h2","text":"By What Authority?"},{"type":"p","html":"<sup class=\"v\">1<\/sup> On one of those days, as he was teaching the people in the temple and preaching the Good News, the priests and scribes came to him with the elders. <sup class=\"v\">2<\/sup> They asked him, “Tell us: by what authority do you do these things? Or who is giving you this authority?”"},{"type":"p","html":"<sup class=\"v\">3<\/sup> He answered them, “I also will ask you one question. Tell me: <sup class=\"v\">4<\/sup> the baptism of John, was it from heaven, or from men?”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> They reasoned with themselves, saying, “If we say, ‘From heaven,’ he will say, ‘Why didn’t you believe him?’ <sup class=\"v\">6<\/sup> But if we say, ‘From men,’ all the people will stone us, for they are persuaded that John was a prophet.” <sup class=\"v\">7<\/sup> They answered that they didn’t know where it was from."},{"type":"p","html":"<sup class=\"v\">8<\/sup> Jesus said to them, “Neither will I tell you by what authority I do these things.”"},{"type":"q","id":"20.1","field":"q144","text":"<b>Head:<\/b> The leaders asked Jesus, “by what authority do you do these things?” (v. 2). Why do you think they refused to answer his question about John?"},{"type":"h2","text":"The Story of the Wicked Tenants"},{"type":"p","html":"<sup class=\"v\">9<\/sup> He began to tell the people this parable. “A man planted a vineyard, and rented it out to some farmers, and went into another country for a long time. <sup class=\"v\">10<\/sup> At the proper season, he sent a servant to the farmers to collect his share of the fruit of the vineyard. But the farmers beat him, and sent him away empty. <sup class=\"v\">11<\/sup> He sent yet another servant, and they also beat him, and treated him shamefully, and sent him away empty. <sup class=\"v\">12<\/sup> He sent yet a third, and they also wounded him, and threw him out. <sup class=\"v\">13<\/sup> The lord of the vineyard said, ‘What shall I do? I will send my beloved son. It may be that seeing him, they will respect him.’"},{"type":"p","html":"<sup class=\"v\">14<\/sup> “But when the farmers saw him, they reasoned among themselves, saying, ‘This is the heir. Come, let’s kill him, that the inheritance may be ours.’ <sup class=\"v\">15<\/sup> They threw him out of the vineyard and killed him. What therefore will the lord of the vineyard do to them? <sup class=\"v\">16<\/sup> He will come and destroy these farmers, and will give the vineyard to others.”"},{"type":"q","id":"20.2","field":"q145","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The owner of the vineyard said, “I will send my beloved son. It may be that seeing him, they will respect him” (v. 13). What does this story show about God’s patience and love?"},{"type":"p","html":"When they heard that, they said, “May that never be!”"},{"type":"img","src":"img/luke20-v17.jpg","w":1100,"h":702,"alt":"The stone corner of an old wall"},{"type":"p","html":"<sup class=\"v\">17<\/sup> But he looked at them and said, “Then what is this that is written,"},{"type":"poem","lines":["‘The stone which the builders rejected","was made the chief cornerstone?’","<sup class=\"v\">18<\/sup> Everyone who falls on that stone will be broken to pieces,","but it will crush whomever it falls on to dust.”"]},{"type":"q","id":"20.3","field":"q146","text":"<b>Head:<\/b> Consider the image of the cornerstone. “The stone which the builders rejected was made the chief cornerstone” (v. 17). What does it mean that Jesus is the cornerstone?"},{"type":"h2","text":"Paying Taxes to Caesar"},{"type":"img","src":"img/luke20-v19.jpg","w":1100,"h":825,"alt":"An ancient gold coin with a ruler’s portrait"},{"type":"p","html":"<sup class=\"v\">19<\/sup> The chief priests and the scribes sought to lay hands on him that very hour, but they feared the people—for they knew he had spoken this parable against them. <sup class=\"v\">20<\/sup> They watched him and sent out spies, who pretended to be righteous, that they might trap him in something he said, so as to deliver him up to the power and authority of the governor. <sup class=\"v\">21<\/sup> They asked him, “Teacher, we know that you say and teach what is right, and aren’t partial to anyone, but truly teach the way of God. <sup class=\"v\">22<\/sup> Is it lawful for us to pay taxes to Caesar, or not?”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> But he perceived their craftiness, and said to them, “Why do you test me? <sup class=\"v\">24<\/sup> Show me a denarius. Whose image and inscription are on it?”"},{"type":"p","html":"They answered, “Caesar’s.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> He said to them, “Then give to Caesar the things that are Caesar’s, and to God the things that are God’s.”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> They weren’t able to trap him in his words before the people. They marveled at his answer and were silent."},{"type":"q","id":"20.4","field":"q147","text":"<b>Action:<\/b> Consider the image of the coin. Jesus said, “Then give to Caesar the things that are Caesar’s, and to God the things that are God’s” (v. 25). What do you owe to God? How will you give it to him this week?"},{"type":"q","id":"20.5","field":"q148","text":"<b>Heart:<\/b> “They marveled at his answer and were silent” (v. 26). When has a word from Jesus silenced your own arguments?"},{"type":"h2","text":"A Question about the Resurrection"},{"type":"img","src":"img/luke20-v27.jpg","w":1100,"h":734,"alt":"A small green sprout rising from dark soil"},{"type":"p","html":"<sup class=\"v\">27<\/sup> Some of the Sadducees came to him, those who deny that there is a resurrection. <sup class=\"v\">28<\/sup> They asked him, “Teacher, Moses wrote to us that if a man’s brother dies having a wife, and he is childless, his brother should take the wife and raise up children for his brother. <sup class=\"v\">29<\/sup> There were therefore seven brothers. The first took a wife, and died childless. <sup class=\"v\">30<\/sup> The second took her as wife, and he died childless. <sup class=\"v\">31<\/sup> The third took her, and likewise the seven all left no children, and died. <sup class=\"v\">32<\/sup> Afterward the woman also died. <sup class=\"v\">33<\/sup> Therefore in the resurrection whose wife of them will she be? For the seven had her as a wife.”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> Jesus said to them, “The children of this age marry, and are given in marriage. <sup class=\"v\">35<\/sup> But those who are considered worthy to attain to that age and the resurrection from the dead neither marry nor are given in marriage. <sup class=\"v\">36<\/sup> For they can’t die any more, for they are like the angels, and are children of God, being children of the resurrection. <sup class=\"v\">37<\/sup> But that the dead are raised, even Moses showed at the bush, when he called the Lord ‘The God of Abraham, the God of Isaac, and the God of Jacob.’ <sup class=\"v\">38<\/sup> Now he is not the God of the dead, but of the living, for all are alive to him.”"},{"type":"q","id":"20.6","field":"q149","text":"<b>Heart:<\/b> Consider the image of the sprout. Jesus said, “Now he is not the God of the dead, but of the living, for all are alive to him” (v. 38). How does the hope of resurrection comfort you?"},{"type":"p","html":"<sup class=\"v\">39<\/sup> Some of the scribes answered, “Teacher, you speak well.” <sup class=\"v\">40<\/sup> They didn’t dare to ask him any more questions."},{"type":"h2","text":"Whose Son Is the Christ?"},{"type":"p","html":"<sup class=\"v\">41<\/sup> He said to them, “Why do they say that the Christ is David’s son? <sup class=\"v\">42<\/sup> David himself says in the book of Psalms,"},{"type":"poem","lines":["‘The Lord said to my Lord,","“Sit at my right hand,","<sup class=\"v\">43<\/sup> until I make your enemies the footstool of your feet.” ’"]},{"type":"p","html":"<sup class=\"v\">44<\/sup> “David therefore calls him Lord, so how is he his son?”"},{"type":"h2","text":"Beware of Showy Religion"},{"type":"p","html":"<sup class=\"v\">45<\/sup> In the hearing of all the people, he said to his disciples, <sup class=\"v\">46<\/sup> “Beware of those scribes who like to walk in long robes, and love greetings in the marketplaces, the best seats in the synagogues, and the best places at feasts; <sup class=\"v\">47<\/sup> who devour widows’ houses, and for a pretense make long prayers: these will receive greater condemnation.”"},{"type":"q","id":"20.7","field":"q150","text":"<b>Action:<\/b> Jesus warned against those who “devour widows’ houses, and for a pretense make long prayers” (v. 47). How will you make sure your faith is real and not for show this week?"}],"prayer":"God, you are “not the God of the dead, but of the living” (20:38). Give me wisdom as I read, and help me give you what belongs to you (20:25)."},{"num":21,"hero":{"src":"img/luke21-hero.jpg","w":1100,"h":733,"alt":"Two small copper coins"},"blocks":[{"type":"h2","text":"The Widow’s Offering"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He looked up and saw the rich people who were putting their gifts into the treasury. <sup class=\"v\">2<\/sup> He saw a certain poor widow casting in two small brass coins. <sup class=\"v\">3<\/sup> He said, “Truly I tell you, this poor widow put in more than all of them, <sup class=\"v\">4<\/sup> for all these put in gifts for God from their abundance, but she, out of her poverty, put in all that she had to live on.”"},{"type":"q","id":"21.1","field":"q151","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Jesus said, “this poor widow put in more than all of them” (v. 3). What do you think God sees when you give?"},{"type":"q","id":"21.2","field":"q152","text":"<b>Action:<\/b> She “put in all that she had to live on” (v. 4). What gift, costly to you, will you give this week?"},{"type":"h2","text":"Signs of the End"},{"type":"img","src":"img/luke21-v05.jpg","w":1100,"h":619,"alt":"The ruins of a great stone abbey"},{"type":"p","html":"<sup class=\"v\">5<\/sup> As some were talking about the temple and how it was decorated with beautiful stones and gifts, he said, <sup class=\"v\">6<\/sup> “As for these things which you see, the days will come, in which there will not be left here one stone on another that will not be thrown down.”"},{"type":"p","html":"<sup class=\"v\">7<\/sup> They asked him, “Teacher, so when will these things be? What is the sign that these things are about to happen?”"},{"type":"p","html":"<sup class=\"v\">8<\/sup> He said, “Watch out that you don’t get led astray, for many will come in my name, saying, ‘I am he,’ and, ‘The time is at hand.’ Therefore don’t follow them. <sup class=\"v\">9<\/sup> When you hear of wars and disturbances, don’t be terrified, for these things must happen first, but the end won’t come immediately.”"},{"type":"p","html":"<sup class=\"v\">10<\/sup> Then he said to them, “Nation will rise against nation, and kingdom against kingdom. <sup class=\"v\">11<\/sup> There will be great earthquakes, famines, and plagues in various places. There will be terrors and great signs from heaven. <sup class=\"v\">12<\/sup> But before all these things, they will lay their hands on you and will persecute you, delivering you up to synagogues and prisons, bringing you before kings and governors for my name’s sake. <sup class=\"v\">13<\/sup> It will turn out as a testimony for you. <sup class=\"v\">14<\/sup> Settle it therefore in your hearts not to meditate beforehand how to answer, <sup class=\"v\">15<\/sup> for I will give you a mouth and wisdom which all your adversaries will not be able to withstand or to contradict. <sup class=\"v\">16<\/sup> You will be handed over even by parents, brothers, relatives, and friends. They will cause some of you to be put to death. <sup class=\"v\">17<\/sup> You will be hated by all men for my name’s sake. <sup class=\"v\">18<\/sup> And not a hair of your head will perish."},{"type":"p","html":"<sup class=\"v\">19<\/sup> “By your endurance you will win your lives."},{"type":"q","id":"21.3","field":"q153","text":"<b>Head:<\/b> Consider the image of the ruins. Jesus said of the beautiful temple, “there will not be left here one stone on another” (v. 6). Why do you think Jesus warned them about this?"},{"type":"q","id":"21.4","field":"q154","text":"<b>Heart:<\/b> “By your endurance you will win your lives” (v. 19). Where do you need endurance right now?"},{"type":"h2","text":"Jerusalem Will Fall"},{"type":"p","html":"<sup class=\"v\">20<\/sup> “But when you see Jerusalem surrounded by armies, then know that its desolation is at hand. <sup class=\"v\">21<\/sup> Then let those who are in Judea flee to the mountains. Let those who are in the middle of her depart. Let those who are in the country not enter therein. <sup class=\"v\">22<\/sup> For these are days of vengeance, that all things which are written may be fulfilled. <sup class=\"v\">23<\/sup> Woe to those who are pregnant and to those who nurse infants in those days! For there will be great distress in the land, and wrath to this people. <sup class=\"v\">24<\/sup> They will fall by the edge of the sword, and will be led captive into all the nations. Jerusalem will be trampled down by the Gentiles, until the times of the Gentiles are fulfilled."},{"type":"h2","text":"The Coming of the Son of Man"},{"type":"img","src":"img/luke21-v25.jpg","w":1100,"h":825,"alt":"Storm clouds and rays of light over a rough sea"},{"type":"p","html":"<sup class=\"v\">25<\/sup> There will be signs in the sun, moon, and stars; and on the earth anxiety of nations, in perplexity for the roaring of the sea and the waves; <sup class=\"v\">26<\/sup> men fainting for fear, and for expectation of the things which are coming on the world: for the powers of the heavens will be shaken. <sup class=\"v\">27<\/sup> Then they will see the Son of Man coming in a cloud with power and great glory. <sup class=\"v\">28<\/sup> But when these things begin to happen, look up and lift up your heads, because your redemption is near.”"},{"type":"q","id":"21.5","field":"q155","text":"<b>Heart:<\/b> Consider the image of the storm clouds. “look up and lift up your heads, because your redemption is near” (v. 28). How does this promise help you face frightening news?"},{"type":"h2","text":"The Lesson of the Fig Tree"},{"type":"img","src":"img/luke21-v29.jpg","w":1100,"h":734,"alt":"New leaves budding on a branch"},{"type":"p","html":"<sup class=\"v\">29<\/sup> He told them a parable. “See the fig tree and all the trees. <sup class=\"v\">30<\/sup> When they are already budding, you see it and know by your own selves that the summer is already near. <sup class=\"v\">31<\/sup> Even so you also, when you see these things happening, know that God’s Kingdom is near. <sup class=\"v\">32<\/sup> Most certainly I tell you, this generation will not pass away until all things are accomplished. <sup class=\"v\">33<\/sup> Heaven and earth will pass away, but my words will by no means pass away."},{"type":"q","id":"21.6","field":"q156","text":"<b>Head:<\/b> Consider the image of the budding leaves. “Heaven and earth will pass away, but my words will by no means pass away” (v. 33). Why are Jesus’ words more lasting than anything else?"},{"type":"h2","text":"Stay Awake"},{"type":"p","html":"<sup class=\"v\">34<\/sup> “So be careful, or your hearts will be loaded down with carousing, drunkenness, and cares of this life, and that day will come on you suddenly. <sup class=\"v\">35<\/sup> For it will come like a snare on all those who dwell on the surface of all the earth. <sup class=\"v\">36<\/sup> Therefore be watchful all the time, praying that you may be counted worthy to escape all these things that will happen, and to stand before the Son of Man.”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> Every day Jesus was teaching in the temple, and every night he would go out and spend the night on the mountain that is called Olivet. <sup class=\"v\">38<\/sup> All the people came early in the morning to him in the temple to hear him."},{"type":"q","id":"21.7","field":"q157","text":"<b>Action:<\/b> Jesus told his disciples to watch, “praying that you may be counted worthy” (v. 36). What will help you stay spiritually awake this week?"}],"prayer":"Father in heaven, your Son promised that his words “will by no means pass away” (21:33). Give me wisdom as I read, and keep me watchful and ready (21:36)."},{"num":22,"hero":{"src":"img/luke22-hero.jpg","w":1100,"h":825,"alt":"Bread and a wooden cup on a table"},"blocks":[{"type":"h2","text":"Judas Agrees to Betray Jesus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now the feast of unleavened bread, which is called the Passover, was approaching. <sup class=\"v\">2<\/sup> The chief priests and the scribes sought how they might put him to death, for they feared the people. <sup class=\"v\">3<\/sup> Satan entered into Judas, who was also called Iscariot, who was counted with the twelve. <sup class=\"v\">4<\/sup> He went away, and talked with the chief priests and captains about how he might deliver him to them. <sup class=\"v\">5<\/sup> They were glad, and agreed to give him money. <sup class=\"v\">6<\/sup> He consented, and sought an opportunity to deliver him to them in the absence of the multitude."},{"type":"q","id":"22.1","field":"q158","text":"<b>Head:<\/b> “Satan entered into Judas” (v. 3), and he went to the chief priests to betray Jesus (v. 4). How can someone so close to Jesus turn against him?"},{"type":"h2","text":"The Last Supper"},{"type":"p","html":"<sup class=\"v\">7<\/sup> The day of unleavened bread came, on which the Passover must be sacrificed. <sup class=\"v\">8<\/sup> Jesus sent Peter and John, saying, “Go and prepare the Passover for us, that we may eat.”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> They said to him, “Where do you want us to prepare?”"},{"type":"p","html":"<sup class=\"v\">10<\/sup> He said to them, “Behold, when you have entered into the city, a man carrying a pitcher of water will meet you. Follow him into the house which he enters. <sup class=\"v\">11<\/sup> Tell the master of the house, ‘The Teacher says to you, “Where is the guest room, where I may eat the Passover with my disciples?” ’ <sup class=\"v\">12<\/sup> He will show you a large, furnished upper room. Make preparations there.”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> They went, found things as Jesus had told them, and they prepared the Passover. <sup class=\"v\">14<\/sup> When the hour had come, he sat down with the twelve apostles. <sup class=\"v\">15<\/sup> He said to them, “I have earnestly desired to eat this Passover with you before I suffer, <sup class=\"v\">16<\/sup> for I tell you, I will no longer by any means eat of it until it is fulfilled in God’s Kingdom.” <sup class=\"v\">17<\/sup> He received a cup, and when he had given thanks, he said, “Take this, and share it among yourselves, <sup class=\"v\">18<\/sup> for I tell you, I will not drink at all again from the fruit of the vine, until God’s Kingdom comes.”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> He took bread, and when he had given thanks, he broke, and gave it to them, saying, “This is my body which is given for you. Do this in memory of me.” <sup class=\"v\">20<\/sup> Likewise, he took the cup after supper, saying, “This cup is the new covenant in my blood, which is poured out for you. <sup class=\"v\">21<\/sup> But behold, the hand of him who betrays me is with me on the table. <sup class=\"v\">22<\/sup> The Son of Man indeed goes, as it has been determined, but woe to that man through whom he is betrayed!”"},{"type":"q","id":"22.2","field":"q159","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Jesus took bread and said, “This is my body which is given for you. Do this in memory of me” (v. 19). What does the Lord’s Supper mean to you?"},{"type":"p","html":"<sup class=\"v\">23<\/sup> They began to question among themselves, which of them it was who would do this thing."},{"type":"h2","text":"Who Is the Greatest?"},{"type":"img","src":"img/luke22-v24.jpg","w":1100,"h":733,"alt":"Hands serving plates of food to people in need"},{"type":"p","html":"<sup class=\"v\">24<\/sup> A dispute also arose among them, which of them was considered to be greatest. <sup class=\"v\">25<\/sup> He said to them, “The kings of the nations lord it over them, and those who have authority over them are called ‘benefactors.’ <sup class=\"v\">26<\/sup> But not so with you. But one who is the greater among you, let him become as the younger, and one who is governing, as one who serves. <sup class=\"v\">27<\/sup> For who is greater, one who sits at the table, or one who serves? Isn’t it he who sits at the table? But I am among you as one who serves. <sup class=\"v\">28<\/sup> But you are those who have continued with me in my trials. <sup class=\"v\">29<\/sup> I confer on you a kingdom, even as my Father conferred on me, <sup class=\"v\">30<\/sup> that you may eat and drink at my table in my Kingdom. You will sit on thrones, judging the twelve tribes of Israel.”"},{"type":"q","id":"22.3","field":"q160","text":"<b>Action:<\/b> Consider the image of serving. Jesus said, “But I am among you as one who serves” (v. 27). Where will you serve this week instead of waiting to be served?"},{"type":"h2","text":"Jesus Foretells Peter’s Denial"},{"type":"p","html":"<sup class=\"v\">31<\/sup> The Lord said, “Simon, Simon, behold, Satan asked to have all of you, that he might sift you as wheat, <sup class=\"v\">32<\/sup> but I prayed for you, that your faith wouldn’t fail. You, when once you have turned again, establish your brothers.”"},{"type":"p","html":"<sup class=\"v\">33<\/sup> He said to him, “Lord, I am ready to go with you both to prison and to death!”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> He said, “I tell you, Peter, the rooster will by no means crow today until you deny that you know me three times.”"},{"type":"q","id":"22.4","field":"q161","text":"<b>Heart:<\/b> Jesus said to Peter, “but I prayed for you, that your faith wouldn’t fail” (v. 32). How does it feel to know that Jesus prays for you when you are weak?"},{"type":"p","html":"<sup class=\"v\">35<\/sup> He said to them, “When I sent you out without purse, wallet, and sandals, did you lack anything?”"},{"type":"p","html":"They said, “Nothing.”"},{"type":"p","html":"<sup class=\"v\">36<\/sup> Then he said to them, “But now, whoever has a purse, let him take it, and likewise a wallet. Whoever has none, let him sell his cloak, and buy a sword. <sup class=\"v\">37<\/sup> For I tell you that this which is written must still be fulfilled in me: ‘He was counted with transgressors.’ For that which concerns me has an end.”"},{"type":"p","html":"<sup class=\"v\">38<\/sup> They said, “Lord, behold, here are two swords.”"},{"type":"p","html":"He said to them, “That is enough.”"},{"type":"h2","text":"Jesus Prays on the Mount of Olives"},{"type":"img","src":"img/luke22-v39.jpg","w":1100,"h":733,"alt":"Ancient olive trees in a grove"},{"type":"p","html":"<sup class=\"v\">39<\/sup> He came out and went, as his custom was, to the Mount of Olives. His disciples also followed him. <sup class=\"v\">40<\/sup> When he was at the place, he said to them, “Pray that you don’t enter into temptation.”"},{"type":"p","html":"<sup class=\"v\">41<\/sup> He was withdrawn from them about a stone’s throw, and he knelt down and prayed, <sup class=\"v\">42<\/sup> saying, “Father, if you are willing, remove this cup from me. Nevertheless, not my will, but yours, be done.”"},{"type":"p","html":"<sup class=\"v\">43<\/sup> An angel from heaven appeared to him, strengthening him. <sup class=\"v\">44<\/sup> Being in agony he prayed more earnestly. His sweat became like great drops of blood falling down on the ground."},{"type":"p","html":"<sup class=\"v\">45<\/sup> When he rose up from his prayer, he came to the disciples, and found them sleeping because of grief, <sup class=\"v\">46<\/sup> and said to them, “Why do you sleep? Rise and pray that you may not enter into temptation.”"},{"type":"q","id":"22.5","field":"q162","text":"<b>Heart:<\/b> Consider the image of the olive trees. Jesus prayed, “Father, if you are willing, remove this cup from me. Nevertheless, not my will, but yours, be done” (v. 42). What is hardest about praying “not my will, but yours”?"},{"type":"q","id":"22.6","field":"q163","text":"<b>Action:<\/b> Jesus said to his sleeping disciples, “Why do you sleep? Rise and pray that you may not enter into temptation” (v. 46). When will you rise and pray this week?"},{"type":"h2","text":"Jesus Is Arrested"},{"type":"p","html":"<sup class=\"v\">47<\/sup> While he was still speaking, behold, a multitude, and he who was called Judas, one of the twelve, was leading them. He came near to Jesus to kiss him. <sup class=\"v\">48<\/sup> But Jesus said to him, “Judas, do you betray the Son of Man with a kiss?”"},{"type":"p","html":"<sup class=\"v\">49<\/sup> When those who were around him saw what was about to happen, they said to him, “Lord, shall we strike with the sword?” <sup class=\"v\">50<\/sup> A certain one of them struck the servant of the high priest, and cut off his right ear."},{"type":"p","html":"<sup class=\"v\">51<\/sup> But Jesus answered, “Let me at least do this”—and he touched his ear, and healed him. <sup class=\"v\">52<\/sup> Jesus said to the chief priests, captains of the temple, and elders, who had come against him, “Have you come out as against a robber, with swords and clubs? <sup class=\"v\">53<\/sup> When I was with you in the temple daily, you didn’t stretch out your hands against me. But this is your hour, and the power of darkness.”"},{"type":"q","id":"22.7","field":"q164","text":"<b>Head:<\/b> When a disciple cut off the servant’s ear, Jesus “touched his ear, and healed him” (v. 51). What does this show about Jesus, even at his arrest?"},{"type":"h2","text":"Peter Denies Jesus"},{"type":"img","src":"img/luke22-v54.jpg","w":1100,"h":734,"alt":"A rooster crowing"},{"type":"p","html":"<sup class=\"v\">54<\/sup> They seized him, and led him away, and brought him into the high priest’s house. But Peter followed from a distance. <sup class=\"v\">55<\/sup> When they had kindled a fire in the middle of the courtyard, and had sat down together, Peter sat among them. <sup class=\"v\">56<\/sup> A certain servant girl saw him as he sat in the light, and looking intently at him, said, “This man also was with him.”"},{"type":"p","html":"<sup class=\"v\">57<\/sup> He denied Jesus, saying, “Woman, I don’t know him.”"},{"type":"p","html":"<sup class=\"v\">58<\/sup> After a little while someone else saw him, and said, “You also are one of them!”"},{"type":"p","html":"But Peter answered, “Man, I am not!”"},{"type":"p","html":"<sup class=\"v\">59<\/sup> After about one hour passed, another confidently affirmed, saying, “Truly this man also was with him, for he is a Galilean!”"},{"type":"p","html":"<sup class=\"v\">60<\/sup> But Peter said, “Man, I don’t know what you are talking about!” Immediately, while he was still speaking, a rooster crowed. <sup class=\"v\">61<\/sup> The Lord turned and looked at Peter. Then Peter remembered the Lord’s word, how he said to him, “Before the rooster crows you will deny me three times.” <sup class=\"v\">62<\/sup> He went out, and wept bitterly."},{"type":"q","id":"22.8","field":"q165","text":"<b>Heart:<\/b> Consider the image of the rooster. When the rooster crowed, “The Lord turned and looked at Peter” (v. 61), and Peter “went out, and wept bitterly” (v. 62). What do you think Peter saw in Jesus’ face?"},{"type":"h2","text":"Jesus Before the Council"},{"type":"p","html":"<sup class=\"v\">63<\/sup> The men who held Jesus mocked him and beat him. <sup class=\"v\">64<\/sup> Having blindfolded him, they struck him on the face and asked him, “Prophesy! Who is the one who struck you?” <sup class=\"v\">65<\/sup> They spoke many other things against him, insulting him."},{"type":"p","html":"<sup class=\"v\">66<\/sup> As soon as it was day, the assembly of the elders of the people were gathered together, both chief priests and scribes, and they led him away into their council, saying, <sup class=\"v\">67<\/sup> “If you are the Christ, tell us.”"},{"type":"p","html":"But he said to them, “If I tell you, you won’t believe, <sup class=\"v\">68<\/sup> and if I ask, you will in no way answer me or let me go. <sup class=\"v\">69<\/sup> From now on, the Son of Man will be seated at the right hand of the power of God.”"},{"type":"p","html":"<sup class=\"v\">70<\/sup> They all said, “Are you then the Son of God?”"},{"type":"p","html":"He said to them, “You say it, because I am.”"},{"type":"p","html":"<sup class=\"v\">71<\/sup> They said, “Why do we need any more witness? For we ourselves have heard from his own mouth!”"}],"prayer":"God, your Son gave his body and blood for us (22:19–20) and prayed, “not my will, but yours, be done” (22:42). Give me wisdom as I read, and help me trust your will when it is hard."},{"num":23,"hero":{"src":"img/luke23-hero.jpg","w":1100,"h":733,"alt":"A wooden cross on a rocky summit against the sky"},"blocks":[{"type":"h2","text":"Jesus Before Pilate and Herod"},{"type":"p","html":"<sup class=\"v\">1<\/sup> The whole company of them rose up and brought him before Pilate. <sup class=\"v\">2<\/sup> They began to accuse him, saying, “We found this man perverting the nation, forbidding paying taxes to Caesar, and saying that he himself is Christ, a king.”"},{"type":"p","html":"<sup class=\"v\">3<\/sup> Pilate asked him, “Are you the King of the Jews?”"},{"type":"p","html":"He answered him, “So you say.”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> Pilate said to the chief priests and the multitudes, “I find no basis for a charge against this man.”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> But they insisted, saying, “He stirs up the people, teaching throughout all Judea, beginning from Galilee even to this place.” <sup class=\"v\">6<\/sup> But when Pilate heard Galilee mentioned, he asked if the man was a Galilean. <sup class=\"v\">7<\/sup> When he found out that he was in Herod’s jurisdiction, he sent him to Herod, who was also in Jerusalem during those days."},{"type":"p","html":"<sup class=\"v\">8<\/sup> Now when Herod saw Jesus, he was exceedingly glad, for he had wanted to see him for a long time, because he had heard many things about him. He hoped to see some miracle done by him. <sup class=\"v\">9<\/sup> He questioned him with many words, but he gave no answers. <sup class=\"v\">10<\/sup> The chief priests and the scribes stood, vehemently accusing him. <sup class=\"v\">11<\/sup> Herod with his soldiers humiliated him and mocked him. Dressing him in luxurious clothing, they sent him back to Pilate. <sup class=\"v\">12<\/sup> Herod and Pilate became friends with each other that very day, for before that they were enemies with each other."},{"type":"q","id":"23.1","field":"q166","text":"<b>Head:<\/b> Look at the image that opens this chapter. Pilate said, “I find no basis for a charge against this man” (v. 4). Why do you think Pilate still did not set Jesus free?"},{"type":"h2","text":"Pilate Hands Jesus Over"},{"type":"p","html":"<sup class=\"v\">13<\/sup> Pilate called together the chief priests, the rulers, and the people, <sup class=\"v\">14<\/sup> and said to them, “You brought this man to me as one that perverts the people, and behold, having examined him before you, I found no basis for a charge against this man concerning those things of which you accuse him. <sup class=\"v\">15<\/sup> Neither has Herod, for I sent you to him, and see, nothing worthy of death has been done by him. <sup class=\"v\">16<\/sup> I will therefore chastise him and release him.”"},{"type":"p","html":"<sup class=\"v\">17<\/sup> Now he had to release one prisoner to them at the feast. <sup class=\"v\">18<\/sup> But they all cried out together, saying, “Away with this man! Release to us Barabbas!”— <sup class=\"v\">19<\/sup> one who was thrown into prison for a certain revolt in the city, and for murder."},{"type":"p","html":"<sup class=\"v\">20<\/sup> Then Pilate spoke to them again, wanting to release Jesus, <sup class=\"v\">21<\/sup> but they shouted, saying, “Crucify! Crucify him!”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> He said to them the third time, “Why? What evil has this man done? I have found no capital crime in him. I will therefore chastise him and release him.” <sup class=\"v\">23<\/sup> But they were urgent with loud voices, asking that he might be crucified. Their voices and the voices of the chief priests prevailed. <sup class=\"v\">24<\/sup> Pilate decreed that what they asked for should be done. <sup class=\"v\">25<\/sup> He released him who had been thrown into prison for insurrection and murder, for whom they asked, but he delivered Jesus up to their will."},{"type":"q","id":"23.2","field":"q167","text":"<b>Heart:<\/b> The crowd shouted, “Crucify! Crucify him!” (v. 21), and Barabbas, a guilty man, was released (v. 25). How does Barabbas’ story connect with yours?"},{"type":"h2","text":"The Crucifixion"},{"type":"img","src":"img/luke23-v26.jpg","w":1100,"h":731,"alt":"A man carrying a heavy sack on his head"},{"type":"p","html":"<sup class=\"v\">26<\/sup> When they led him away, they grabbed one Simon of Cyrene, coming from the country, and laid on him
