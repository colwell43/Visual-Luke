=\"v\">29<\/sup> To him who strikes you on the cheek, offer also the other; and from him who takes away your cloak, don’t withhold your coat also. <sup class=\"v\">30<\/sup> Give to everyone who asks you, and don’t ask him who takes away your goods to give them back again."},{"type":"p","html":"<sup class=\"v\">31<\/sup> “As you would like people to do to you, do exactly so to them. <sup class=\"v\">32<\/sup> If you love those who love you, what credit is that to you? For even sinners love those who love them. <sup class=\"v\">33<\/sup> If you do good to those who do good to you, what credit is that to you? For even sinners do the same. <sup class=\"v\">34<\/sup> If you lend to those from whom you hope to receive, what credit is that to you? Even sinners lend to sinners, to receive back as much. <sup class=\"v\">35<\/sup> But love your enemies, and do good, and lend, expecting nothing back; and your reward will be great, and you will be children of the Most High; for he is kind toward the unthankful and evil."},{"type":"poem","lines":["<sup class=\"v\">36<\/sup> “Therefore be merciful,","even as your Father is also merciful."]},{"type":"q","id":"6.5","field":"q43","text":"<b>Action:<\/b> Consider the image of the clasped hands. “Love your enemies, do good to those who hate you” (v. 27). Who is hard for you to love? What good thing will you do for them this week?"},{"type":"q","id":"6.6","field":"q44","text":"<b>Heart:<\/b> “Therefore be merciful, even as your Father is also merciful” (v. 36). How has God’s mercy changed you?"},{"type":"h2","text":"Do Not Judge"},{"type":"poem","lines":["<sup class=\"v\">37<\/sup> Don’t judge,","and you won’t be judged.","Don’t condemn,","and you won’t be condemned.","Set free,","and you will be set free."]},{"type":"p","html":"<sup class=\"v\">38<\/sup> “Give, and it will be given to you: good measure, pressed down, shaken together, and running over, will be given to you. For with the same measure you measure it will be measured back to you.”"},{"type":"p","html":"<sup class=\"v\">39<\/sup> He spoke a parable to them. “Can the blind guide the blind? Won’t they both fall into a pit? <sup class=\"v\">40<\/sup> A disciple is not above his teacher, but everyone when he is fully trained will be like his teacher. <sup class=\"v\">41<\/sup> Why do you see the speck of chaff that is in your brother’s eye, but don’t consider the beam that is in your own eye? <sup class=\"v\">42<\/sup> Or how can you tell your brother, ‘Brother, let me remove the speck of chaff that is in your eye,’ when you yourself don’t see the beam that is in your own eye? You hypocrite! First remove the beam from your own eye, and then you can see clearly to remove the speck of chaff that is in your brother’s eye."},{"type":"q","id":"6.7","field":"q45","text":"<b>Heart:<\/b> “Why do you see the speck of chaff that is in your brother’s eye, but don’t consider the beam that is in your own eye?” (v. 41). Where might you be judging others too quickly?"},{"type":"h2","text":"A Tree and Its Fruit"},{"type":"p","html":"<sup class=\"v\">43<\/sup> For there is no good tree that produces rotten fruit; nor again a rotten tree that produces good fruit. <sup class=\"v\">44<\/sup> For each tree is known by its own fruit. For people don’t gather figs from thorns, nor do they gather grapes from a bramble bush. <sup class=\"v\">45<\/sup> The good man out of the good treasure of his heart brings out that which is good, and the evil man out of the evil treasure of his heart brings out that which is evil, for out of the abundance of the heart, his mouth speaks."},{"type":"h2","text":"The Wise and Foolish Builders"},{"type":"img","src":"img/luke06-v46.jpg","w":1100,"h":736,"alt":"Houses built on rocks beside the water"},{"type":"p","html":"<sup class=\"v\">46<\/sup> “Why do you call me, ‘Lord, Lord,’ and don’t do the things which I say? <sup class=\"v\">47<\/sup> Everyone who comes to me, and hears my words, and does them, I will show you who he is like. <sup class=\"v\">48<\/sup> He is like a man building a house, who dug and went deep, and laid a foundation on the rock. When a flood arose, the stream broke against that house, and could not shake it, because it was founded on the rock. <sup class=\"v\">49<\/sup> But he who hears, and doesn’t do, is like a man who built a house on the earth without a foundation, against which the stream broke, and immediately it fell, and the ruin of that house was great.”"},{"type":"q","id":"6.8","field":"q46","text":"<b>Action:<\/b> Consider the image of the houses on the rocks. The wise builder “dug and went deep, and laid a foundation on the rock” (v. 48). What will you do this week to build your life on Jesus’ words?"}],"prayer":"Father in heaven, you are “kind toward the unthankful and evil” (6:35). Give me wisdom as I read, and help me be merciful, as you are merciful (6:36)."},{"num":7,"hero":{"src":"img/luke07-hero.jpg","w":1100,"h":794,"alt":"An old wooden door in a stone house"},"blocks":[{"type":"h2","text":"A Centurion’s Great Faith"},{"type":"p","html":"<sup class=\"v\">1<\/sup> After he had finished speaking in the hearing of the people, he entered into Capernaum. <sup class=\"v\">2<\/sup> A certain centurion’s servant, who was dear to him, was sick and at the point of death. <sup class=\"v\">3<\/sup> When he heard about Jesus, he sent to him elders of the Jews, asking him to come and save his servant. <sup class=\"v\">4<\/sup> When they came to Jesus, they begged him earnestly, saying, “He is worthy for you to do this for him, <sup class=\"v\">5<\/sup> for he loves our nation, and he built our synagogue for us.” <sup class=\"v\">6<\/sup> Jesus went with them. When he was now not far from the house, the centurion sent friends to him, saying to him, “Lord, don’t trouble yourself, for I am not worthy for you to come under my roof. <sup class=\"v\">7<\/sup> Therefore I didn’t even think myself worthy to come to you; but say the word, and my servant will be healed. <sup class=\"v\">8<\/sup> For I also am a man placed under authority, having under myself soldiers. I tell this one, ‘Go!’ and he goes; and to another, ‘Come!’ and he comes; and to my servant, ‘Do this,’ and he does it.”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> When Jesus heard these things, he marveled at him, and turned and said to the multitude who followed him, “I tell you, I have not found such great faith, no, not in Israel.” <sup class=\"v\">10<\/sup> Those who were sent, returning to the house, found that the servant who had been sick was well."},{"type":"q","id":"7.1","field":"q47","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The centurion sent word, “Lord, don’t trouble yourself, for I am not worthy for you to come under my roof” (v. 6). How do humility and faith go together in your life?"},{"type":"q","id":"7.2","field":"q48","text":"<b>Head:<\/b> Jesus said, “I tell you, I have not found such great faith, no, not in Israel” (v. 9). What made this man’s faith so great?"},{"type":"h2","text":"A Widow’s Son Raised"},{"type":"img","src":"img/luke07-v11.jpg","w":1100,"h":620,"alt":"A woman holding her head in grief"},{"type":"p","html":"<sup class=\"v\">11<\/sup> Soon afterwards, he went to a city called Nain. Many of his disciples, along with a great multitude, went with him. <sup class=\"v\">12<\/sup> Now when he came near to the gate of the city, behold, one who was dead was carried out, the only son of his mother, and she was a widow. Many people of the city were with her. <sup class=\"v\">13<\/sup> When the Lord saw her, he had compassion on her, and said to her, “Don’t cry.” <sup class=\"v\">14<\/sup> He came near and touched the coffin, and the bearers stood still. He said, “Young man, I tell you, arise!” <sup class=\"v\">15<\/sup> He who was dead sat up, and began to speak. And he gave him to his mother."},{"type":"p","html":"<sup class=\"v\">16<\/sup> Fear took hold of all, and they glorified God, saying, “A great prophet has arisen among us!” and, “God has visited his people!” <sup class=\"v\">17<\/sup> This report went out concerning him in the whole of Judea, and in all the surrounding region."},{"type":"q","id":"7.3","field":"q49","text":"<b>Heart:<\/b> Consider the image of the grieving woman. “When the Lord saw her, he had compassion on her” (v. 13). Where do you need Jesus’ compassion right now?"},{"type":"h2","text":"Jesus and John the Baptizer"},{"type":"img","src":"img/luke07-v18.jpg","w":1100,"h":733,"alt":"Light falling through a small barred window into a stone cell"},{"type":"p","html":"<sup class=\"v\">18<\/sup> The disciples of John told him about all these things. <sup class=\"v\">19<\/sup> John, calling to himself two of his disciples, sent them to Jesus, saying, “Are you the one who is coming, or should we look for another?” <sup class=\"v\">20<\/sup> When the men had come to him, they said, “John the Baptizer has sent us to you, saying, ‘Are you he who comes, or should we look for another?’ ”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> In that hour he cured many of diseases and plagues and evil spirits; and to many who were blind he gave sight. <sup class=\"v\">22<\/sup> Jesus answered them, “Go and tell John the things which you have seen and heard: that the blind receive their sight, the lame walk, the lepers are cleansed, the deaf hear, the dead are raised up, and the poor have good news preached to them. <sup class=\"v\">23<\/sup> Blessed is he who finds no occasion for stumbling in me.”"},{"type":"q","id":"7.4","field":"q50","text":"<b>Action:<\/b> Consider the image of the prison window. From prison John asked, “Are you the one who is coming, or should we look for another?” (v. 19). Jesus answered by pointing to what he was doing (v. 22). When doubts come this week, what will you do to look again at what Jesus has done?"},{"type":"p","html":"<sup class=\"v\">24<\/sup> When John’s messengers had departed, he began to tell the multitudes about John, “What did you go out into the wilderness to see? A reed shaken by the wind? <sup class=\"v\">25<\/sup> But what did you go out to see? A man clothed in soft clothing? Behold, those who are gorgeously dressed, and live delicately, are in kings’ courts. <sup class=\"v\">26<\/sup> But what did you go out to see? A prophet? Yes, I tell you, and much more than a prophet. <sup class=\"v\">27<\/sup> This is he of whom it is written,"},{"type":"poem","lines":["‘Behold, I send my messenger before your face,","who will prepare your way before you.’"]},{"type":"p","html":"<sup class=\"v\">28<\/sup> “For I tell you, among those who are born of women there is not a greater prophet than John the Baptizer, yet he who is least in God’s Kingdom is greater than he.”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> When all the people and the tax collectors heard this, they declared God to be just, having been baptized with John’s baptism. <sup class=\"v\">30<\/sup> But the Pharisees and the lawyers rejected the counsel of God, not being baptized by him themselves."},{"type":"p","html":"<sup class=\"v\">31<\/sup> “To what then should I compare the people of this generation? What are they like? <sup class=\"v\">32<\/sup> They are like children who sit in the marketplace, and call to one another, saying, ‘We piped to you, and you didn’t dance. We mourned, and you didn’t weep.’ <sup class=\"v\">33<\/sup> For John the Baptizer came neither eating bread nor drinking wine, and you say, ‘He has a demon.’ <sup class=\"v\">34<\/sup> The Son of Man has come eating and drinking, and you say, ‘Behold, a gluttonous man, and a drunkard; a friend of tax collectors and sinners!’ <sup class=\"v\">35<\/sup> Wisdom is justified by all her children.”"},{"type":"q","id":"7.5","field":"q51","text":"<b>Head:<\/b> People called Jesus “a friend of tax collectors and sinners” (v. 34). Why do you think this label did not bother him?"},{"type":"h2","text":"A Sinful Woman Forgiven"},{"type":"img","src":"img/luke07-v36.jpg","w":1100,"h":733,"alt":"An old-fashioned perfume bottle beside red flowers and pearls"},{"type":"p","html":"<sup class=\"v\">36<\/sup> One of the Pharisees invited him to eat with him. He entered into the Pharisee’s house, and sat at the table. <sup class=\"v\">37<\/sup> Behold, a woman in the city who was a sinner, when she knew that he was reclining in the Pharisee’s house, brought an alabaster jar of ointment. <sup class=\"v\">38<\/sup> Standing behind at his feet weeping, she began to wet his feet with her tears, and she wiped them with the hair of her head, kissed his feet, and anointed them with the ointment. <sup class=\"v\">39<\/sup> Now when the Pharisee who had invited him saw it, he said to himself, “This man, if he were a prophet, would have perceived who and what kind of woman this is who touches him, that she is a sinner.”"},{"type":"p","html":"<sup class=\"v\">40<\/sup> Jesus answered him, “Simon, I have something to tell you.”"},{"type":"p","html":"He said, “Teacher, say on.”"},{"type":"p","html":"<sup class=\"v\">41<\/sup> “A certain lender had two debtors. The one owed five hundred denarii, and the other fifty. <sup class=\"v\">42<\/sup> When they couldn’t pay, he forgave them both. Which of them therefore will love him most?”"},{"type":"p","html":"<sup class=\"v\">43<\/sup> Simon answered, “He, I suppose, to whom he forgave the most.”"},{"type":"p","html":"He said to him, “You have judged correctly.” <sup class=\"v\">44<\/sup> Turning to the woman, he said to Simon, “Do you see this woman? I entered into your house, and you gave me no water for my feet, but she has wet my feet with her tears, and wiped them with the hair of her head. <sup class=\"v\">45<\/sup> You gave me no kiss, but she, since the time I came in, has not ceased to kiss my feet. <sup class=\"v\">46<\/sup> You didn’t anoint my head with oil, but she has anointed my feet with ointment. <sup class=\"v\">47<\/sup> Therefore I tell you, her sins, which are many, are forgiven, for she loved much. But one to whom little is forgiven, loves little.” <sup class=\"v\">48<\/sup> He said to her, “Your sins are forgiven.”"},{"type":"q","id":"7.6","field":"q52","text":"<b>Heart:<\/b> Consider the image of the perfume bottle. The woman wet Jesus’ feet “with her tears” (v. 38). Jesus said, “her sins, which are many, are forgiven, for she loved much” (v. 47). How does being forgiven shape the way you love?"},{"type":"p","html":"<sup class=\"v\">49<\/sup> Those who sat at the table with him began to say to themselves, “Who is this who even forgives sins?”"},{"type":"p","html":"<sup class=\"v\">50<\/sup> He said to the woman, “Your faith has saved you. Go in peace.”"},{"type":"q","id":"7.7","field":"q53","text":"<b>Head:<\/b> Simon the Pharisee and the woman saw Jesus very differently (v. 39-47). Why do you think that was?"},{"type":"q","id":"7.8","field":"q54","text":"<b>Action:<\/b> Jesus said to her, “Your faith has saved you. Go in peace” (v. 50). Whom could you help to know Jesus’ forgiveness and peace this week?"}],"prayer":"God, your Son had compassion on a grieving widow and forgave a woman who loved much (7:13, 47–48). Give me wisdom as I read, and help me love much because I have been forgiven much."},{"num":8,"hero":{"src":"img/luke08-hero.jpg","w":1100,"h":733,"alt":"A farmer kneeling to plant seeds in the soil"},"blocks":[{"type":"h2","text":"Women Who Followed Jesus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Soon afterwards, he went about through cities and villages, preaching and bringing the good news of God’s Kingdom. With him were the twelve, <sup class=\"v\">2<\/sup> and certain women who had been healed of evil spirits and infirmities: Mary who was called Magdalene, from whom seven demons had gone out; <sup class=\"v\">3<\/sup> and Joanna, the wife of Chuzas, Herod’s steward; Susanna; and many others; who served them from their possessions."},{"type":"q","id":"8.1","field":"q55","text":"<b>Head:<\/b> Luke names women who traveled with Jesus and “served them from their possessions” (v. 3). Why do you think Luke made sure to mention these women?"},{"type":"h2","text":"The Story of the Farmer"},{"type":"p","html":"<sup class=\"v\">4<\/sup> When a great multitude came together, and people from every city were coming to him, he spoke by a parable. <sup class=\"v\">5<\/sup> “The farmer went out to sow his seed. As he sowed, some fell along the road, and it was trampled under foot, and the birds of the sky devoured it. <sup class=\"v\">6<\/sup> Other seed fell on the rock, and as soon as it grew, it withered away, because it had no moisture. <sup class=\"v\">7<\/sup> Other fell amid the thorns, and the thorns grew with it, and choked it. <sup class=\"v\">8<\/sup> Other fell into the good ground, and grew, and produced one hundred times as much fruit.” As he said these things, he called out, “He who has ears to hear, let him hear!”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> Then his disciples asked him, “What does this parable mean?”"},{"type":"p","html":"<sup class=\"v\">10<\/sup> He said, “To you it is given to know the mysteries of God’s Kingdom, but to the rest in parables; that ‘seeing they may not see, and hearing they may not understand.’ <sup class=\"v\">11<\/sup> Now the parable is this: The seed is the word of God. <sup class=\"v\">12<\/sup> Those along the road are those who hear, then the devil comes, and takes away the word from their heart, that they may not believe and be saved. <sup class=\"v\">13<\/sup> Those on the rock are they who, when they hear, receive the word with joy; but these have no root, who believe for a while, then fall away in time of temptation. <sup class=\"v\">14<\/sup> That which fell among the thorns, these are those who have heard, and as they go on their way they are choked with cares, riches, and pleasures of life, and bring no fruit to maturity. <sup class=\"v\">15<\/sup> Those in the good ground, these are those who with an honest and good heart, having heard the word, hold it tightly, and produce fruit with perseverance."},{"type":"q","id":"8.2","field":"q56","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The seed fell along the road, on rock, among thorns and on good ground (v. 5-8). Which kind of ground is your heart most like right now?"},{"type":"q","id":"8.3","field":"q57","text":"<b>Action:<\/b> The good ground are those who “hold it tightly, and produce fruit with perseverance” (v. 15). What will you do this week to hold tightly to God’s word?"},{"type":"h2","text":"A Lamp on a Stand"},{"type":"img","src":"img/luke08-v16.jpg","w":1100,"h":825,"alt":"A small oil lamp burning in the dark"},{"type":"p","html":"<sup class=\"v\">16<\/sup> “No one, when he has lit a lamp, covers it with a container, or puts it under a bed; but puts it on a stand, that those who enter in may see the light. <sup class=\"v\">17<\/sup> For nothing is hidden that will not be revealed; nor anything secret that will not be known and come to light. <sup class=\"v\">18<\/sup> Be careful therefore how you hear. For whoever has, to him will be given; and whoever doesn’t have, from him will be taken away even that which he thinks he has.”"},{"type":"q","id":"8.4","field":"q58","text":"<b>Action:<\/b> Consider the image of the lamp. “No one, when he has lit a lamp, covers it with a container” (v. 16). How will you let your light be seen this week?"},{"type":"h2","text":"Jesus’ True Family"},{"type":"p","html":"<sup class=\"v\">19<\/sup> His mother and brothers came to him, and they could not come near him for the crowd. <sup class=\"v\">20<\/sup> Some people told him, “Your mother and your brothers stand outside, desiring to see you.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> But he answered them, “My mother and my brothers are these who hear the word of God, and do it.”"},{"type":"h2","text":"Jesus Calms the Storm"},{"type":"img","src":"img/luke08-v22.jpg","w":1100,"h":733,"alt":"A small boat on a stormy sea beneath lightning"},{"type":"p","html":"<sup class=\"v\">22<\/sup> Now on one of those days, he entered into a boat, himself and his disciples, and he said to them, “Let’s go over to the other side of the lake.” So they launched out. <sup class=\"v\">23<\/sup> But as they sailed, he fell asleep. A wind storm came down on the lake, and they were taking on dangerous amounts of water. <sup class=\"v\">24<\/sup> They came to him, and awoke him, saying, “Master, master, we are dying!” He awoke, and rebuked the wind and the raging of the water, and they ceased, and it was calm. <sup class=\"v\">25<\/sup> He said to them, “Where is your faith?” Being afraid they marveled, saying to one another, “Who is this then, that he commands even the winds and the water, and they obey him?”"},{"type":"q","id":"8.5","field":"q59","text":"<b>Heart:<\/b> Consider the image of the boat in the storm. Jesus asked, “Where is your faith?” (v. 25). How would you answer him in the storm you face now?"},{"type":"h2","text":"A Man Set Free"},{"type":"p","html":"<sup class=\"v\">26<\/sup> They arrived at the country of the Gadarenes, which is opposite Galilee."},{"type":"p","html":"<sup class=\"v\">27<\/sup> When Jesus stepped ashore, a certain man out of the city who had demons for a long time met him. He wore no clothes, and didn’t live in a house, but in the tombs. <sup class=\"v\">28<\/sup> When he saw Jesus, he cried out, and fell down before him, and with a loud voice said, “What do I have to do with you, Jesus, you Son of the Most High God? I beg you, don’t torment me!” <sup class=\"v\">29<\/sup> For Jesus was commanding the unclean spirit to come out of the man. For the unclean spirit had often seized the man. He was kept under guard, and bound with chains and fetters. Breaking the bonds apart, he was driven by the demon into the desert."},{"type":"p","html":"<sup class=\"v\">30<\/sup> Jesus asked him, “What is your name?”"},{"type":"p","html":"He said, “Legion,” for many demons had entered into him. <sup class=\"v\">31<\/sup> They begged him that he would not command them to go into the abyss. <sup class=\"v\">32<\/sup> Now there was there a herd of many pigs feeding on the mountain, and they begged him that he would allow them to enter into those. Then he allowed them. <sup class=\"v\">33<\/sup> The demons came out of the man, and entered into the pigs, and the herd rushed down the steep bank into the lake, and were drowned. <sup class=\"v\">34<\/sup> When those who fed them saw what had happened, they fled and told it in the city and in the country."},{"type":"p","html":"<sup class=\"v\">35<\/sup> People went out to see what had happened. They came to Jesus and found the man from whom the demons had gone out, sitting at Jesus’ feet, clothed and in his right mind; and they were afraid. <sup class=\"v\">36<\/sup> Those who saw it told them how he who had been possessed by demons was healed. <sup class=\"v\">37<\/sup> All the people of the surrounding country of the Gadarenes asked him to depart from them, for they were very much afraid. Then he entered into the boat and returned. <sup class=\"v\">38<\/sup> But the man from whom the demons had gone out begged him that he might go with him, but Jesus sent him away, saying, <sup class=\"v\">39<\/sup> “Return to your house, and declare what great things God has done for you.” He went his way, proclaiming throughout the whole city what great things Jesus had done for him."},{"type":"q","id":"8.6","field":"q60","text":"<b>Head:<\/b> The people found the freed man “sitting at Jesus’ feet, clothed and in his right mind” (v. 35), yet they asked Jesus to leave (v. 37). Why might people be afraid of Jesus’ power to change lives?"},{"type":"q","id":"8.7","field":"q61","text":"<b>Action:<\/b> Jesus told him, “Return to your house, and declare what great things God has done for you” (v. 39). Whom will you tell this week what God has done for you?"},{"type":"h2","text":"A Woman Healed and a Girl Raised"},{"type":"img","src":"img/luke08-v40.jpg","w":1100,"h":733,"alt":"A little girl holding her parents’ hands"},{"type":"p","html":"<sup class=\"v\">40<\/sup> When Jesus returned, the multitude welcomed him, for they were all waiting for him. <sup class=\"v\">41<\/sup> Behold, a man named Jairus came. He was a ruler of the synagogue. He fell down at Jesus’ feet, and begged him to come into his house, <sup class=\"v\">42<\/sup> for he had an only daughter, about twelve years of age, and she was dying. But as he went, the multitudes pressed against him. <sup class=\"v\">43<\/sup> A woman who had a flow of blood for twelve years, who had spent all her living on physicians and could not be healed by any <sup class=\"v\">44<\/sup> came behind him, and touched the fringe of his cloak. Immediately the flow of her blood stopped. <sup class=\"v\">45<\/sup> Jesus said, “Who touched me?”"},{"type":"p","html":"When all denied it, Peter and those with him said, “Master, the multitudes press and jostle you, and you say, ‘Who touched me?’”"},{"type":"p","html":"<sup class=\"v\">46<\/sup> But Jesus said, “Someone did touch me, for I perceived that power has gone out of me.” <sup class=\"v\">47<\/sup> When the woman saw that she was not hidden, she came trembling, and falling down before him declared to him in the presence of all the people the reason why she had touched him, and how she was healed immediately. <sup class=\"v\">48<\/sup> He said to her, “Daughter, cheer up. Your faith has made you well. Go in peace.”"},{"type":"p","html":"<sup class=\"v\">49<\/sup> While he still spoke, one from the ruler of the synagogue’s house came, saying to him, “Your daughter is dead. Don’t trouble the Teacher.”"},{"type":"p","html":"<sup class=\"v\">50<\/sup> But Jesus hearing it, answered him, “Don’t be afraid. Only believe, and she will be healed.”"},{"type":"p","html":"<sup class=\"v\">51<\/sup> When he came to the house, he didn’t allow anyone to enter in, except Peter, John, James, the father of the child, and her mother. <sup class=\"v\">52<\/sup> All were weeping and mourning her, but he said, “Don’t weep. She isn’t dead, but sleeping.”"},{"type":"p","html":"<sup class=\"v\">53<\/sup> They were ridiculing him, knowing that she was dead. <sup class=\"v\">54<\/sup> But he put them all outside, and taking her by the hand, he called, saying, “Child, arise!” <sup class=\"v\">55<\/sup> Her spirit returned, and she rose up immediately. He commanded that something be given to her to eat. <sup class=\"v\">56<\/sup> Her parents were amazed, but he commanded them to tell no one what had been done."},{"type":"q","id":"8.8","field":"q62","text":"<b>Heart:<\/b> Consider the image of the little girl’s hand. Jesus told her father, “Don’t be afraid. Only believe, and she will be healed” (v. 50). What fear do you need to hand to Jesus today?"}],"prayer":"Father in heaven, in Jesus you have power over storm, sickness and death (8:24, 48, 55). Give me wisdom as I read, and help me hear your word and hold it fast (8:15)."},{"num":9,"hero":{"src":"img/luke09-hero.jpg","w":1100,"h":733,"alt":"An older man with a walking stick on a country road"},"blocks":[{"type":"h2","text":"The Twelve Sent Out"},{"type":"p","html":"<sup class=\"v\">1<\/sup> He called the twelve together, and gave them power and authority over all demons, and to cure diseases. <sup class=\"v\">2<\/sup> He sent them out to preach God’s Kingdom and to heal the sick. <sup class=\"v\">3<\/sup> He said to them, “Take nothing for your journey—no staffs, nor wallet, nor bread, nor money. Don’t have two coats each. <sup class=\"v\">4<\/sup> Into whatever house you enter, stay there, and depart from there. <sup class=\"v\">5<\/sup> As many as don’t receive you, when you depart from that city, shake off even the dust from your feet for a testimony against them.”"},{"type":"p","html":"<sup class=\"v\">6<\/sup> They departed and went throughout the villages, preaching the Good News and healing everywhere."},{"type":"q","id":"9.1","field":"q63","text":"<b>Action:<\/b> Look at the image that opens this chapter. Jesus sent the twelve out and said, “Take nothing for your journey” (v. 3). What will you set aside this week so that you are freer to serve God?"},{"type":"h2","text":"Herod Is Perplexed"},{"type":"p","html":"<sup class=\"v\">7<\/sup> Now Herod the tetrarch heard of all that was done by him; and he was very perplexed, because it was said by some that John had risen from the dead, <sup class=\"v\">8<\/sup> and by some that Elijah had appeared, and by others that one of the old prophets had risen again. <sup class=\"v\">9<\/sup> Herod said, “I beheaded John, but who is this about whom I hear such things?” He sought to see him."},{"type":"h2","text":"Feeding Five Thousand"},{"type":"img","src":"img/luke09-v10.jpg","w":1100,"h":724,"alt":"Loaves of rustic bread in a basket"},{"type":"p","html":"<sup class=\"v\">10<\/sup> The apostles, when they had returned, told him what things they had done."},{"type":"p","html":"He took them and withdrew apart to a desert region of a city called Bethsaida. <sup class=\"v\">11<\/sup> But the multitudes, perceiving it, followed him. He welcomed them, spoke to them of God’s Kingdom, and he cured those who needed healing. <sup class=\"v\">12<\/sup> The day began to wear away; and the twelve came and said to him, “Send the multitude away, that they may go into the surrounding villages and farms, and lodge, and get food, for we are here in a deserted place.”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> But he said to them, “You give them something to eat.”"},{"type":"p","html":"They said, “We have no more than five loaves and two fish, unless we should go and buy food for all these people.” <sup class=\"v\">14<\/sup> For they were about five thousand men."},{"type":"p","html":"He said to his disciples, “Make them sit down in groups of about fifty each.” <sup class=\"v\">15<\/sup> They did so, and made them all sit down. <sup class=\"v\">16<\/sup> He took the five loaves and the two fish, and looking up to the sky, he blessed them, broke them, and gave them to the disciples to set before the multitude. <sup class=\"v\">17<\/sup> They ate and were all filled. They gathered up twelve baskets of broken pieces that were left over."},{"type":"q","id":"9.2","field":"q64","text":"<b>Heart:<\/b> Consider the image of the bread. Jesus told his disciples, “You give them something to eat” (v. 13). When have you felt you had too little to meet the need in front of you?"},{"type":"q","id":"9.3","field":"q65","text":"<b>Head:<\/b> “They ate and were all filled” (v. 17), and twelve baskets were left over. What does this show about what Jesus can do with what we bring him?"},{"type":"h2","text":"Peter’s Confession"},{"type":"p","html":"<sup class=\"v\">18<\/sup> As he was praying alone, the disciples were with him, and he asked them, “Who do the multitudes say that I am?”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> They answered, “ ‘John the Baptizer,’ but others say, ‘Elijah,’ and others, that one of the old prophets has risen again.”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> He said to them, “But who do you say that I am?”"},{"type":"q","id":"9.4","field":"q66","text":"<b>Heart:<\/b> Jesus asked, “But who do you say that I am?” (v. 20). How would you answer him today?"},{"type":"p","html":"Peter answered, “The Christ of God.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> But he warned them, and commanded them to tell this to no one, <sup class=\"v\">22<\/sup> saying, “The Son of Man must suffer many things, and be rejected by the elders, chief priests, and scribes, and be killed, and the third day be raised up.”"},{"type":"h2","text":"Take Up Your Cross"},{"type":"p","html":"<sup class=\"v\">23<\/sup> He said to all, “If anyone desires to come after me, let him deny himself, take up his cross, and follow me. <sup class=\"v\">24<\/sup> For whoever desires to save his life will lose it, but whoever will lose his life for my sake, will save it. <sup class=\"v\">25<\/sup> For what does it profit a man if he gains the whole world, and loses or forfeits his own self? <sup class=\"v\">26<\/sup> For whoever will be ashamed of me and of my words, of him will the Son of Man be ashamed, when he comes in his glory, and the glory of the Father, and of the holy angels. <sup class=\"v\">27<\/sup> But I tell you the truth: There are some of those who stand here who will in no way taste of death until they see God’s Kingdom.”"},{"type":"q","id":"9.5","field":"q67","text":"<b>Action:<\/b> “If anyone desires to come after me, let him deny himself, take up his cross, and follow me” (v. 23). What will taking up your cross look like for you this week?"},{"type":"h2","text":"Jesus Is Transfigured"},{"type":"img","src":"img/luke09-v28.jpg","w":1100,"h":733,"alt":"A mountain peak glowing in golden light"},{"type":"p","html":"<sup class=\"v\">28<\/sup> About eight days after these sayings, he took with him Peter, John, and James, and went up onto the mountain to pray. <sup class=\"v\">29<\/sup> As he was praying, the appearance of his face was altered, and his clothing became white and dazzling. <sup class=\"v\">30<\/sup> Behold, two men were talking with him, who were Moses and Elijah, <sup class=\"v\">31<\/sup> who appeared in glory, and spoke of his departure, which he was about to accomplish at Jerusalem."},{"type":"p","html":"<sup class=\"v\">32<\/sup> Now Peter and those who were with him were heavy with sleep, but when they were fully awake, they saw his glory, and the two men who stood with him. <sup class=\"v\">33<\/sup> As they were parting from him, Peter said to Jesus, “Master, it is good for us to be here. Let’s make three tents: one for you, one for Moses, and one for Elijah,” not knowing what he said."},{"type":"p","html":"<sup class=\"v\">34<\/sup> While he said these things, a cloud came and overshadowed them, and they were afraid as they entered into the cloud. <sup class=\"v\">35<\/sup> A voice came out of the cloud, saying, “This is my beloved Son. Listen to him!” <sup class=\"v\">36<\/sup> When the voice came, Jesus was found alone. They were silent, and told no one in those days any of the things which they had seen."},{"type":"q","id":"9.6","field":"q68","text":"<b>Head:<\/b> Consider the image of the mountain. As Jesus prayed, “the appearance of his face was altered” (v. 29). A voice said, “This is my beloved Son. Listen to him!” (v. 35). Why do you think the Father’s command was to listen to him?"},{"type":"h2","text":"Jesus Heals a Boy"},{"type":"p","html":"<sup class=\"v\">37<\/sup> On the next day, when they had come down from the mountain, a great multitude met him. <sup class=\"v\">38<\/sup> Behold, a man from the crowd called out, saying, “Teacher, I beg you to look at my son, for he is my only child. <sup class=\"v\">39<\/sup> Behold, a spirit takes him, he suddenly cries out, and it convulses him so that he foams, and it hardly departs from him, bruising him severely. <sup class=\"v\">40<\/sup> I begged your disciples to cast it out, and they couldn’t.”"},{"type":"p","html":"<sup class=\"v\">41<\/sup> Jesus answered, “Faithless and perverse generation, how long shall I be with you and bear with you? Bring your son here.”"},{"type":"p","html":"<sup class=\"v\">42<\/sup> While he was still coming, the demon threw him down and convulsed him violently. But Jesus rebuked the unclean spirit, healed the boy, and gave him back to his father."},{"type":"h2","text":"Who Is the Greatest?"},{"type":"p","html":"<sup class=\"v\">43<\/sup> They were all astonished at the majesty of God."},{"type":"p","html":"But while all were marveling at all the things which Jesus did, he said to his disciples, <sup class=\"v\">44<\/sup> “Let these words sink into your ears, for the Son of Man will be delivered up into the hands of men.” <sup class=\"v\">45<\/sup> But they didn’t understand this saying. It was concealed from them, that they should not perceive it, and they were afraid to ask him about this saying."},{"type":"p","html":"<sup class=\"v\">46<\/sup> An argument arose among them about which of them was the greatest. <sup class=\"v\">47<\/sup> Jesus, perceiving the reasoning of their hearts, took a little child, and set him by his side, <sup class=\"v\">48<\/sup> and said to them, “Whoever receives this little child in my name receives me. Whoever receives me receives him who sent me. For whoever is least among you all, this one will be great.”"},{"type":"q","id":"9.7","field":"q69","text":"<b>Heart:<\/b> Jesus said, “whoever is least among you all, this one will be great” (v. 48). How does Jesus change your idea of greatness?"},{"type":"p","html":"<sup class=\"v\">49<\/sup> John answered, “Master, we saw someone casting out demons in your name, and we forbade him, because he doesn’t follow with us.”"},{"type":"p","html":"<sup class=\"v\">50<\/sup> Jesus said to him, “Don’t forbid him, for he who is not against us is for us.”"},{"type":"h2","text":"Rejected in Samaria"},{"type":"p","html":"<sup class=\"v\">51<\/sup> It came to pass, when the days were near that he should be taken up, he intently set his face to go to Jerusalem <sup class=\"v\">52<\/sup> and sent messengers before his face. They went and entered into a village of the Samaritans, so as to prepare for him. <sup class=\"v\">53<\/sup> They didn’t receive him, because he was traveling with his face set toward Jerusalem. <sup class=\"v\">54<\/sup> When his disciples, James and John, saw this, they said, “Lord, do you want us to command fire to come down from the sky, and destroy them, just as Elijah did?”"},{"type":"p","html":"<sup class=\"v\">55<\/sup> But he turned and rebuked them, “You don’t know of what kind of spirit you are. <sup class=\"v\">56<\/sup> For the Son of Man didn’t come to destroy men’s lives, but to save them.”"},{"type":"p","html":"They went to another village."},{"type":"h2","text":"The Cost of Following Jesus"},{"type":"img","src":"img/luke09-v57.jpg","w":1100,"h":825,"alt":"An old plow standing in a grassy field"},{"type":"p","html":"<sup class=\"v\">57<\/sup> As they went on the way, a certain man said to him, “I want to follow you wherever you go, Lord.”"},{"type":"p","html":"<sup class=\"v\">58<\/sup> Jesus said to him, “The foxes have holes, and the birds of the sky have nests, but the Son of Man has no place to lay his head.”"},{"type":"p","html":"<sup class=\"v\">59<\/sup> He said to another, “Follow me!”"},{"type":"p","html":"But he said, “Lord, allow me first to go and bury my father.”"},{"type":"p","html":"<sup class=\"v\">60<\/sup> But Jesus said to him, “Leave the dead to bury their own dead, but you go and announce God’s Kingdom.”"},{"type":"p","html":"<sup class=\"v\">61<\/sup> Another also said, “I want to follow you, Lord, but first allow me to say good-bye to those who are at my house.”"},{"type":"p","html":"<sup class=\"v\">62<\/sup> But Jesus said to him, “No one, having put his hand to the plow, and looking back, is fit for God’s Kingdom.”"},{"type":"q","id":"9.8","field":"q70","text":"<b>Heart:<\/b> Consider the image of the plow. “No one, having put his hand to the plow, and looking back, is fit for God’s Kingdom” (v. 62). What tempts you to look back?"}],"prayer":"God, on the mountain you said of Jesus, “This is my beloved Son. Listen to him!” (9:35). Give me wisdom as I read, and help me deny myself and follow him each day (9:23)."},{"num":10,"hero":{"src":"img/luke10-hero.jpg","w":1100,"h":733,"alt":"A field of ripe wheat under a cloudy sky"},"blocks":[{"type":"h2","text":"Seventy-Two Sent Out"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now after these things, the Lord also appointed seventy others, and sent them two by two ahead of him into every city and place where he was about to come. <sup class=\"v\">2<\/sup> Then he said to them, “The harvest is indeed plentiful, but the laborers are few. Pray therefore to the Lord of the harvest, that he may send out laborers into his harvest. <sup class=\"v\">3<\/sup> Go your ways. Behold, I send you out as lambs among wolves. <sup class=\"v\">4<\/sup> Carry no purse, nor wallet, nor sandals. Greet no one on the way. <sup class=\"v\">5<\/sup> Into whatever house you enter, first say, ‘Peace be to this house.’ <sup class=\"v\">6<\/sup> If a son of peace is there, your peace will rest on him; but if not, it will return to you. <sup class=\"v\">7<\/sup> Remain in that same house, eating and drinking the things they give, for the laborer is worthy of his wages. Don’t go from house to house. <sup class=\"v\">8<\/sup> Into whatever city you enter, and they receive you, eat the things that are set before you. <sup class=\"v\">9<\/sup> Heal the sick who are there, and tell them, ‘God’s Kingdom has come near to you.’ <sup class=\"v\">10<\/sup> But into whatever city you enter, and they don’t receive you, go out into its streets and say, <sup class=\"v\">11<\/sup> ‘Even the dust from your city that clings to us, we wipe off against you. Nevertheless know this, that God’s Kingdom has come near to you.’ <sup class=\"v\">12<\/sup> I tell you, it will be more tolerable in that day for Sodom than for that city."},{"type":"q","id":"10.1","field":"q71","text":"<b>Action:<\/b> Look at the image that opens this chapter. Jesus said, “The harvest is indeed plentiful, but the laborers are few” (v. 2). Pray each day this week for one person who needs to hear the Good News."},{"type":"p","html":"<sup class=\"v\">13<\/sup> “Woe to you, Chorazin! Woe to you, Bethsaida! For if the mighty works had been done in Tyre and Sidon which were done in you, they would have repented long ago, sitting in sackcloth and ashes. <sup class=\"v\">14<\/sup> But it will be more tolerable for Tyre and Sidon in the judgment than for you. <sup class=\"v\">15<\/sup> You, Capernaum, who are exalted to heaven, will be brought down to Hades. <sup class=\"v\">16<\/sup> Whoever listens to you listens to me, and whoever rejects you rejects me. Whoever rejects me rejects him who sent me.”"},{"type":"h2","text":"The Seventy-Two Return with Joy"},{"type":"p","html":"<sup class=\"v\">17<\/sup> The seventy returned with joy, saying, “Lord, even the demons are subject to us in your name!”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> He said to them, “I saw Satan having fallen like lightning from heaven. <sup class=\"v\">19<\/sup> Behold, I give you authority to tread on serpents and scorpions, and over all the power of the enemy. Nothing will in any way hurt you. <sup class=\"v\">20<\/sup> Nevertheless, don’t rejoice in this, that the spirits are subject to you, but rejoice that your names are written in heaven.”"},{"type":"q","id":"10.2","field":"q72","text":"<b>Heart:<\/b> Jesus said, “don’t rejoice in this, that the spirits are subject to you, but rejoice that your names are written in heaven” (v. 20). What brings you the deepest joy in your faith?"},{"type":"h2","text":"Jesus Rejoices"},{"type":"img","src":"img/luke10-v21.jpg","w":1100,"h":733,"alt":"Two boys laughing together"},{"type":"p","html":"<sup class=\"v\">21<\/sup> In that same hour Jesus rejoiced in the Holy Spirit, and said, “I thank you, O Father, Lord of heaven and earth, that you have hidden these things from the wise and understanding, and revealed them to little children. Yes, Father, for so it was well-pleasing in your sight.”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> Turning to the disciples, he said, “All things have been delivered to me by my Father. No one knows who the Son is, except the Father, and who the Father is, except the Son, and he to whomever the Son desires to reveal him.”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> Turning to the disciples, he said privately, “Blessed are the eyes which see the things that you see, <sup class=\"v\">24<\/sup> for I tell you that many prophets and kings desired to see the things which you see, and didn’t see them, and to hear the things which you hear, and didn’t hear them.”"},{"type":"q","id":"10.3","field":"q73","text":"<b>Head:<\/b> Consider the image of the children. Jesus thanked the Father for hiding these things “from the wise and understanding” and revealing them “to little children” (v. 21). Why might childlike trust understand what clever minds miss?"},{"type":"h2","text":"The Good Samaritan"},{"type":"img","src":"img/luke10-v25.jpg","w":1100,"h":825,"alt":"An open first aid kit with bandages"},{"type":"p","html":"<sup class=\"v\">25<\/sup> Behold, a certain lawyer stood up and tested him, saying, “Teacher, what shall I do to inherit eternal life?”"},{"type":"p","html":"<sup class=\"v\">26<\/sup> He said to him, “What is written in the law? How do you read it?”"},{"type":"p","html":"<sup class=\"v\">27<\/sup> He answered, “You shall love the Lord your God with all your heart, with all your soul, with all your strength, and with all your mind; and your neighbor as yourself.”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> He said to him, “You have answered correctly. Do this, and you will live.”"},{"type":"q","id":"10.4","field":"q74","text":"<b>Head:<\/b> A lawyer asked, “Teacher, what shall I do to inherit eternal life?” (v. 25). How do loving God and loving your neighbor fit together (v. 27)?"},{"type":"p","html":"<sup class=\"v\">29<\/sup> But he, desiring to justify himself, asked Jesus, “Who is my neighbor?”"},{"type":"p","html":"<sup class=\"v\">30<\/sup> Jesus answered, “A certain man was going down from Jerusalem to Jericho, and he fell among robbers, who both stripped him and beat him, and departed, leaving him half dead. <sup class=\"v\">31<\/sup> By chance a certain priest was going down that way. When he saw him, he passed by on the other side. <sup class=\"v\">32<\/sup> In the same way a Levite also, when he came to the place, and saw him, passed by on the other side. <sup class=\"v\">33<\/sup> But a certain Samaritan, as he traveled, came where he was. When he saw him, he was moved with compassion, <sup class=\"v\">34<\/sup> came to him, and bound up his wounds, pouring on oil and wine. He set him on his own animal, brought him to an inn, and took care of him. <sup class=\"v\">35<\/sup> On the next day, when he departed, he took out two denarii, gave them to the host, and said to him, ‘Take care of him. Whatever you spend beyond that, I will repay you when I return.’ <sup class=\"v\">36<\/sup> Now which of these three do you think seemed to be a neighbor to him who fell among the robbers?”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> He said, “He who showed mercy on him.”"},{"type":"q","id":"10.5","field":"q75","text":"<b>Heart:<\/b> Consider the image of the first aid kit. The Samaritan “came where he was. When he saw him, he was moved with compassion” (v. 33). When have you passed by someone in need? What held you back?"},{"type":"q","id":"10.6","field":"q76","text":"<b>Action:<\/b> Jesus said, “Go and do likewise” (v. 37). Who is the neighbor you will help this week?"},{"type":"p","html":"Then Jesus said to him, “Go and do likewise.”"},{"type":"h2","text":"Martha and Mary"},{"type":"img","src":"img/luke10-v38.jpg","w":1100,"h":790,"alt":"Women busy cooking together in a kitchen"},{"type":"p","html":"<sup class=\"v\">38<\/sup> As they went on their way, he entered into a certain village, and a certain woman named Martha received him into her house. <sup class=\"v\">39<\/sup> She had a sister called Mary, who also sat at Jesus’ feet, and heard his word. <sup class=\"v\">40<\/sup> But Martha was distracted with much serving, and she came up to him, and said, “Lord, don’t you care that my sister left me to serve alone? Ask her therefore to help me.”"},{"type":"p","html":"<sup class=\"v\">41<\/sup> Jesus answered her, “Martha, Martha, you are anxious and troubled about many things, <sup class=\"v\">42<\/sup> but one thing is needed. Mary has chosen the good part, which will not be taken away from her.”"},{"type":"q","id":"10.7","field":"q77","text":"<b>Heart:<\/b> Consider the image of the busy kitchen. “Martha, Martha, you are anxious and troubled about many things, but one thing is needed” (v. 41-42). What makes you anxious and troubled?"},{"type":"q","id":"10.8","field":"q78","text":"<b>Action:<\/b> Mary “sat at Jesus’ feet, and heard his word” (v. 39). When will you sit and listen to Jesus this week?"}],"prayer":"Father in heaven, you reveal yourself to little children and hide these things from the proud (10:21). Give me wisdom as I read, and help me sit at Jesus’ feet and listen, as Mary did (10:39)."},{"num":11,"hero":{"src":"img/luke11-hero.jpg","w":1100,"h":733,"alt":"Hands folded in prayer on an open Bible"},"blocks":[{"type":"h2","text":"Teach Us to Pray"},{"type":"p","html":"<sup class=\"v\">1<\/sup> When he finished praying in a certain place, one of his disciples said to him, “Lord, teach us to pray, just as John also taught his disciples.”"},{"type":"p","html":"<sup class=\"v\">2<\/sup> He said to them, “When you pray, say,"},{"type":"poem","lines":["‘Our Father in heaven,","may your name be kept holy.","May your Kingdom come.","May your will be done on earth, as it is in heaven.","<sup class=\"v\">3<\/sup> Give us day by day our daily bread.","<sup class=\"v\">4<\/sup> Forgive us our sins,","for we ourselves also forgive everyone who is indebted to us.","Bring us not into temptation,","but deliver us from the evil one.’ ”"]},{"type":"q","id":"11.1","field":"q79","text":"<b>Heart:<\/b> Look at the image that opens this chapter. One of his disciples said, “Lord, teach us to pray” (v. 1). What do you most want to learn about prayer?"},{"type":"q","id":"11.2","field":"q80","text":"<b>Action:<\/b> Pray the Lord’s Prayer slowly (v. 2-4). Which line will you carry with you through this week?"},{"type":"h2","text":"Ask, Seek, Knock"},{"type":"img","src":"img/luke11-v05.jpg","w":1100,"h":734,"alt":"A weathered blue wooden door in a stone wall"},{"type":"p","html":"<sup class=\"v\">5<\/sup> He said to them, “Which of you, if you go to a friend at midnight, and tell him, ‘Friend, lend me three loaves of bread, <sup class=\"v\">6<\/sup> for a friend of mine has come to me from a journey, and I have nothing to set before him,’ <sup class=\"v\">7<\/sup> and he from within will answer and say, ‘Don’t bother me. The door is now shut, and my children are with me in bed. I can’t get up and give it to you’? <sup class=\"v\">8<\/sup> I tell you, although he will not rise and give it to him because he is his friend, yet because of his persistence, he will get up and give him as many as he needs."},{"type":"p","html":"<sup class=\"v\">9<\/sup> “I tell you, keep asking, and it will be given you. Keep seeking, and you will find. Keep knocking, and it will be opened to you. <sup class=\"v\">10<\/sup> For everyone who asks receives. He who seeks finds. To him who knocks it will be opened."},{"type":"p","html":"<sup class=\"v\">11<\/sup> “Which of you fathers, if your son asks for bread, will give him a stone? Or if he asks for a fish, he won’t give him a snake instead of a fish, will he? <sup class=\"v\">12<\/sup> Or if he asks for an egg, he won’t give him a scorpion, will he? <sup class=\"v\">13<\/sup> If you then, being evil, know how to give good gifts to your children, how much more will your heavenly Father give the Holy Spirit to those who ask him?”"},{"type":"q","id":"11.3","field":"q81","text":"<b>Head:<\/b> Consider the image of the door. Jesus told about a friend who kept knocking at midnight (v. 5-8). What is Jesus teaching about persistence in prayer?"},{"type":"q","id":"11.4","field":"q82","text":"<b>Heart:<\/b> “How much more will your heavenly Father give the Holy Spirit to those who ask him?” (v. 13). How does it feel to know your Father wants to give you good gifts?"},{"type":"h2","text":"A Kingdom Divided"},{"type":"p","html":"<sup class=\"v\">14<\/sup> He was casting out a demon, and it was mute. When the demon had gone out, the mute man spoke; and the multitudes marveled. <sup class=\"v\">15<\/sup> But some of them said, “He casts out demons by Beelzebul, the prince of the demons.” <sup class=\"v\">16<\/sup> Others, testing him, sought from him a sign from heaven. <sup class=\"v\">17<\/sup> But he, knowing their thoughts, said to them, “Every kingdom divided against itself is brought to desolation. A house divided against itself falls. <sup class=\"v\">18<\/sup> If Satan also is divided against himself, how will his kingdom stand? For you say that I cast out demons by Beelzebul. <sup class=\"v\">19<\/sup> But if I cast out demons by Beelzebul, by whom do your children cast them out? Therefore they will be your judges. <sup class=\"v\">20<\/sup> But if I by God’s finger cast out demons, then God’s Kingdom has come to you."},{"type":"p","html":"<sup class=\"v\">21<\/sup> “When the strong man, fully armed, guards his own dwelling, his goods are safe. <sup class=\"v\">22<\/sup> But when someone stronger attacks him and overcomes him, he takes from him his whole armor in which he trusted, and divides his plunder."},{"type":"p","html":"<sup class=\"v\">23<\/sup> “He that is not with me is against me. He who doesn’t gather with me scatters. <sup class=\"v\">24<\/sup> The unclean spirit, when he has gone out of the man, passes through dry places, seeking rest, and finding none, he says, ‘I will turn back to my house from which I came out.’ <sup class=\"v\">25<\/sup> When he returns, he finds it swept and put in order. <sup class=\"v\">26<\/sup> Then he goes, and takes seven other spirits more evil than himself, and they enter in and dwell there. The last state of that man becomes worse than the first.”"},{"type":"h2","text":"Truly Blessed"},{"type":"p","html":"<sup class=\"v\">27<\/sup> It came to pass, as he said these things, a certain woman out of the multitude lifted up her voice, and said to him, “Blessed is the womb that bore you, and the breasts which nursed you!”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> But he said, “On the contrary, blessed are those who hear the word of God, and keep it.”"},{"type":"q","id":"11.5","field":"q83","text":"<b>Action:<\/b> Jesus said, “blessed are those who hear the word of God, and keep it” (v. 28). What word of God will you keep this week?"},{"type":"h2","text":"The Sign of Jonah"},{"type":"p","html":"<sup class=\"v\">29<\/sup> When the multitudes were gathering together to him, he began to say, “This is an evil generation. It seeks after a sign. No sign will be given to it but the sign of Jonah, the prophet. <sup class=\"v\">30<\/sup> For even as Jonah became a sign to the Ninevites, so the Son of Man will also be to this generation. <sup class=\"v\">31<\/sup> The Queen of the South will rise up in the judgment with the men of this generation, and will condemn them: for she came from the ends of the earth to hear the wisdom of Solomon; and behold, one greater than Solomon is here. <sup class=\"v\">32<\/sup> The men of Nineveh will stand up in the judgment with this generation, and will condemn it: for they repented at the preaching of Jonah, and behold, one greater than Jonah is here."},{"type":"h2","text":"The Lamp of the Body"},{"type":"img","src":"img/luke11-v33.jpg","w":1100,"h":743,"alt":"An old stone house with lit windows at night"},{"type":"p","html":"<sup class=\"v\">33<\/sup> “No one, when he has lit a lamp, puts it in a cellar or under a basket, but on a stand, that those who come in may see the light. <sup class=\"v\">34<\/sup> The lamp of the body is the eye. Therefore when your eye is good, your whole body is also full of light; but when it is evil, your body also is full of darkness. <sup class=\"v\">35<\/sup> Therefore see whether the light that is in you isn’t darkness. <sup class=\"v\">36<\/sup> If therefore your whole body is full of light, having no part dark, it will be wholly full of light, as when the lamp with its bright shining gives you light.”"},{"type":"q","id":"11.6","field":"q84","text":"<b>Head:<\/b> Consider the image of the lit windows. “The lamp of the body is the eye” (v. 34). How do the things we look at shape our inner life?"},{"type":"h2","text":"Woes to Pharisees and Lawyers"},{"type":"img","src":"img/luke11-v37.jpg","w":1100,"h":733,"alt":"A crowded collection of cups and glasses"},{"type":"p","html":"<sup class=\"v\">37<\/sup> Now as he spoke, a certain Pharisee asked him to dine with him. He went in, and sat at the table. <sup class=\"v\">38<\/sup> When the Pharisee saw it, he marveled that he had not first washed himself before dinner. <sup class=\"v\">39<\/sup> The Lord said to him, “Now you Pharisees cleanse the outside of the cup and of the platter, but your inward part is full of extortion and wickedness. <sup class=\"v\">40<\/sup> You foolish ones, didn’t he who made the outside make the inside also? <sup class=\"v\">41<\/sup> But give for gifts to the needy those things which are within, and behold, all things will be clean to you. <sup class=\"v\">42<\/sup> But woe to you Pharisees! For you tithe mint and rue and every herb, but you bypass justice and God’s love. You ought to have done these, and not to have left the other undone. <sup class=\"v\">43<\/sup> Woe to you Pharisees! For you love the best seats in the synagogues, and the greetings in the marketplaces. <sup class=\"v\">44<\/sup> Woe to you, scribes and Pharisees, hypocrites! For you are like hidden graves, and the men who walk over them don’t know it.”"},{"type":"q","id":"11.7","field":"q85","text":"<b>Heart:<\/b> Consider the image of the cups. Jesus said, “Now you Pharisees cleanse the outside of the cup and of the platter, but your inward part is full of extortion and wickedness” (v. 39). Where are you tempted to care more about how things look than about your heart?"},{"type":"p","html":"<sup class=\"v\">45<\/sup> One of the lawyers answered him, “Teacher, in saying this you insult us also.”"},{"type":"p","html":"<sup class=\"v\">46<\/sup> He said, “Woe to you lawyers also! For you load men with burdens that are difficult to carry, and you yourselves won’t even lift one finger to help carry those burdens. <sup class=\"v\">47<\/sup> Woe to you! For you build the tombs of the prophets, and your fathers killed them. <sup class=\"v\">48<\/sup> So you testify and consent to the works of your fathers. For they killed them, and you build their tombs. <sup class=\"v\">49<\/sup> Therefore also the wisdom of God said, ‘I will send to them prophets and apostles; and some of them they will kill and persecute, <sup class=\"v\">50<\/sup> that the blood of all the prophets, which was shed from the foundation of the world, may be required of this generation; <sup class=\"v\">51<\/sup> from the blood of Abel to the blood of Zachariah, who perished between the altar and the sanctuary.’ Yes, I tell you, it will be required of this generation. <sup class=\"v\">52<\/sup> Woe to you lawyers! For you took away the key of knowledge. You didn’t enter in yourselves, and those who were entering in, you hindered.”"},{"type":"p","html":"<sup class=\"v\">53<\/sup> As he said these things to them, the scribes and the Pharisees began to be terribly angry, and to draw many things out of him; <sup class=\"v\">54<\/sup> lying in wait for him, and seeking to catch him in something he might say, that they might accuse him."},{"type":"q","id":"11.8","field":"q86","text":"<b>Head:<\/b> Jesus said the Pharisees tithed every herb but would “bypass justice and God’s love” (v. 42). Why is it easy to keep small rules and miss what matters most?"}],"prayer":"Father in heaven, you give the Holy Spirit to those who ask you (11:13). Give me wisdom as I read, and teach me to pray (11:1)."},{"num":12,"hero":{"src":"img/luke12-hero.jpg","w":1100,"h":733,"alt":"Two sparrows perched on a branch"},"blocks":[{"type":"h2","text":"Fear God, Not People"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Meanwhile, when a multitude of many thousands had gathered together, so much so that they trampled on each other, he began to tell his disciples first of all, “Beware of the yeast of the Pharisees, which is hypocrisy. <sup class=\"v\">2<\/sup> But there is nothing covered up that will not be revealed, nor hidden that will not be known. <sup class=\"v\">3<\/sup> Therefore whatever you have said in the darkness will be heard in the light. What you have spoken in the ear in the inner rooms will be proclaimed on the housetops."},{"type":"p","html":"<sup class=\"v\">4<\/sup> “I tell you, my friends, don’t be afraid of those who kill the body, and after that have no more that they can do. <sup class=\"v\">5<\/sup> But I will warn you whom you should fear. Fear him who after he has killed, has power to cast into Gehenna. Yes, I tell you, fear him."},{"type":"p","html":"<sup class=\"v\">6<\/sup> “Aren’t five sparrows sold for two assaria coins? Not one of them is forgotten by God. <sup class=\"v\">7<\/sup> But the very hairs of your head are all counted. Therefore don’t be afraid. You are of more value than many sparrows."},{"type":"q","id":"12.1","field":"q87","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Of the sparrows Jesus said, “Not one of them is forgotten by God. But the very hairs of your head are all counted” (v. 6-7). How does it feel to be so fully known by God?"},{"type":"p","html":"<sup class=\"v\">8<\/sup> “I tell you, everyone who confesses me before men, the Son of Man will also confess before the angels of God; <sup class=\"v\">9<\/sup> but he who denies me in the presence of men will be denied in the presence of God’s angels. <sup class=\"v\">10<\/sup> Everyone who speaks a word against the Son of Man will be forgiven, but those who blaspheme against the Holy Spirit will not be forgiven. <sup class=\"v\">11<\/sup> When they bring you before the synagogues, the rulers, and the authorities, don’t be anxious how or what you will answer, or what you will say; <sup class=\"v\">12<\/sup> for the Holy Spirit will teach you in that same hour what you must say.”"},{"type":"q","id":"12.2","field":"q88","text":"<b>Action:<\/b> Jesus spoke of “everyone who confesses me before men” (v. 8). Where will you speak up for Jesus this week?"},{"type":"h2","text":"The Rich Fool"},{"type":"img","src":"img/luke12-v13.jpg","w":1100,"h":733,"alt":"An old weathered barn"},{"type":"p","html":"<sup class=\"v\">13<\/sup> One of the multitude said to him, “Teacher, tell my brother to divide the inheritance with me.”"},{"type":"p","html":"<sup class=\"v\">14<\/sup> But he said to him, “Man, who made me a judge or an arbitrator over you?” <sup class=\"v\">15<\/sup> He said to them, “Beware! Keep yourselves from covetousness, for a man’s life doesn’t consist of the abundance of the things which he possesses.”"},{"type":"p","html":"<sup class=\"v\">16<\/sup> He spoke a parable to them, saying, “The ground of a certain rich man produced abundantly. <sup class=\"v\">17<\/sup> He reasoned within himself, saying, ‘What will I do, because I don’t have room to store my crops?’ <sup class=\"v\">18<\/sup> He said, ‘This is what I will do. I will pull down my barns, build bigger ones, and there I will store all my grain and my goods. <sup class=\"v\">19<\/sup> I will tell my soul, “Soul, you have many goods laid up for many years. Take your ease, eat, drink, and be merry.” ’"},{"type":"p","html":"<sup class=\"v\">20<\/sup> “But God said to him, ‘You foolish one, tonight your soul is required of you. The things which you have prepared—whose will they be?’ <sup class=\"v\">21<\/sup> So is he who lays up treasure for himself, and is not rich toward God.”"},{"type":"q","id":"12.3","field":"q89","text":"<b>Heart:<\/b> “Beware! Keep yourselves from covetousness, for a man’s life doesn’t consist of the abundance of the things which he possesses” (v. 15). What do you find yourself wanting more of?"},{"type":"q","id":"12.4","field":"q90","text":"<b>Head:<\/b> Consider the image of the barn. The rich man said, “I will pull down my barns, build bigger ones” (v. 18), but God called him foolish (v. 20). What was the man’s real mistake?"},{"type":"h2","text":"Do Not Worry"},{"type":"img","src":"img/luke12-v22.jpg","w":1100,"h":732,"alt":"A meadow of wildflowers with red poppies"},{"type":"p","html":"<sup class=\"v\">22<\/sup> He said to his disciples, “Therefore I tell you, don’t be anxious for your life, what you will eat, nor yet for your body, what you will wear. <sup class=\"v\">23<\/sup> Life is more than food, and the body is more than clothing. <sup class=\"v\">24<\/sup> Consider the ravens: they don’t sow, they don’t reap, they have no warehouse or barn, and God feeds them. How much more valuable are you than birds! <sup class=\"v\">25<\/sup> Which of you by being anxious can add a cubit to his height? <sup class=\"v\">26<\/sup> If then you aren’t able to do even the least things, why are you anxious about the rest? <sup class=\"v\">27<\/sup> Consider the lilies, how they grow. They don’t toil, neither do they spin; yet I tell you, even Solomon in all his glory was not arrayed like one of these. <sup class=\"v\">28<\/sup> But if this is how God clothes the grass in the field, which today exists, and tomorrow is cast into the oven, how much more will he clothe you, O you of little faith? <sup class=\"v\">29<\/sup> Don’t seek what you will eat or what you will drink; neither be anxious. <sup class=\"v\">30<\/sup> For the nations of the world seek after all of these things, but your Father knows that you need these things. <sup class=\"v\">31<\/sup> But seek God’s Kingdom, and all these things will be added to you. <sup class=\"v\">32<\/sup> Don’t be afraid, little flock, for it is your Father’s good pleasure to give you the Kingdom. <sup class=\"v\">33<\/sup> Sell that which you have, and give gifts to the needy. Make for yourselves purses which don’t grow old, a treasure in the heavens that doesn’t fail, where no thief approaches, neither moth destroys. <sup class=\"v\">34<\/sup> For where your treasure is, there will your heart be also."},{"type":"q","id":"12.5","field":"q91","text":"<b>Heart:<\/b> Consider the image of the wildflowers. “Consider the lilies, how they grow” (v. 27). What worry would you like to hand to God today?"},{"type":"q","id":"12.6","field":"q92","text":"<b>Action:<\/b> “Sell that which you have, and give gifts to the needy” (v. 33). What will you give away this week?"},{"type":"h2","text":"Be Ready"},{"type":"img","src":"img/luke12-v35.jpg","w":1100,"h":733,"alt":"A lantern burning on a tree at night beneath the moon"},{"type":"p","html":"<sup class=\"v\">35<\/sup> “Let your waist be dressed and your lamps burning. <sup class=\"v\">36<\/sup> Be like men watching for their lord, when he returns from the wedding feast; that when he comes and knocks, they may immediately open to him. <sup class=\"v\">37<\/sup> Blessed are those servants, whom the lord will find watching when he comes. Most certainly I tell you that he will dress himself, make them recline, and will come and serve them. <sup class=\"v\">38<\/sup> They will be blessed if he comes in the second or third watch, and finds them so. <sup class=\"v\">39<\/sup> But know this, that if the master of the house had known in what hour the thief was coming, he would have watched, and not allowed his house to be broken into. <sup class=\"v\">40<\/sup> Therefore be ready also, for the Son of Man is coming in an hour that you don’t expect him.”"},{"type":"q","id":"12.7","field":"q93","text":"<b>Head:<\/b> Consider the image of the lantern. “Let your waist be dressed and your lamps burning” (v. 35). What does it mean to be ready for Jesus’ return?"},{"type":"p","html":"<sup class=\"v\">41<\/sup> Peter said to him, “Lord, are you telling this parable to us, or to everybody?”"},{"type":"p","html":"<sup class=\"v\">42<\/sup> The Lord said, “Who then is the faithful and wise steward, whom his lord will set over his household, to give them their portion of food at the right times? <sup class=\"v\">43<\/sup> Blessed is that servant whom his lord will find doing so when he comes. <sup class=\"v\">44<\/sup> Truly I tell you, that he will set him over all that he has. <sup class=\"v\">45<\/sup> But if that servant says in his heart, ‘My lord delays his coming,’ and begins to beat the menservants and the maidservants, and to eat and drink, and to be drunken, <sup class=\"v\">46<\/sup> then the lord of that servant will come in a day when he isn’t expecting him, and in an hour that he doesn’t know, and will cut him in two, and place his portion with the unfaithful. <sup class=\"v\">47<\/sup> That servant, who knew his lord’s will, and didn’t prepare, nor do what he wanted, will be beaten with many stripes, <sup class=\"v\">48<\/sup> but he who didn’t know, and did things worthy of stripes, will be beaten with few stripes. To whomever much is given, of him will much be required; and to whom much was entrusted, of him more will be asked."},{"type":"q","id":"12.8","field":"q94","text":"<b>Action:<\/b> “To whomever much is given, of him will much be required” (v. 48). What has God given you? How will you use it for him this week?"},{"type":"h2","text":"Not Peace but Division"},{"type":"p","html":"<sup class=\"v\">49<\/sup> “I came to throw fire on the earth. I wish it were already kindled. <sup class=\"v\">50<\/sup> But I have a baptism to be baptized with, and how distressed I am until it is accomplished! <sup class=\"v\">51<\/sup> Do you think that I have come to give peace in the earth? I tell you, no, but rather division. <sup class=\"v\">52<\/sup> For from now on, there will be five in one house divided, three against two, and two against three. <sup class=\"v\">53<\/sup> They will be divided, father against son, and son against father; mother against daughter, and daughter against her mother; mother-in-law against her daughter-in-law, and daughter-in-law against her mother-in-law.”"},{"type":"h2","text":"Reading the Times"},{"type":"p","html":"<sup class=\"v\">54<\/sup> He said to the multitudes also, “When you see a cloud rising from the west, immediately you say, ‘A shower is coming,’ and so it happens. <sup class=\"v\">55<\/sup> When a south wind blows, you say, ‘There will be a scorching heat,’ and it happens. <sup class=\"v\">56<\/sup> You hypocrites! You know how to interpret the appearance of the earth and the sky, but how is it that you don’t interpret this time? <sup class=\"v\">57<\/sup> Why don’t you judge for yourselves what is right? <sup class=\"v\">58<\/sup> For when you are going with your adversary before the magistrate, try diligently on the way to be released from him, lest perhaps he drag you to the judge, and the judge deliver you to the officer, and the officer throw you into prison. <sup class=\"v\">59<\/sup> I tell you, you will by no means get out of there, until you have paid the very last penny.”"}],"prayer":"God, you feed the ravens and clothe the lilies, and it is your good pleasure to give your people the Kingdom (12:24, 27, 32). Give me wisdom as I read, and free me from worry and greed."},{"num":13,"hero":{"src":"img/luke13-hero.jpg","w":1100,"h":791,"alt":"A stone tower above a rushing river"},"blocks":[{"type":"h2","text":"Repent or Perish"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now there were some present at the same time who told him about the Galileans, whose blood Pilate had mixed with their sacrifices. <sup class=\"v\">2<\/sup> Jesus answered them, “Do you think that these Galileans were worse sinners than all the other Galileans, because they suffered such things? <sup class=\"v\">3<\/sup> I tell you, no, but unless you repent, you will all perish in the same way. <sup class=\"v\">4<\/sup> Or those eighteen, on whom the tower in Siloam fell and killed them; do you think that they were worse offenders than all the men who dwell in Jerusalem? <sup class=\"v\">5<\/sup> I tell you, no, but, unless you repent, you will all perish in the same way.”"},{"type":"q","id":"13.1","field":"q95","text":"<b>Head:<\/b> Look at the image that opens this chapter. Jesus asked whether the eighteen who died when “the tower in Siloam fell” were worse than others (v. 4). What does Jesus teach here about tragedy and repentance?"},{"type":"h2","text":"The Fig Tree Without Fruit"},{"type":"img","src":"img/luke13-v06.jpg","w":1100,"h":734,"alt":"Fig leaves on a branch with no fruit"},{"type":"p","html":"<sup class=\"v\">6<\/sup> He spoke this parable. “A certain man had a fig tree planted in his vineyard, and he came seeking fruit on it, and found none. <sup class=\"v\">7<\/sup> He said to the vine dresser, ‘Behold, these three years I have come looking for fruit on this fig tree, and found none. Cut it down. Why does it waste the soil?’ <sup class=\"v\">8<\/sup> He answered, ‘Lord, leave it alone this year also, until I dig around it and fertilize it. <sup class=\"v\">9<\/sup> If it bears fruit, fine; but if not, after that, you can cut it down.’ ”"},{"type":"q","id":"13.2","field":"q96","text":"<b>Heart:<\/b> Consider the image of the fig tree. The gardener asked for one more year to dig around the tree and care for it (v. 8). How have you experienced God’s patience with you?"},{"type":"h2","text":"A Bent Woman Healed"},{"type":"img","src":"img/luke13-v10.jpg","w":1100,"h":729,"alt":"An elderly woman in a red coat walking with a cane"},{"type":"p","html":"<sup class=\"v\">10<\/sup> He was teaching in one of the synagogues on the Sabbath day. <sup class=\"v\">11<\/sup> Behold, there was a woman who had a spirit of infirmity eighteen years. She was bent over, and could in no way straighten herself up. <sup class=\"v\">12<\/sup> When Jesus saw her, he called her, and said to her, “Woman, you are freed from your infirmity.” <sup class=\"v\">13<\/sup> He laid his hands on her, and immediately she stood up straight and glorified God."},{"type":"p","html":"<sup class=\"v\">14<\/sup> The ruler of the synagogue, being indignant because Jesus had healed on the Sabbath, said to the multitude, “There are six days in which men ought to work. Therefore come on those days and be healed, and not on the Sabbath day!”"},{"type":"p","html":"<sup class=\"v\">15<\/sup> Therefore the Lord answered him, “You hypocrites! Doesn’t each one of you free his ox or his donkey from the stall on the Sabbath, and lead him away to water? <sup class=\"v\">16<\/sup> Ought not this woman, being a daughter of Abraham whom Satan had bound eighteen long years, be freed from this bondage on the Sabbath day?”"},{"type":"p","html":"<sup class=\"v\">17<\/sup> As he said these things, all his adversaries were disappointed and all the multitude rejoiced for all the glorious things that were done by him."},{"type":"q","id":"13.3","field":"q97","text":"<b>Heart:<\/b> Consider the image of the woman with the cane. She “was bent over, and could in no way straighten herself up” (v. 11). What has bent you down? How might Jesus want to lift you up?"},{"type":"q","id":"13.4","field":"q98","text":"<b>Action:<\/b> Jesus laid his hands on her, “and immediately she stood up straight and glorified God” (v. 13). How will you give glory to God this week for something he has done for you?"},{"type":"h2","text":"Mustard Seed and Yeast"},{"type":"p","html":"<sup class=\"v\">18<\/sup> He said, “What is God’s Kingdom like? To what shall I compare it? <sup class=\"v\">19<\/sup> It is like a grain of mustard seed which a man took and put in his own garden. It grew and became a large tree, and the birds of the sky live in its branches.”"},{"type":"p","html":"<sup class=\"v\">20<\/sup> Again he said, “To what shall I compare God’s Kingdom? <sup class=\"v\">21<\/sup> It is like yeast, which a woman took and hid in three measures of flour, until it was all leavened.”"},{"type":"q","id":"13.5","field":"q99","text":"<b>Head:<\/b> Jesus said God’s Kingdom is “like a grain of mustard seed” (v. 19) and “like yeast” (v. 21). What do these small things teach about how God’s Kingdom grows?"},{"type":"h2","text":"The Narrow Door"},{"type":"img","src":"img/luke13-v22.jpg","w":1100,"h":733,"alt":"A narrow passage between tall brick walls"},{"type":"p","html":"<sup class=\"v\">22<\/sup> He went on his way through cities and villages, teaching, and traveling on to Jerusalem. <sup class=\"v\">23<\/sup> One said to him, “Lord, are they few who are saved?”"},{"type":"p","html":"He said to them, <sup class=\"v\">24<\/sup> “Strive to enter in by the narrow door, for many, I tell you, will seek to enter in and will not be able. <sup class=\"v\">25<\/sup> When once the master of the house has risen up, and has shut the door, and you begin to stand outside and to knock at the door, saying, ‘Lord, Lord, open to us!’ then he will answer and tell you, ‘I don’t know you or where you come from.’ <sup class=\"v\">26<\/sup> Then you will begin to say, ‘We ate and drank in your presence, and you taught in our streets.’ <sup class=\"v\">27<\/sup> He will say, ‘I tell you, I don’t know where you come from. Depart from me, all you workers of iniquity.’ <sup class=\"v\">28<\/sup> There will be weeping and gnashing of teeth when you see Abraham, Isaac, Jacob, and all the prophets in God’s Kingdom, and yourselves being thrown outside. <sup class=\"v\">29<\/sup> They will come from the east, west, north, and south, and will sit down in God’s Kingdom. <sup class=\"v\">30<\/sup> Behold, there are some who are last who will be first, and there are some who are first who will be last.”"},{"type":"q","id":"13.6","field":"q100","text":"<b>Action:<\/b> Consider the image of the narrow passage. “Strive to enter in by the narrow door” (v. 24). What will you do this week to follow Jesus more closely?"},{"type":"h2","text":"Jesus Grieves over Jerusalem"},{"type":"p","html":"<sup class=\"v\">31<\/sup> On that same day, some Pharisees came, saying to him, “Get out of here, and go away, for Herod wants to kill you.”"},{"type":"p","html":"<sup class=\"v\">32<\/sup> He said to them, “Go and tell that fox, ‘Behold, I cast out demons and perform cures today and tomorrow, and the third day I complete my mission. <sup class=\"v\">33<\/sup> Nevertheless I must go on my way today and tomorrow and the next day, for it can’t be that a prophet would perish outside of Jerusalem.’"},{"type":"p","html":"<sup class=\"v\">34<\/sup> “Jerusalem, Jerusalem, you who kills the prophets and stones those who are sent to her! How often I wanted to gather your children together, like a hen gathers her own brood under her wings, and you refused! <sup class=\"v\">35<\/sup> Behold, your house is left to you desolate. I tell you, you will not see me until you say, ‘Blessed is he who comes in the name of the Lord!’ ”"},{"type":"q","id":"13.7","field":"q101","text":"<b>Heart:<\/b> Jesus said, “How often I wanted to gather your children together, like a hen gathers her own brood under her wings, and you refused!” (v. 34). What does this show you about Jesus’ heart?"}],"prayer":"Father in heaven, you are patient with us, and your Son longed to gather his people like a hen gathers her chicks (13:6–9, 34). Give me wisdom as I read, and help me turn to you while there is time."},{"num":14,"hero":{"src":"img/luke14-hero.jpg","w":1100,"h":733,"alt":"A long dinner table set with flowers"},"blocks":[{"type":"h2","text":"Healing on the Sabbath"},{"type":"p","html":"<sup class=\"v\">1<\/sup> When he went into the house of one of the rulers of the Pharisees on a Sabbath to eat bread, they were watching him. <sup class=\"v\">2<\/sup> Behold, a certain man who had dropsy was in front of him. <sup class=\"v\">3<\/sup> Jesus, answering, spoke to the lawyers and Pharisees, saying, “Is it lawful to heal on the Sabbath?”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> But they were silent."},{"type":"p","html":"He took him, and healed him, and let him go. <sup class=\"v\">5<\/sup> He answered them, “Which of you, if your son or an ox fell into a well, wouldn’t immediately pull him out on a Sabbath day?”"},{"type":"p","html":"<sup clas
