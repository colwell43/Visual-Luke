<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Luke</title>
<meta name="description" content="Luke (World English Bible) with photographs and reflection questions.">
<meta name="theme-color" content="#F7F8F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111517" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Luke">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: a book you read online. One reading column (~66ch) beside a sticky chapter guide; photos run the full column; reflection panels sit in the flow where the book put them. */
  --paper: #F7F8F6;
  --surface: #FFFFFF;
  --ink: #15191C;
  --muted: #5A646A;
  --line: #D9DFDD;
  --teal: #0F6B70;
  --teal-soft: #E3EFEE;
  --panel: #EDF1EF;
  --mark: #FBE38E;
  --mark-ink: #15191C;
  --hl-green: #D4F3C8;
  --hl-blue: #CDE5FA;
  --band: rgba(9, 15, 17, 0.58);
  --display: "Libre Franklin", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --step--1: 0.875rem;
  --step-0: 1rem;
  --step-1: 1.1875rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: clamp(2.5rem, 6vw, 3.75rem);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111517;
    --surface: #171C1E;
    --ink: #E5E9E7;
    --muted: #9CA7AB;
    --line: #2B3336;
    --teal: #63BFC2;
    --teal-soft: #17292B;
    --panel: #1A2123;
    --mark: #6B5A1F;
    --mark-ink: #FFF6D6;
    --hl-green: rgba(118, 196, 104, 0.34);
    --hl-blue: rgba(104, 160, 232, 0.38);
    --band: rgba(5, 8, 9, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111517;
  --surface: #171C1E;
  --ink: #E5E9E7;
  --muted: #9CA7AB;
  --line: #2B3336;
  --teal: #63BFC2;
  --teal-soft: #17292B;
  --panel: #1A2123;
  --mark: #6B5A1F;
  --mark-ink: #FFF6D6;
  --hl-green: rgba(118, 196, 104, 0.34);
  --hl-blue: rgba(104, 160, 232, 0.38);
  --band: rgba(5, 8, 9, 0.62);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: var(--step-1);
  line-height: 1.65;
}
img { max-width: 100%; height: auto; display: block; }
a { color: var(--teal); text-underline-offset: 0.18em; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; border-radius: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; line-height: 1.2; margin: 0; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  font-family: var(--display);
}
.topbar-inner {
  max-width: 1180px; margin: 0 auto; padding: 10px 20px;
  display: flex; align-items: center; gap: 14px;
}
.brand {
  font-weight: 700; font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--ink); text-decoration: none; white-space: nowrap; margin-right: auto;
}
.brand span { color: var(--teal); }
.navbtn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1px solid transparent; border-radius: 6px;
  padding: 6px 10px; font-size: var(--step--1); font-weight: 500; color: var(--ink);
  text-decoration: none; cursor: pointer; white-space: nowrap;
}
.navbtn:hover { background: var(--teal-soft); }
.navbtn[aria-current="page"] { border-color: var(--line); background: var(--surface); }
.count {
  font-variant-numeric: tabular-nums; font-size: 0.75rem; font-weight: 600;
  background: var(--teal); color: var(--paper); border-radius: 999px; padding: 1px 7px; min-width: 1.6em; text-align: center;
}
.chapmenu { position: relative; }
.chapmenu > summary { list-style: none; }
.chapmenu > summary::-webkit-details-marker { display: none; }
.chapmenu-panel {
  position: absolute; right: 0; top: calc(100% + 8px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.14);
  padding: 14px; width: 300px;
}
.chapmenu-panel p { margin: 0 0 8px; font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.chapgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.chapgrid a {
  display: grid; place-items: center; aspect-ratio: 1; border-radius: 6px;
  text-decoration: none; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums;
  border: 1px solid var(--line); font-size: 0.95rem;
}
.chapgrid a:hover { border-color: var(--teal); color: var(--teal); }
.chapgrid a.done { background: var(--teal-soft); }
.chapgrid a[aria-current="page"] { background: var(--teal); color: var(--paper); border-color: var(--teal); }

.searchbar { border-top: 1px solid var(--line); }
.searchbar[hidden] { display: none; }
.searchbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 20px 16px; }
.searchbar input {
  width: 100%; padding: 10px 14px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); font-family: var(--display); font-size: 1rem;
}
.results { list-style: none; margin: 10px 0 0; padding: 0; max-height: 55vh; overflow-y: auto; }
.results li + li { border-top: 1px solid var(--line); }
.results button {
  display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 4px; cursor: pointer;
  font-family: var(--body); font-size: 1rem; line-height: 1.45;
}
.results button:hover { background: var(--teal-soft); }
.results .ref { font-family: var(--display); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--teal); display: block; }
.results b { background: var(--mark); color: var(--mark-ink); font-weight: inherit; }
.results-note { font-family: var(--display); font-size: var(--step--1); color: var(--muted); margin: 10px 0 0; }

/* ---------- shared layout ---------- */
main { min-height: 70vh; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
.eyebrow { font-family: var(--display); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--teal); margin: 0 0 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--display); font-weight: 600; font-size: 0.95rem;
  padding: 11px 18px; border-radius: 6px; text-decoration: none; cursor: pointer;
  border: 1px solid var(--teal); background: var(--teal); color: var(--paper);
}
.btn.ghost { background: transparent; color: var(--teal); }
.btn:hover { filter: brightness(1.08); }

/* ---------- home ---------- */
.cover {
  display: grid; grid-template-columns: minmax(200px, 330px) 1fr; gap: clamp(28px, 5vw, 64px);
  align-items: center; padding: clamp(32px, 6vw, 72px) 0 clamp(32px, 5vw, 56px);
}
.cover-img { border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,0.18); }
.cover h1 { font-size: var(--step-4); letter-spacing: -0.02em; font-weight: 700; }
.cover .lede { font-size: var(--step-1); color: var(--muted); max-width: 34em; margin: 14px 0 22px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: 0 0 26px; padding: 0; list-style: none; font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.stats strong { color: var(--ink); font-variant-numeric: tabular-nums; font-size: 1.05rem; margin-right: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.progress-line { font-family: var(--display); font-size: var(--step--1); color: var(--muted); margin: 16px 0 0; }

.welcome {
  display: grid; grid-template-columns: 1fr minmax(240px, 380px); gap: clamp(28px, 5vw, 64px);
  padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line);
}
.welcome h2 { font-size: var(--step-3); margin-bottom: 14px; }
.welcome p { margin: 0 0 1em; max-width: 36em; }
.strips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-self: start; }
.strips img { width: 100%; aspect-ratio: 143 / 374; object-fit: cover; border-radius: 3px; }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.section-head h2 { font-size: var(--step-3); }
.section-head p { margin: 0; font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.chapters { padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
.card {
  display: flex; flex-direction: column; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
  transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--teal); transform: translateY(-2px); }
.card-img { position: relative; aspect-ratio: 16 / 10; background: #222; overflow: hidden; }
.card-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card-num {
  position: absolute; left: 0; bottom: 0; padding: 6px 12px 4px; background: var(--band); color: #fff;
  font-family: var(--display); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.3em;
  display: flex; align-items: baseline; gap: 8px;
}
.card-num b { font-family: var(--body); font-weight: 400; font-size: 1.9rem; letter-spacing: 0; line-height: 1; }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-body ul { list-style: none; margin: 0; padding: 0; font-family: var(--display); font-size: 0.85rem; line-height: 1.4; color: var(--muted); }
.card-body li { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-body li:first-child { color: var(--ink); font-weight: 600; white-space: normal; }
.card-meta { margin-top: auto; display: flex; gap: 8px; align-items: center; font-family: var(--display); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.pill { border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); }
.pill.on { border-color: var(--teal); color: var(--teal); background: var(--teal-soft); }

.feature { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 0 0 clamp(32px, 5vw, 56px); }
.feature a.tile {
  display: block; padding: 22px 24px; border-radius: 8px; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); background: var(--panel);
}
.feature a.tile:hover { border-color: var(--teal); }
.feature h3 { font-size: var(--step-2); margin-bottom: 6px; }
.feature p { margin: 0; color: var(--muted); font-size: 1rem; }

.about { padding: clamp(32px, 5vw, 56px) 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr minmax(220px, 300px); gap: clamp(28px, 5vw, 64px); }
.about h2 { font-size: var(--step-2); margin-bottom: 4px; }
.about h3 { font-size: 1rem; font-weight: 600; color: var(--muted); margin-bottom: 16px; }
.about p { margin: 0 0 0.8em; font-size: 1.05rem; max-width: 40em; }
.about-imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-self: start; }
.about-imgs img { width: 100%; aspect-ratio: 143 / 486; object-fit: cover; border-radius: 3px; }

/* ---------- chapter ---------- */
.hero { position: relative; margin: 24px 0 0; border-radius: 6px; overflow: hidden; background: #1d2326; }
.hero img { width: 100%; max-height: min(64vh, 600px); object-fit: cover; }
.band {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--band); color: #fff;
  padding: 14px clamp(18px, 3vw, 32px) 12px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 18px;
}
.band-title { display: flex; flex-direction: column; }
.band .lk { font-family: var(--display); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.42em; }
.band .num { font-family: var(--body); font-size: clamp(4rem, 11vw, 7rem); line-height: 0.82; font-weight: 400; }
.band .meta { font-family: var(--display); font-size: 0.8rem; text-align: right; opacity: 0.92; line-height: 1.5; }

.chapter-grid {
  display: grid; grid-template-columns: 230px minmax(0, 700px); gap: clamp(28px, 5vw, 72px);
  justify-content: center; padding: 36px 0 24px;
}
.guide { position: sticky; top: 76px; align-self: start; font-family: var(--display); font-size: 0.9rem; max-height: calc(100vh - 96px); overflow-y: auto; }
.guide h2 { font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.guide ol { list-style: none; margin: 0 0 22px; padding: 0; border-left: 2px solid var(--line); }
.guide li button {
  display: block; width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
  padding: 5px 0 5px 12px; margin-left: -2px; border-left: 2px solid transparent; line-height: 1.35; color: var(--muted);
}
.guide li button:hover { color: var(--ink); }
.guide li button.active { color: var(--ink); border-left-color: var(--teal); font-weight: 600; }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0 0 12px; color: var(--ink); }
.toggle input { width: 18px; height: 18px; accent-color: var(--teal); }
.guide .tally { color: var(--muted); font-variant-numeric: tabular-nums; margin: 0 0 12px; }
.guide-mobile { display: none; }

.reader h2 {
  font-size: 1.3rem; font-weight: 700; margin: 2.2em 0 0.7em; scroll-margin-top: 90px;
}
.reader > :first-child { margin-top: 0; }
.reader p { margin: 0 0 1em; max-width: 66ch; }
.reader p, .reader .poem { scroll-margin-top: 90px; }
sup.v {
  font-family: var(--display); font-weight: 700; font-size: 0.6em; color: var(--teal);
  line-height: 0; vertical-align: 0.6em; margin-right: 0.12em; font-variant-numeric: tabular-nums;
}
.poem { margin: 0 0 1.1em; padding-left: 1.6em; border-left: 2px solid var(--teal-soft); }
.poem .l { display: block; padding-left: 1.2em; text-indent: -1.2em; }
.photo { margin: 1.6em 0; }
.photo img { width: 100%; border-radius: 4px; }
.photo.portrait img { max-height: 760px; width: auto; max-width: 100%; margin: 0 auto; }

.q {
  background: var(--panel); border-left: 3px solid var(--teal); border-radius: 0 6px 6px 0;
  padding: 18px 20px 16px; margin: 1.4em 0; font-family: var(--display); scroll-margin-top: 90px;
}
.q + .q { margin-top: -0.6em; }
.q-num { font-family: var(--display); font-size: 0.78rem; font-weight: 700; color: var(--teal); letter-spacing: 0.06em; margin: 0 0 6px; font-variant-numeric: tabular-nums; }
.q-text { font-size: 1rem; line-height: 1.5; margin: 0 0 12px; }
.q-text b { color: var(--teal); font-family: var(--display); font-weight: 700; }
.q textarea {
  display: block; width: 100%; min-height: 96px; resize: vertical;
  padding: 12px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface);
  font-family: var(--body); font-size: 1.05rem; line-height: 1.55;
}
.q textarea:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-soft); }
.q-status { min-height: 1.2em; margin: 6px 0 0; font-size: 0.75rem; color: var(--muted); }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 28px 0 56px; border-top: 1px solid var(--line); margin-top: 24px; }
.pager a {
  display: block; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--ink);
  font-family: var(--display); background: var(--surface);
}
.pager a:hover { border-color: var(--teal); }
.pager small { display: block; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.pager strong { font-size: 1.05rem; }
.pager .next { text-align: right; grid-column: 2; }

/* ---------- responses / discussion pages ---------- */
.page { max-width: 820px; margin: 0 auto; padding: clamp(32px, 6vw, 64px) 20px 64px; }
.page h1 { font-size: var(--step-3); margin-bottom: 10px; }
.page .lede { color: var(--muted); margin: 0 0 24px; font-size: 1.05rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 28px; }
.toolbar .note { font-family: var(--display); font-size: var(--step--1); color: var(--muted); }
.group { margin: 0 0 34px; }
.group h2 { font-size: 1.15rem; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.group h2 a { font-size: 0.85rem; font-weight: 500; }
.answer { margin: 0 0 20px; }
.answer .q-num { margin-bottom: 2px; }
.answer .q-text { margin-bottom: 8px; color: var(--muted); font-family: var(--display); font-size: 0.95rem; }
.answer .text { white-space: pre-wrap; margin: 0; padding-left: 14px; border-left: 3px solid var(--teal); }
.answer button.link { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; font-family: var(--display); font-size: 0.85rem; text-decoration: underline; text-underline-offset: 0.18em; margin-top: 6px; }
.empty { font-family: var(--display); color: var(--muted); padding: 22px; border: 1px dashed var(--line); border-radius: 8px; }
.copybox { margin: 0 0 24px; }
.copybox[hidden] { display: none; }
.copybox textarea { width: 100%; min-height: 220px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-family: var(--display); font-size: 0.9rem; }

.types { list-style: none; counter-reset: t; padding: 0; margin: 0; display: grid; gap: 16px; }
.types > li { counter-increment: t; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 16px 64px; position: relative; }
.types > li::before {
  content: counter(t); position: absolute; left: 18px; top: 16px; width: 32px; height: 32px; border-radius: 50%;
  display: grid; place-items: center; background: var(--teal); color: var(--paper);
  font-family: var(--display); font-weight: 700; font-size: 0.95rem;
}
.types h2 { font-size: 1.1rem; margin: 4px 0 8px; }
.types h2 span { font-weight: 400; color: var(--muted); font-size: 0.9rem; }
.types ol { margin: 0; padding-left: 1.3em; list-style: lower-alpha; font-size: 1.02rem; }
.types ol li { margin: 0 0 6px; }

/* ---------- opening prayer ---------- */
.prayer { margin: 0 0 2em; padding: 16px 22px 16px 20px; max-width: 66ch; background: rgba(200, 150, 62, 0.11);
  border-left: 4px solid #C8963E; border-radius: 0 8px 8px 0; }
.reader .prayer p { margin: 0; max-width: none; }
.reader .prayer .prayer-label { font-family: var(--display); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2em;
  text-transform: uppercase; color: #9A6B1E; margin: 0 0 6px; }
.reader .prayer .prayer-text { font-style: italic; font-size: 1.06rem; line-height: 1.6; }
:root[data-theme="dark"] .reader .prayer .prayer-label { color: #E2B866; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .reader .prayer .prayer-label { color: #E2B866; } }
@media print { .prayer { background: none; } }

/* ---------- master questions and summary ---------- */
.mq-box { margin: 1.4em 0 1.6em; padding: 18px 20px 6px; border: 1px solid var(--line); border-top: 3px solid var(--teal); border-radius: 0 0 8px 8px; background: var(--panel); max-width: 40em; }
.mq-box h3 { font-family: var(--display); font-size: 1.05rem; margin: 0 0 8px; color: var(--teal); letter-spacing: 0.02em; }
.welcome .mq-box p, .mq-box p { margin: 0 0 12px; font-size: 0.97rem; font-family: var(--display); max-width: none; line-height: 1.5; }
.mq-list { margin: 0 0 12px; padding: 0; list-style: none; }
.mq-list li { margin: 0 0 10px; font-family: var(--display); font-size: 0.97rem; line-height: 1.5; }
.mq-list b, .mq-q .q-text b, .sm-q b { color: var(--teal); font-weight: 700; letter-spacing: 0.04em; }
.mq { margin: 2.4em 0 0.4em; padding-top: 1.2em; border-top: 2px solid var(--teal); }

<script type="application/json" id="book-data">{"cover":{"src":"img/cover.jpg","w":1023,"h":1280,"alt":"A winding road through autumn forest toward a glowing sunrise"},"coverAlt":"A winding road through autumn forest toward a glowing sunrise","welcome":["Luke wrote his Gospel so that his friend Theophilus might “know the certainty concerning the things in which you were instructed.” He tells the story of Jesus carefully and in order, from the songs around his birth to his last words on the cross and his meal with two friends on the road to Emmaus. Luke shows Jesus welcoming people others pushed aside: shepherds and widows, tax collectors and lepers, children and a thief on a cross. Only Luke tells the stories of the good Samaritan, the lost son and Zacchaeus. At the center of it all is Jesus’ mission: “to seek and to save that which was lost.”","Visual Luke sets the full text of Luke, in the World English Bible, beside photographs and questions for reflection. The photographs are not pictures of Bible scenes. They are images from everyday life, chosen to help you connect your own story with the story of Jesus.","As you read, take time with each image. Notice what you see and what you feel. The questions are marked HEAD, HEART and ACTION. Head questions help you understand what the passage says. Heart questions invite you to notice your feelings and attitudes before God. Action questions ask what you will do in response. Use them on your own, with a friend or in a group. The goal is to link LIFE and SCRIPTURE through IMAGES.","You can write your responses right on the page, in the boxes beneath each question, and highlight words in the text that speak to you.","At the end of the book, after Luke 24, you will find two more sections. The Summary reviews the Master Questions for the whole Gospel of Luke, with boxes for your responses. Going Deeper is a short study guide with an overview of the author and the book, historical and cultural insights, a chart of the whole book, its major themes and emotions, and free online resources such as Blue Letter Bible, commentaries and maps."],"strips":[{"src":"img/welcome-1.jpg","w":1100,"h":1146,"alt":"A stack of old leather-bound books"},{"src":"img/welcome-2.jpg","w":855,"h":1280,"alt":"A grandmother and a small child sharing a meal"},{"src":"img/welcome-3.jpg","w":960,"h":1280,"alt":"A shepherd leading his flock of sheep into a village"}],"chapters":[{"num":1,"hero":{"src":"img/luke01-hero.jpg","w":1100,"h":732,"alt":"A quill pen and inkwell on an old writing desk"},"blocks":[{"type":"h2","text":"Luke Writes to Theophilus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Since many have undertaken to set in order a narrative concerning those matters which have been fulfilled among us, <sup class=\"v\">2<\/sup> even as those who from the beginning were eyewitnesses and servants of the word delivered them to us, <sup class=\"v\">3<\/sup> it seemed good to me also, having traced the course of all things accurately from the first, to write to you in order, most excellent Theophilus; <sup class=\"v\">4<\/sup> that you might know the certainty concerning the things in which you were instructed."},{"type":"q","id":"1.1","field":"q1","text":"<b>Head:<\/b> Look at the image that opens this chapter. Luke decided “to write to you in order” (v. 3) so that Theophilus might “know the certainty concerning the things in which you were instructed” (v. 4). Why do you think Luke cared so much about getting the facts right?"},{"type":"h2","text":"An Angel Visits Zacharias"},{"type":"img","src":"img/luke01-v05.jpg","w":1100,"h":748,"alt":"An elderly couple walking together down a village street"},{"type":"p","html":"<sup class=\"v\">5<\/sup> There was in the days of Herod, the king of Judea, a certain priest named Zacharias, of the priestly division of Abijah. He had a wife of the daughters of Aaron, and her name was Elizabeth. <sup class=\"v\">6<\/sup> They were both righteous before God, walking blamelessly in all the commandments and ordinances of the Lord. <sup class=\"v\">7<\/sup> But they had no child, because Elizabeth was barren, and they both were well advanced in years."},{"type":"q","id":"1.2","field":"q2","text":"<b>Heart:<\/b> Consider the image of the elderly couple. Zacharias and Elizabeth “were both righteous before God” (v. 6), but “they had no child, because Elizabeth was barren” (v. 7). How do you hold on to faith when a prayer goes unanswered for a long time?"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Now while he executed the priest’s office before God in the order of his division <sup class=\"v\">9<\/sup> according to the custom of the priest’s office, his lot was to enter into the temple of the Lord and burn incense. <sup class=\"v\">10<\/sup> The whole multitude of the people were praying outside at the hour of incense."},{"type":"p","html":"<sup class=\"v\">11<\/sup> An angel of the Lord appeared to him, standing on the right side of the altar of incense. <sup class=\"v\">12<\/sup> Zacharias was troubled when he saw him, and fear fell upon him. <sup class=\"v\">13<\/sup> But the angel said to him, “Don’t be afraid, Zacharias, because your request has been heard. Your wife, Elizabeth, will bear you a son, and you shall call his name John. <sup class=\"v\">14<\/sup> You will have joy and gladness, and many will rejoice at his birth. <sup class=\"v\">15<\/sup> For he will be great in the sight of the Lord, and he will drink no wine nor strong drink. He will be filled with the Holy Spirit, even from his mother’s womb. <sup class=\"v\">16<\/sup> He will turn many of the children of Israel to the Lord their God. <sup class=\"v\">17<\/sup> He will go before him in the spirit and power of Elijah, ‘to turn the hearts of the fathers to the children,’ and the disobedient to the wisdom of the just; to prepare a people prepared for the Lord.”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Zacharias said to the angel, “How can I be sure of this? For I am an old man, and my wife is well advanced in years.”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> The angel answered him, “I am Gabriel, who stands in the presence of God. I was sent to speak to you and to bring you this good news. <sup class=\"v\">20<\/sup> Behold, you will be silent and not able to speak until the day that these things will happen, because you didn’t believe my words, which will be fulfilled in their proper time.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> The people were waiting for Zacharias, and they marveled that he delayed in the temple. <sup class=\"v\">22<\/sup> When he came out, he could not speak to them. They perceived that he had seen a vision in the temple. He continued making signs to them, and remained mute. <sup class=\"v\">23<\/sup> When the days of his service were fulfilled, he departed to his house. <sup class=\"v\">24<\/sup> After these days Elizabeth his wife conceived, and she hid herself five months, saying, <sup class=\"v\">25<\/sup> “Thus has the Lord done to me in the days in which he looked at me, to take away my reproach among men.”"},{"type":"h2","text":"The Angel Visits Mary"},{"type":"p","html":"<sup class=\"v\">26<\/sup> Now in the sixth month, the angel Gabriel was sent from God to a city of Galilee named Nazareth, <sup class=\"v\">27<\/sup> to a virgin pledged to be married to a man whose name was Joseph, of David’s house. The virgin’s name was Mary. <sup class=\"v\">28<\/sup> Having come in, the angel said to her, “Rejoice, you highly favored one! The Lord is with you. Blessed are you among women!”"},{"type":"p","html":"<sup class=\"v\">29<\/sup> But when she saw him, she was greatly troubled at the saying, and considered what kind of salutation this might be. <sup class=\"v\">30<\/sup> The angel said to her, “Don’t be afraid, Mary, for you have found favor with God. <sup class=\"v\">31<\/sup> Behold, you will conceive in your womb and give birth to a son, and shall name him ‘Jesus.’ <sup class=\"v\">32<\/sup> He will be great and will be called the Son of the Most High. The Lord God will give him the throne of his father David, <sup class=\"v\">33<\/sup> and he will reign over the house of Jacob forever. There will be no end to his Kingdom.”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> Mary said to the angel, “How can this be, seeing I am a virgin?”"},{"type":"p","html":"<sup class=\"v\">35<\/sup> The angel answered her, “The Holy Spirit will come on you, and the power of the Most High will overshadow you. Therefore also the holy one who is born from you will be called the Son of God. <sup class=\"v\">36<\/sup> Behold, Elizabeth your relative also has conceived a son in her old age; and this is the sixth month with her who was called barren. <sup class=\"v\">37<\/sup> For nothing spoken by God is impossible.”"},{"type":"p","html":"<sup class=\"v\">38<\/sup> Mary said, “Behold, the servant of the Lord; let it be done to me according to your word.”"},{"type":"q","id":"1.3","field":"q3","text":"<b>Head:<\/b> Zacharias asked, “How can I be sure of this?” (v. 18). Mary asked, “How can this be, seeing I am a virgin?” (v. 34). Why do you think the angel answered them so differently?"},{"type":"q","id":"1.4","field":"q4","text":"<b>Heart:<\/b> “For nothing spoken by God is impossible” (v. 37). What seems impossible in your life right now?"},{"type":"q","id":"1.5","field":"q5","text":"<b>Action:<\/b> Mary said, “Behold, the servant of the Lord; let it be done to me according to your word” (v. 38). What would it look like for you to say yes to God this week?"},{"type":"p","html":"The angel departed from her."},{"type":"h2","text":"Mary Visits Elizabeth"},{"type":"img","src":"img/luke01-v39.jpg","w":1100,"h":730,"alt":"Two women in a warm embrace"},{"type":"p","html":"<sup class=\"v\">39<\/sup> Mary arose in those days and went into the hill country with haste, into a city of Judah, <sup class=\"v\">40<\/sup> and entered into the house of Zacharias and greeted Elizabeth. <sup class=\"v\">41<\/sup> When Elizabeth heard Mary’s greeting, the baby leaped in her womb; and Elizabeth was filled with the Holy Spirit. <sup class=\"v\">42<\/sup> She called out with a loud voice and said, “Blessed are you among women, and blessed is the fruit of your womb! <sup class=\"v\">43<\/sup> Why am I so favored, that the mother of my Lord should come to me? <sup class=\"v\">44<\/sup> For behold, when the voice of your greeting came into my ears, the baby leaped in my womb for joy! <sup class=\"v\">45<\/sup> Blessed is she who believed, for there will be a fulfillment of the things which have been spoken to her from the Lord!”"},{"type":"q","id":"1.6","field":"q6","text":"<b>Action:<\/b> Consider the image of the two women embracing. When Mary greeted her, Elizabeth was “filled with the Holy Spirit” and blessed her (v. 41-42). Whom will you encourage with a word of blessing this week?"},{"type":"h2","text":"Mary’s Song"},{"type":"p","html":"<sup class=\"v\">46<\/sup> Mary said,"},{"type":"poem","lines":["“My soul magnifies the Lord.","<sup class=\"v\">47<\/sup> My spirit has rejoiced in God my Savior,","<sup class=\"v\">48<\/sup> for he has looked at the humble state of his servant.","For behold, from now on, all generations will call me blessed.","<sup class=\"v\">49<\/sup> For he who is mighty has done great things for me.","Holy is his name.","<sup class=\"v\">50<\/sup> His mercy is for generations of generations on those who fear him.","<sup class=\"v\">51<\/sup> He has shown strength with his arm.","He has scattered the proud in the imagination of their hearts.","<sup class=\"v\">52<\/sup> He has put down princes from their thrones,","and has exalted the lowly.","<sup class=\"v\">53<\/sup> He has filled the hungry with good things.","He has sent the rich away empty.","<sup class=\"v\">54<\/sup> He has given help to Israel, his servant, that he might remember mercy,","<sup class=\"v\">55<\/sup> as he spoke to our fathers,","to Abraham and his offspring forever.”"]},{"type":"q","id":"1.7","field":"q7","text":"<b>Heart:<\/b> Mary sang, “My soul magnifies the Lord. My spirit has rejoiced in God my Savior” (v. 46-47). What has God done that makes your heart sing?"},{"type":"p","html":"<sup class=\"v\">56<\/sup> Mary stayed with her about three months, and then returned to her house."},{"type":"h2","text":"The Birth of John"},{"type":"p","html":"<sup class=\"v\">57<\/sup> Now the time that Elizabeth should give birth was fulfilled, and she gave birth to a son. <sup class=\"v\">58<\/sup> Her neighbors and her relatives heard that the Lord had magnified his mercy toward her, and they rejoiced with her. <sup class=\"v\">59<\/sup> On the eighth day, they came to circumcise the child; and they would have called him Zacharias, after the name of his father. <sup class=\"v\">60<\/sup> His mother answered, “Not so; but he will be called John.”"},{"type":"p","html":"<sup class=\"v\">61<\/sup> They said to her, “There is no one among your relatives who is called by this name.” <sup class=\"v\">62<\/sup> They made signs to his father, what he would have him called."},{"type":"p","html":"<sup class=\"v\">63<\/sup> He asked for a writing tablet, and wrote, “His name is John.”"},{"type":"p","html":"They all marveled. <sup class=\"v\">64<\/sup> His mouth was opened immediately and his tongue freed, and he spoke, blessing God. <sup class=\"v\">65<\/sup> Fear came on all who lived around them, and all these sayings were talked about throughout all the hill country of Judea. <sup class=\"v\">66<\/sup> All who heard them laid them up in their heart, saying, “What then will this child be?” The hand of the Lord was with him."},{"type":"h2","text":"Zacharias’ Song"},{"type":"img","src":"img/luke01-v67.jpg","w":1100,"h":734,"alt":"Morning mist and golden light over rolling green hills"},{"type":"p","html":"<sup class=\"v\">67<\/sup> His father Zacharias was filled with the Holy Spirit, and prophesied, saying,"},{"type":"poem","lines":["<sup class=\"v\">68<\/sup> “Blessed be the Lord, the God of Israel,","for he has visited and redeemed his people;","<sup class=\"v\">69<\/sup> and has raised up a horn of salvation for us in the house of his servant David","<sup class=\"v\">70<\/sup> (as he spoke by the mouth of his holy prophets who have been from of old),","<sup class=\"v\">71<\/sup> salvation from our enemies and from the hand of all who hate us;","<sup class=\"v\">72<\/sup> to show mercy toward our fathers,","to remember his holy covenant,","<sup class=\"v\">73<\/sup> the oath which he swore to Abraham our father,","<sup class=\"v\">74<\/sup> to grant to us that we, being delivered out of the hand of our enemies,","should serve him without fear,","<sup class=\"v\">75<\/sup> in holiness and righteousness before him all the days of our life.","<sup class=\"v\">76<\/sup> And you, child, will be called a prophet of the Most High;","for you will go before the face of the Lord to prepare his ways,","<sup class=\"v\">77<\/sup> to give knowledge of salvation to his people by the remission of their sins,","<sup class=\"v\">78<\/sup> because of the tender mercy of our God,","by which the dawn from on high will visit us,","<sup class=\"v\">79<\/sup> to shine on those who sit in darkness and the shadow of death;","to guide our feet into the way of peace.”"]},{"type":"p","html":"<sup class=\"v\">80<\/sup> The child was growing and becoming strong in spirit, and was in the desert until the day of his public appearance to Israel."},{"type":"q","id":"1.8","field":"q8","text":"<b>Heart:<\/b> Consider the image of the sunrise. Zacharias sang of “the dawn from on high” that would “shine on those who sit in darkness and the shadow of death” (v. 78-79). Where do you need God’s light to dawn?"}],"prayer":"God, you keep your promises, for “nothing spoken by God is impossible” (1:37). Give me wisdom as I read, and help me trust your word as Mary did."},{"num":2,"hero":{"src":"img/luke02-hero.jpg","w":1100,"h":733,"alt":"Hay in an old wooden stable"},"blocks":[{"type":"h2","text":"The Birth of Jesus"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now in those days, a decree went out from Caesar Augustus that all the world should be enrolled. <sup class=\"v\">2<\/sup> This was the first enrollment made when Quirinius was governor of Syria. <sup class=\"v\">3<\/sup> All went to enroll themselves, everyone to his own city. <sup class=\"v\">4<\/sup> Joseph also went up from Galilee, out of the city of Nazareth, into Judea, to David’s city, which is called Bethlehem, because he was of the house and family of David; <sup class=\"v\">5<\/sup> to enroll himself with Mary, who was pledged to be married to him as wife, being pregnant."},{"type":"p","html":"<sup class=\"v\">6<\/sup> While they were there, the day had come for her to give birth. <sup class=\"v\">7<\/sup> She gave birth to her firstborn son. She wrapped him in bands of cloth, and laid him in a feeding trough, because there was no room for them in the inn."},{"type":"q","id":"2.1","field":"q9","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Mary “laid him in a feeding trough, because there was no room for them in the inn” (v. 7). What does it mean to you that Jesus was born in such a humble place?"},{"type":"h2","text":"Shepherds Hear the Good News"},{"type":"img","src":"img/luke02-v08.jpg","w":1100,"h":552,"alt":"A flock of sheep grazing in a field at sunset"},{"type":"p","html":"<sup class=\"v\">8<\/sup> There were shepherds in the same country staying in the field, and keeping watch by night over their flock. <sup class=\"v\">9<\/sup> Behold, an angel of the Lord stood by them, and the glory of the Lord shone around them, and they were terrified. <sup class=\"v\">10<\/sup> The angel said to them, “Don’t be afraid, for behold, I bring you good news of great joy which will be to all the people. <sup class=\"v\">11<\/sup> For there is born to you today, in David’s city, a Savior, who is Christ the Lord. <sup class=\"v\">12<\/sup> This is the sign to you: you will find a baby wrapped in strips of cloth, lying in a feeding trough.” <sup class=\"v\">13<\/sup> Suddenly, there was with the angel a multitude of the heavenly army praising God, and saying,"},{"type":"poem","lines":["<sup class=\"v\">14<\/sup> “Glory to God in the highest,","on earth peace, good will toward men.”"]},{"type":"q","id":"2.2","field":"q10","text":"<b>Head:<\/b> Consider the image of the sheep. The first to hear the news were shepherds in the field (v. 8). The angel said, “I bring you good news of great joy which will be to all the people” (v. 10). Why do you think God announced Jesus’ birth to shepherds first?"},{"type":"p","html":"<sup class=\"v\">15<\/sup> When the angels went away from them into the sky, the shepherds said to one another, “Let’s go to Bethlehem, now, and see this thing that has happened, which the Lord has made known to us.” <sup class=\"v\">16<\/sup> They came with haste, and found both Mary and Joseph, and the baby was lying in the feeding trough. <sup class=\"v\">17<\/sup> When they saw it, they publicized widely the saying which was spoken to them about this child. <sup class=\"v\">18<\/sup> All who heard it wondered at the things which were spoken to them by the shepherds. <sup class=\"v\">19<\/sup> But Mary kept all these sayings, pondering them in her heart. <sup class=\"v\">20<\/sup> The shepherds returned, glorifying and praising God for all the things that they had heard and seen, just as it was told them."},{"type":"q","id":"2.3","field":"q11","text":"<b>Heart:<\/b> “Mary kept all these sayings, pondering them in her heart” (v. 19). What has God done in your life that you want to keep and ponder?"},{"type":"q","id":"2.4","field":"q12","text":"<b>Action:<\/b> The shepherds went to see the child, and then they “publicized widely the saying which was spoken to them about this child” (v. 17). Whom will you tell about Jesus this week?"},{"type":"h2","text":"Simeon Sees God’s Salvation"},{"type":"img","src":"img/luke02-v21.jpg","w":1100,"h":733,"alt":"A smiling grandfather holding a baby"},{"type":"p","html":"<sup class=\"v\">21<\/sup> When eight days were fulfilled for the circumcision of the child, his name was called Jesus, which was given by the angel before he was conceived in the womb."},{"type":"p","html":"<sup class=\"v\">22<\/sup> When the days of their purification according to the law of Moses were fulfilled, they brought him up to Jerusalem, to present him to the Lord <sup class=\"v\">23<\/sup> (as it is written in the law of the Lord, “Every male who opens the womb shall be called holy to the Lord”), <sup class=\"v\">24<\/sup> and to offer a sacrifice according to that which is said in the law of the Lord, “A pair of turtledoves, or two young pigeons.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> Behold, there was a man in Jerusalem whose name was Simeon. This man was righteous and devout, looking for the consolation of Israel, and the Holy Spirit was on him. <sup class=\"v\">26<\/sup> It had been revealed to him by the Holy Spirit that he should not see death before he had seen the Lord’s Christ. <sup class=\"v\">27<\/sup> He came in the Spirit into the temple. When the parents brought in the child, Jesus, that they might do concerning him according to the custom of the law, <sup class=\"v\">28<\/sup> then he received him into his arms, and blessed God, and said,"},{"type":"poem","lines":["<sup class=\"v\">29<\/sup> “Now you are releasing your servant, Master,","according to your word, in peace;","<sup class=\"v\">30<\/sup> for my eyes have seen your salvation,","<sup class=\"v\">31<\/sup> which you have prepared before the face of all peoples;","<sup class=\"v\">32<\/sup> a light for revelation to the nations,","and the glory of your people Israel.”"]},{"type":"q","id":"2.5","field":"q13","text":"<b>Heart:<\/b> Consider the image of the grandfather and baby. Simeon took the child in his arms and said, “my eyes have seen your salvation” (v. 30). How does it feel to know that God keeps his promises, even after long waiting?"},{"type":"p","html":"<sup class=\"v\">33<\/sup> Joseph and his mother were marveling at the things which were spoken concerning him, <sup class=\"v\">34<\/sup> and Simeon blessed them, and said to Mary, his mother, “Behold, this child is set for the falling and the rising of many in Israel, and for a sign which is spoken against. <sup class=\"v\">35<\/sup> Yes, a sword will pierce through your own soul, that the thoughts of many hearts may be revealed.”"},{"type":"h2","text":"Anna Gives Thanks"},{"type":"p","html":"<sup class=\"v\">36<\/sup> There was one Anna, a prophetess, the daughter of Phanuel, of the tribe of Asher (she was of a great age, having lived with a husband seven years from her virginity, <sup class=\"v\">37<\/sup> and she had been a widow for about eighty-four years), who didn’t depart from the temple, worshiping with fastings and petitions night and day. <sup class=\"v\">38<\/sup> Coming up at that very hour, she gave thanks to the Lord, and spoke of him to all those who were looking for redemption in Jerusalem."},{"type":"q","id":"2.6","field":"q14","text":"<b>Action:<\/b> Anna “didn’t depart from the temple, worshiping with fastings and petitions night and day” (v. 37). Who is an older believer whose faithfulness you admire? How will you honor or thank them this week?"},{"type":"p","html":"<sup class=\"v\">39<\/sup> When they had accomplished all things that were according to the law of the Lord, they returned into Galilee, to their own city, Nazareth. <sup class=\"v\">40<\/sup> The child was growing, and was becoming strong in spirit, being filled with wisdom, and the grace of God was upon him."},{"type":"h2","text":"The Boy Jesus in the Temple"},{"type":"img","src":"img/luke02-v41.jpg","w":1100,"h":734,"alt":"A boy reading a book by warm light"},{"type":"p","html":"<sup class=\"v\">41<\/sup> His parents went every year to Jerusalem at the feast of the Passover."},{"type":"p","html":"<sup class=\"v\">42<\/sup> When he was twelve years old, they went up to Jerusalem according to the custom of the feast, <sup class=\"v\">43<\/sup> and when they had fulfilled the days, as they were returning, the boy Jesus stayed behind in Jerusalem. Joseph and his mother didn’t know it, <sup class=\"v\">44<\/sup> but supposing him to be in the company, they went a day’s journey, and they looked for him among their relatives and acquaintances. <sup class=\"v\">45<\/sup> When they didn’t find him, they returned to Jerusalem, looking for him. <sup class=\"v\">46<\/sup> After three days they found him in the temple, sitting in the middle of the teachers, both listening to them, and asking them questions. <sup class=\"v\">47<\/sup> All who heard him were amazed at his understanding and his answers. <sup class=\"v\">48<\/sup> When they saw him, they were astonished, and his mother said to him, “Son, why have you treated us this way? Behold, your father and I were anxiously looking for you.”"},{"type":"p","html":"<sup class=\"v\">49<\/sup> He said to them, “Why were you looking for me? Didn’t you know that I must be in my Father’s house?” <sup class=\"v\">50<\/sup> They didn’t understand the saying which he spoke to them. <sup class=\"v\">51<\/sup> And he went down with them, and came to Nazareth. He was subject to them, and his mother kept all these sayings in her heart. <sup class=\"v\">52<\/sup> And Jesus increased in wisdom and stature, and in favor with God and men."},{"type":"q","id":"2.7","field":"q15","text":"<b>Head:<\/b> Consider the image of the boy with a book. Jesus said, “Didn’t you know that I must be in my Father’s house?” (v. 49). What do these first recorded words of Jesus show about him?"},{"type":"q","id":"2.8","field":"q16","text":"<b>Action:<\/b> “Jesus increased in wisdom and stature, and in favor with God and men” (v. 52). In which of these areas do you want to grow? What step will you take this week?"}],"prayer":"Father in heaven, you sent a Savior with “good news of great joy which will be to all the people” (2:10). Give me wisdom as I read, and fill my heart with that joy."},{"num":3,"hero":{"src":"img/luke03-hero.jpg","w":1100,"h":733,"alt":"A vast, dry desert wilderness"},"blocks":[{"type":"h2","text":"John Prepares the Way"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now in the fifteenth year of the reign of Tiberius Caesar, Pontius Pilate being governor of Judea, and Herod being tetrarch of Galilee, and his brother Philip tetrarch of the region of Ituraea and Trachonitis, and Lysanias tetrarch of Abilene, <sup class=\"v\">2<\/sup> in the high priesthood of Annas and Caiaphas, the word of God came to John, the son of Zacharias, in the wilderness. <sup class=\"v\">3<\/sup> He came into all the region around the Jordan, preaching the baptism of repentance for remission of sins. <sup class=\"v\">4<\/sup> As it is written in the book of the words of Isaiah the prophet,"},{"type":"poem","lines":["“The voice of one crying in the wilderness,","‘Make ready the way of the Lord.","Make his paths straight.","<sup class=\"v\">5<\/sup> Every valley will be filled.","Every mountain and hill will be brought low.","The crooked will become straight,","and the rough ways smooth.","<sup class=\"v\">6<\/sup> All flesh will see God’s salvation.’ ”"]},{"type":"q","id":"3.1","field":"q17","text":"<b>Head:<\/b> Look at the image that opens this chapter. “The word of God came to John, the son of Zacharias, in the wilderness” (v. 2). Why do you think God’s word came in the wilderness and not in a palace or the temple?"},{"type":"q","id":"3.2","field":"q18","text":"<b>Heart:<\/b> “Every valley will be filled. Every mountain and hill will be brought low. The crooked will become straight, and the rough ways smooth” (v. 5). What crooked or rough place in your heart needs God’s work?"},{"type":"h2","text":"Fruit Worthy of Repentance"},{"type":"p","html":"<sup class=\"v\">7<\/sup> He said therefore to the multitudes who went out to be baptized by him, “You offspring of vipers, who warned you to flee from the wrath to come? <sup class=\"v\">8<\/sup> Therefore produce fruits worthy of repentance, and don’t begin to say among yourselves, ‘We have Abraham for our father;’ for I tell you that God is able to raise up children to Abraham from these stones! <sup class=\"v\">9<\/sup> Even now the ax also lies at the root of the trees. Every tree therefore that doesn’t produce good fruit is cut down, and thrown into the fire.”"},{"type":"img","src":"img/luke03-v10.jpg","w":1100,"h":703,"alt":"A man sharing a sandwich with someone in need"},{"type":"p","html":"<sup class=\"v\">10<\/sup> The multitudes asked him, “What then must we do?”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> He answered them, “He who has two coats, let him give to him who has none. He who has food, let him do likewise.”"},{"type":"p","html":"<sup class=\"v\">12<\/sup> Tax collectors also came to be baptized, and they said to him, “Teacher, what must we do?”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> He said to them, “Collect no more than that which is appointed to you.”"},{"type":"p","html":"<sup class=\"v\">14<\/sup> Soldiers also asked him, saying, “What about us? What must we do?”"},{"type":"q","id":"3.3","field":"q19","text":"<b>Action:<\/b> Consider the image of the shared food. John said, “He who has two coats, let him give to him who has none. He who has food, let him do likewise” (v. 11). What do you have extra that you will share this week?"},{"type":"q","id":"3.4","field":"q20","text":"<b>Head:<\/b> John told tax collectors, “Collect no more than that which is appointed to you” (v. 13), and soldiers, “Be content with your wages” (v. 14). What does repentance look like in everyday work?"},{"type":"p","html":"He said to them, “Extort from no one by violence, neither accuse anyone wrongfully. Be content with your wages.”"},{"type":"h2","text":"One Mightier Than John"},{"type":"p","html":"<sup class=\"v\">15<\/sup> As the people were in expectation, and all men reasoned in their hearts concerning John, whether perhaps he was the Christ, <sup class=\"v\">16<\/sup> John answered them all, “I indeed baptize you with water, but he comes who is mightier than I, the strap of whose sandals I am not worthy to loosen. He will baptize you in the Holy Spirit and fire, <sup class=\"v\">17<\/sup> whose fan is in his hand, and he will thoroughly cleanse his threshing floor, and will gather the wheat into his barn; but he will burn up the chaff with unquenchable fire.”"},{"type":"q","id":"3.5","field":"q21","text":"<b>Action:<\/b> John said of Jesus, “the strap of whose sandals I am not worthy to loosen” (v. 16). What will help you keep Jesus first, and yourself second, this week?"},{"type":"p","html":"<sup class=\"v\">18<\/sup> Then with many other exhortations he preached good news to the people, <sup class=\"v\">19<\/sup> but Herod the tetrarch, being reproved by him for Herodias, his brother’s wife, and for all the evil things which Herod had done, <sup class=\"v\">20<\/sup> added this also to them all, that he shut up John in prison."},{"type":"h2","text":"The Baptism of Jesus"},{"type":"img","src":"img/luke03-v21.jpg","w":1100,"h":733,"alt":"A river flowing through a sunlit green forest"},{"type":"p","html":"<sup class=\"v\">21<\/sup> Now when all the people were baptized, Jesus also had been baptized, and was praying. The sky was opened, <sup class=\"v\">22<\/sup> and the Holy Spirit descended in a bodily form like a dove on him; and a voice came out of the sky, saying “You are my beloved Son. In you I am well pleased.”"},{"type":"q","id":"3.6","field":"q22","text":"<b>Heart:<\/b> Consider the image of the river. As Jesus prayed, a voice came out of the sky: “You are my beloved Son. In you I am well pleased” (v. 22). How do these words of the Father speak to you?"},{"type":"h2","text":"The Family Line of Jesus"},{"type":"img","src":"img/luke03-v23.jpg","w":1100,"h":733,"alt":"A large family of several generations gathered together outdoors"},{"type":"p","html":"<sup class=\"v\">23<\/sup> Jesus himself, when he began to teach, was about thirty years old, being the son (as was supposed) of Joseph, the son of Heli, <sup class=\"v\">24<\/sup> the son of Matthat, the son of Levi, the son of Melchi, the son of Jannai, the son of Joseph, <sup class=\"v\">25<\/sup> the son of Mattathias, the son of Amos, the son of Nahum, the son of Esli, the son of Naggai, <sup class=\"v\">26<\/sup> the son of Maath, the son of Mattathias, the son of Semein, the son of Joseph, the son of Judah, <sup class=\"v\">27<\/sup> the son of Joanan, the son of Rhesa, the son of Zerubbabel, the son of Shealtiel, the son of Neri, <sup class=\"v\">28<\/sup> the son of Melchi, the son of Addi, the son of Cosam, the son of Elmodam, the son of Er, <sup class=\"v\">29<\/sup> the son of Jose, the son of Eliezer, the son of Jorim, the son of Matthat, the son of Levi, <sup class=\"v\">30<\/sup> the son of Simeon, the son of Judah, the son of Joseph, the son of Jonan, the son of Eliakim, <sup class=\"v\">31<\/sup> the son of Melea, the son of Menan, the son of Mattatha, the son of Nathan, the son of David, <sup class=\"v\">32<\/sup> the son of Jesse, the son of Obed, the son of Boaz, the son of Salmon, the son of Nahshon, <sup class=\"v\">33<\/sup> the son of Amminadab, the son of Aram, the son of Hezron, the son of Perez, the son of Judah, <sup class=\"v\">34<\/sup> the son of Jacob, the son of Isaac, the son of Abraham, the son of Terah, the son of Nahor, <sup class=\"v\">35<\/sup> the son of Serug, the son of Reu, the son of Peleg, the son of Eber, the son of Shelah, <sup class=\"v\">36<\/sup> the son of Cainan, the son of Arphaxad, the son of Shem, the son of Noah, the son of Lamech, <sup class=\"v\">37<\/sup> the son of Methuselah, the son of Enoch, the son of Jared, the son of Mahalaleel, the son of Cainan, <sup class=\"v\">38<\/sup> the son of Enos, the son of Seth, the son of Adam, the son of God."},{"type":"q","id":"3.7","field":"q23","text":"<b>Head:<\/b> Consider the image of the family. Luke traces Jesus’ family line all the way back to “Adam, the son of God” (v. 38). What does this tell you about whom Jesus came to save?"}],"prayer":"God, you promised that “all flesh will see God’s salvation” (3:6). Give me wisdom as I read, and help me turn from my sins and live in a way that shows it (3:8)."},{"num":4,"hero":{"src":"img/luke04-hero.jpg","w":1100,"h":733,"alt":"A sandy path winding through a red rock canyon"},"blocks":[{"type":"h2","text":"Jesus Is Tested in the Wilderness"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Jesus, full of the Holy Spirit, returned from the Jordan, and was led by the Spirit into the wilderness <sup class=\"v\">2<\/sup> for forty days, being tempted by the devil. He ate nothing in those days. Afterward, when they were completed, he was hungry. <sup class=\"v\">3<\/sup> The devil said to him, “If you are the Son of God, command this stone to become bread.”"},{"type":"p","html":"<sup class=\"v\">4<\/sup> Jesus answered him, saying, “It is written, ‘Man shall not live by bread alone, but by every word of God.’ ”"},{"type":"q","id":"4.1","field":"q24","text":"<b>Head:<\/b> Look at the image that opens this chapter. Jesus “was led by the Spirit into the wilderness for forty days, being tempted by the devil” (v. 1-2). Why would the Spirit lead Jesus into a place of testing?"},{"type":"p","html":"<sup class=\"v\">5<\/sup> The devil, leading him up on a high mountain, showed him all the kingdoms of the world in a moment of time. <sup class=\"v\">6<\/sup> The devil said to him, “I will give you all this authority, and their glory, for it has been delivered to me; and I give it to whomever I want. <sup class=\"v\">7<\/sup> If you therefore will worship before me, it will all be yours.”"},{"type":"p","html":"<sup class=\"v\">8<\/sup> Jesus answered him, “Get behind me Satan! For it is written, ‘You shall worship the Lord your God, and you shall serve him only.’ ”"},{"type":"p","html":"<sup class=\"v\">9<\/sup> He led him to Jerusalem, and set him on the pinnacle of the temple, and said to him, “If you are the Son of God, cast yourself down from here, <sup class=\"v\">10<\/sup> for it is written,"},{"type":"poem","lines":["‘He will put his angels in charge of you, to guard you;’"]},{"type":"p","html":"<sup class=\"v\">11<\/sup> and,"},{"type":"poem","lines":["‘On their hands they will bear you up,","lest perhaps you dash your foot against a stone.’ ”"]},{"type":"p","html":"<sup class=\"v\">12<\/sup> Jesus answering, said to him, “It has been said, ‘You shall not tempt the Lord your God.’ ”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> When the devil had completed every temptation, he departed from him until another time."},{"type":"q","id":"4.2","field":"q25","text":"<b>Action:<\/b> Each time he was tested, Jesus answered, “It is written” (v. 4, 8). Which verse will you memorize this week to help you stand against temptation?"},{"type":"q","id":"4.3","field":"q26","text":"<b>Heart:<\/b> “When the devil had completed every temptation, he departed from him until another time” (v. 13). Where are you most often tempted? How does it help to know Jesus faced temptation too?"},{"type":"h2","text":"Rejected at Nazareth"},{"type":"img","src":"img/luke04-v14.jpg","w":1100,"h":716,"alt":"An ancient handwritten book lying open"},{"type":"p","html":"<sup class=\"v\">14<\/sup> Jesus returned in the power of the Spirit into Galilee, and news about him spread through all the surrounding area. <sup class=\"v\">15<\/sup> He taught in their synagogues, being glorified by all."},{"type":"p","html":"<sup class=\"v\">16<\/sup> He came to Nazareth, where he had been brought up. He entered, as was his custom, into the synagogue on the Sabbath day, and stood up to read. <sup class=\"v\">17<\/sup> The book of the prophet Isaiah was handed to him. He opened the book, and found the place where it was written,"},{"type":"poem","lines":["<sup class=\"v\">18<\/sup> “The Spirit of the Lord is on me,","because he has anointed me to preach good news to the poor.","He has sent me to heal the broken hearted,","to proclaim release to the captives,","recovering of sight to the blind,","to deliver those who are crushed,","<sup class=\"v\">19<\/sup> and to proclaim the acceptable year of the Lord.”"]},{"type":"p","html":"<sup class=\"v\">20<\/sup> He closed the book, gave it back to the attendant, and sat down. The eyes of all in the synagogue were fastened on him. <sup class=\"v\">21<\/sup> He began to tell them, “Today, this Scripture has been fulfilled in your hearing.”"},{"type":"q","id":"4.4","field":"q27","text":"<b>Head:<\/b> Consider the image of the open book. Jesus read from Isaiah, “The Spirit of the Lord is on me, because he has anointed me to preach good news to the poor” (v. 18). What does this tell you about Jesus’ mission?"},{"type":"p","html":"<sup class=\"v\">22<\/sup> All testified about him, and wondered at the gracious words which proceeded out of his mouth, and they said, “Isn’t this Joseph’s son?”"},{"type":"p","html":"<sup class=\"v\">23<\/sup> He said to them, “Doubtless you will tell me this parable, ‘Physician, heal yourself! Whatever we have heard done at Capernaum, do also here in your hometown.’ ” <sup class=\"v\">24<\/sup> He said, “Most certainly I tell you, no prophet is acceptable in his hometown. <sup class=\"v\">25<\/sup> But truly I tell you, there were many widows in Israel in the days of Elijah, when the sky was shut up three years and six months, when a great famine came over all the land. <sup class=\"v\">26<\/sup> Elijah was sent to none of them, except to Zarephath, in the land of Sidon, to a woman who was a widow. <sup class=\"v\">27<\/sup> There were many lepers in Israel in the time of Elisha the prophet, yet not one of them was cleansed, except Naaman, the Syrian.”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> They were all filled with wrath in the synagogue, as they heard these things. <sup class=\"v\">29<\/sup> They rose up, threw him out of the city, and led him to the brow of the hill that their city was built on, that they might throw him off the cliff. <sup class=\"v\">30<\/sup> But he, passing through the middle of them, went his way."},{"type":"q","id":"4.5","field":"q28","text":"<b>Heart:<\/b> The people of his hometown asked, “Isn’t this Joseph’s son?” (v. 22), and soon they were filled with anger (v. 28). When have you found it hard to hear God through someone you know well?"},{"type":"h2","text":"Power over an Evil Spirit"},{"type":"p","html":"<sup class=\"v\">31<\/sup> He came down to Capernaum, a city of Galilee. He was teaching them on the Sabbath day, <sup class=\"v\">32<\/sup> and they were astonished at his teaching, for his word was with authority. <sup class=\"v\">33<\/sup> In the synagogue there was a man who had a spirit of an unclean demon, and he cried out with a loud voice, <sup class=\"v\">34<\/sup> saying, “Ah! what have we to do with you, Jesus of Nazareth? Have you come to destroy us? I know who you are: the Holy One of God!”"},{"type":"p","html":"<sup class=\"v\">35<\/sup> Jesus rebuked him, saying, “Be silent, and come out of him!” When the demon had thrown him down in the middle of them, he came out of him, having done him no harm."},{"type":"p","html":"<sup class=\"v\">36<\/sup> Amazement came on all, and they spoke together, one with another, saying, “What is this word? For with authority and power he commands the unclean spirits, and they come out!” <sup class=\"v\">37<\/sup> News about him went out into every place of the surrounding region."},{"type":"h2","text":"Healing at Simon’s House"},{"type":"img","src":"img/luke04-v38.jpg","w":1100,"h":733,"alt":"A nurse caring for a patient in a hospital bed"},{"type":"p","html":"<sup class=\"v\">38<\/sup> He rose up from the synagogue, and entered into Simon’s house. Simon’s mother-in-law was afflicted with a great fever, and they begged him for her. <sup class=\"v\">39<\/sup> He stood over her, and rebuked the fever; and it left her. Immediately she rose up and served them. <sup class=\"v\">40<\/sup> When the sun was setting, all those who had any sick with various diseases brought them to him; and he laid his hands on every one of them, and healed them. <sup class=\"v\">41<\/sup> Demons also came out of many, crying out, and saying, “You are the Christ, the Son of God!” Rebuking them, he didn’t allow them to speak, because they knew that he was the Christ."},{"type":"q","id":"4.6","field":"q29","text":"<b>Action:<\/b> Consider the image of the caregiver. Simon’s mother-in-law was healed, and “Immediately she rose up and served them” (v. 39). How will you serve others this week in thanks for what God has done for you?"},{"type":"h2","text":"Preaching in the Towns"},{"type":"img","src":"img/luke04-v42.jpg","w":1100,"h":693,"alt":"A lone person standing on a hilltop at dawn"},{"type":"p","html":"<sup class=\"v\">42<\/sup> When it was day, he departed and went into an uninhabited place, and the multitudes looked for him, and came to him, and held on to him, so that he wouldn’t go away from them. <sup class=\"v\">43<\/sup> But he said to them, “I must preach the good news of God’s Kingdom to the other cities also. For this reason I have been sent.” <sup class=\"v\">44<\/sup> He was preaching in the synagogues of Galilee."},{"type":"q","id":"4.7","field":"q30","text":"<b>Heart:<\/b> Consider the image of the sunrise. “When it was day, he departed and went into an uninhabited place” (v. 42). How do you make space to be alone with God?"}],"prayer":"Father in heaven, you sent Jesus to bring good news to the poor and freedom to the oppressed (4:18). Give me wisdom as I read, and set me free where I am bound."},{"num":5,"hero":{"src":"img/luke05-hero.jpg","w":1100,"h":733,"alt":"A fisherman and his boat at sunrise"},"blocks":[{"type":"h2","text":"A Great Catch of Fish"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now while the multitude pressed on him and heard the word of God, he was standing by the lake of Gennesaret. <sup class=\"v\">2<\/sup> He saw two boats standing by the lake, but the fishermen had gone out of them, and were washing their nets. <sup class=\"v\">3<\/sup> He entered into one of the boats, which was Simon’s, and asked him to put out a little from the land. He sat down and taught the multitudes from the boat. <sup class=\"v\">4<\/sup> When he had finished speaking, he said to Simon, “Put out into the deep, and let down your nets for a catch.”"},{"type":"p","html":"<sup class=\"v\">5<\/sup> Simon answered him, “Master, we worked all night, and took nothing; but at your word I will let down the net.” <sup class=\"v\">6<\/sup> When they had done this, they caught a great multitude of fish, and their net was breaking. <sup class=\"v\">7<\/sup> They beckoned to their partners in the other boat, that they should come and help them. They came, and filled both boats, so that they began to sink. <sup class=\"v\">8<\/sup> But Simon Peter, when he saw it, fell down at Jesus’ knees, saying, “Depart from me, for I am a sinful man, Lord.” <sup class=\"v\">9<\/sup> For he was amazed, and all who were with him, at the catch of fish which they had caught; <sup class=\"v\">10<\/sup> and so also were James and John, sons of Zebedee, who were partners with Simon."},{"type":"q","id":"5.1","field":"q31","text":"<b>Heart:<\/b> Look at the image that opens this chapter. Simon said, “Master, we worked all night, and took nothing; but at your word I will let down the net” (v. 5). When have you obeyed Jesus even when it didn’t make sense to you?"},{"type":"p","html":"Jesus said to Simon, “Don’t be afraid. From now on you will be catching people alive.”"},{"type":"p","html":"<sup class=\"v\">11<\/sup> When they had brought their boats to land, they left everything, and followed him."},{"type":"q","id":"5.2","field":"q32","text":"<b>Head:<\/b> After the great catch, Peter fell at Jesus’ knees, saying, “Depart from me, for I am a sinful man, Lord” (v. 8). Why do you think the miracle made Peter so aware of his sin?"},{"type":"q","id":"5.3","field":"q33","text":"<b>Action:<\/b> “When they had brought their boats to land, they left everything, and followed him” (v. 11). What is one thing you will leave behind this week to follow Jesus more fully?"},{"type":"h2","text":"A Leper Is Cleansed"},{"type":"img","src":"img/luke05-v12.jpg","w":1100,"h":545,"alt":"Two hands reaching toward each other through a wire fence"},{"type":"p","html":"<sup class=\"v\">12<\/sup> While he was in one of the cities, behold, there was a man full of leprosy. When he saw Jesus, he fell on his face, and begged him, saying, “Lord, if you want to, you can make me clean.”"},{"type":"p","html":"<sup class=\"v\">13<\/sup> He stretched out his hand, and touched him, saying, “I want to. Be made clean.”"},{"type":"p","html":"Immediately the leprosy left him. <sup class=\"v\">14<\/sup> He commanded him to tell no one, “But go your way, and show yourself to the priest, and offer for your cleansing according to what Moses commanded, for a testimony to them.” <sup class=\"v\">15<\/sup> But the report concerning him spread much more, and great multitudes came together to hear, and to be healed by him of their infirmities. <sup class=\"v\">16<\/sup> But he withdrew himself into the desert, and prayed."},{"type":"q","id":"5.4","field":"q34","text":"<b>Heart:<\/b> Consider the image of the reaching hands. Jesus “stretched out his hand, and touched him” (v. 13). How does it feel to know Jesus is willing to touch what others avoid?"},{"type":"q","id":"5.5","field":"q35","text":"<b>Action:<\/b> “But he withdrew himself into the desert, and prayed” (v. 16). When will you withdraw to pray this week?"},{"type":"h2","text":"Friends Bring a Paralyzed Man"},{"type":"img","src":"img/luke05-v17.jpg","w":1100,"h":731,"alt":"Old clay roof tiles"},{"type":"p","html":"<sup class=\"v\">17<\/sup> On one of those days, he was teaching; and there were Pharisees and teachers of the law sitting by, who had come out of every village of Galilee, Judea, and Jerusalem. The power of the Lord was with him to heal them. <sup class=\"v\">18<\/sup> Behold, men brought a paralyzed man on a cot, and they sought to bring him in to lay before Jesus. <sup class=\"v\">19<\/sup> Not finding a way to bring him in because of the multitude, they went up to the housetop, and let him down through the tiles with his cot into the middle before Jesus. <sup class=\"v\">20<\/sup> Seeing their faith, he said to him, “Man, your sins are forgiven you.”"},{"type":"p","html":"<sup class=\"v\">21<\/sup> The scribes and the Pharisees began to reason, saying, “Who is this that speaks blasphemies? Who can forgive sins, but God alone?”"},{"type":"p","html":"<sup class=\"v\">22<\/sup> But Jesus, perceiving their thoughts, answered them, “Why are you reasoning so in your hearts? <sup class=\"v\">23<\/sup> Which is easier to say, ‘Your sins are forgiven you;’ or to say, ‘Arise and walk?’ <sup class=\"v\">24<\/sup> But that you may know that the Son of Man has authority on earth to forgive sins” (he said to the paralyzed man), “I tell you, arise, take up your cot, and go to your house.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> Immediately he rose up before them, and took up that which he was laying on, and departed to his house, glorifying God. <sup class=\"v\">26<\/sup> Amazement took hold on all, and they glorified God. They were filled with fear, saying, “We have seen strange things today.”"},{"type":"q","id":"5.6","field":"q36","text":"<b>Head:<\/b> Consider the image of the roof. The friends let the man down “through the tiles” (v. 19). “Seeing their faith,” Jesus forgave the man’s sins (v. 20). What does this story teach about the faith of friends?"},{"type":"h2","text":"Levi Follows Jesus"},{"type":"img","src":"img/luke05-v27.jpg","w":1100,"h":754,"alt":"Friends sharing a meal together at night"},{"type":"p","html":"<sup class=\"v\">27<\/sup> After these things he went out, and saw a tax collector named Levi sitting at the tax office, and said to him, “Follow me!”"},{"type":"p","html":"<sup class=\"v\">28<\/sup> He left everything, and rose up and followed him. <sup class=\"v\">29<\/sup> Levi made a great feast for him in his house. There was a great crowd of tax collectors and others who were reclining with them. <sup class=\"v\">30<\/sup> Their scribes and the Pharisees murmured against his disciples, saying, “Why do you eat and drink with the tax collectors and sinners?” <sup class=\"v\">31<\/sup> Jesus answered them, “Those who are healthy have no need for a physician, but those who are sick do. <sup class=\"v\">32<\/sup> I have not come to call the righteous, but sinners to repentance.”"},{"type":"q","id":"5.7","field":"q37","text":"<b>Heart:<\/b> Consider the image of the meal. Jesus said, “I have not come to call the righteous, but sinners to repentance” (v. 32). Whom do you find hard to welcome at your table?"},{"type":"h2","text":"New Wine, New Wineskins"},{"type":"p","html":"<sup class=\"v\">33<\/sup> They said to him, “Why do John’s disciples often fast and pray, likewise also the disciples of the Pharisees, but yours eat and drink?”"},{"type":"p","html":"<sup class=\"v\">34<\/sup> He said to them, “Can you make the friends of the bridegroom fast while the bridegroom is with them? <sup class=\"v\">35<\/sup> But the days will come when the bridegroom will be taken away from them. Then they will fast in those days.” <sup class=\"v\">36<\/sup> He also told a parable to them. “No one puts a piece from a new garment on an old garment, or else he will tear the new, and also the piece from the new will not match the old. <sup class=\"v\">37<\/sup> No one puts new wine into old wine skins, or else the new wine will burst the skins, and it will be spilled, and the skins will be destroyed. <sup class=\"v\">38<\/sup> But new wine must be put into fresh wine skins, and both are preserved. <sup class=\"v\">39<\/sup> No man having drunk old wine immediately desires new, for he says, ‘The old is better.’ ”"},{"type":"q","id":"5.8","field":"q38","text":"<b>Head:<\/b> “No one puts new wine into old wine skins” (v. 37). What do you think Jesus meant?"}],"prayer":"God, your Son reached out to a man with leprosy and said, “I want to. Be made clean” (5:13). Give me wisdom as I read, and help me come to you just as I am."},{"num":6,"hero":{"src":"img/luke06-hero.jpg","w":1100,"h":734,"alt":"A path through a field of ripe grain toward a lone tree"},"blocks":[{"type":"h2","text":"Lord of the Sabbath"},{"type":"p","html":"<sup class=\"v\">1<\/sup> Now on the second Sabbath after the first, he was going through the grain fields. His disciples plucked the heads of grain and ate, rubbing them in their hands. <sup class=\"v\">2<\/sup> But some of the Pharisees said to them, “Why do you do that which is not lawful to do on the Sabbath day?”"},{"type":"p","html":"<sup class=\"v\">3<\/sup> Jesus, answering them, said, “Haven’t you read what David did when he was hungry, he, and those who were with him; <sup class=\"v\">4<\/sup> how he entered into God’s house, and took and ate the show bread, and gave also to those who were with him, which is not lawful to eat except for the priests alone?” <sup class=\"v\">5<\/sup> He said to them, “The Son of Man is lord of the Sabbath.”"},{"type":"q","id":"6.1","field":"q39","text":"<b>Head:<\/b> Look at the image that opens this chapter. Jesus said, “The Son of Man is lord of the Sabbath” (v. 5). What does it mean that Jesus is Lord even of our rest?"},{"type":"p","html":"<sup class=\"v\">6<\/sup> It also happened on another Sabbath that he entered into the synagogue and taught. There was a man there, and his right hand was withered. <sup class=\"v\">7<\/sup> The scribes and the Pharisees watched him, to see whether he would heal on the Sabbath, that they might find an accusation against him. <sup class=\"v\">8<\/sup> But he knew their thoughts; and he said to the man who had the withered hand, “Rise up, and stand in the middle.” He arose and stood. <sup class=\"v\">9<\/sup> Then Jesus said to them, “I will ask you something: Is it lawful on the Sabbath to do good, or to do harm? To save a life, or to kill?” <sup class=\"v\">10<\/sup> He looked around at them all, and said to the man, “Stretch out your hand.” He did, and his hand was restored as sound as the other. <sup class=\"v\">11<\/sup> But they were filled with rage, and talked with one another about what they might do to Jesus."},{"type":"q","id":"6.2","field":"q40","text":"<b>Head:<\/b> Jesus asked, “Is it lawful on the Sabbath to do good, or to do harm? To save a life, or to kill?” (v. 9). Why did his act of healing make the leaders so angry?"},{"type":"h2","text":"Jesus Chooses the Twelve"},{"type":"img","src":"img/luke06-v12.jpg","w":1100,"h":733,"alt":"The Milky Way above a dark mountain"},{"type":"p","html":"<sup class=\"v\">12<\/sup> In these days, he went out to the mountain to pray, and he continued all night in prayer to God. <sup class=\"v\">13<\/sup> When it was day, he called his disciples, and from them he chose twelve, whom he also named apostles: <sup class=\"v\">14<\/sup> Simon, whom he also named Peter; Andrew, his brother; James; John; Philip; Bartholomew; <sup class=\"v\">15<\/sup> Matthew; Thomas; James, the son of Alphaeus; Simon, who was called the Zealot; <sup class=\"v\">16<\/sup> Judas the son of James; and Judas Iscariot, who also became a traitor."},{"type":"q","id":"6.3","field":"q41","text":"<b>Action:<\/b> Consider the image of the mountain at night. Jesus “continued all night in prayer to God” before choosing the twelve (v. 12). What decision will you bring to God in prayer this week?"},{"type":"h2","text":"Blessings and Woes"},{"type":"p","html":"<sup class=\"v\">17<\/sup> He came down with them, and stood on a level place, with a crowd of his disciples, and a great number of the people from all Judea and Jerusalem, and the sea coast of Tyre and Sidon, who came to hear him and to be healed of their diseases; <sup class=\"v\">18<\/sup> as well as those who were troubled by unclean spirits, and they were being healed. <sup class=\"v\">19<\/sup> All the multitude sought to touch him, for power came out of him and healed them all."},{"type":"p","html":"<sup class=\"v\">20<\/sup> He lifted up his eyes to his disciples, and said,"},{"type":"poem","lines":["“Blessed are you who are poor,","God’s Kingdom is yours.","<sup class=\"v\">21<\/sup> Blessed are you who hunger now,","for you will be filled.","Blessed are you who weep now,","for you will laugh.","<sup class=\"v\">22<\/sup> Blessed are you when men hate you, and when they exclude and mock you, and throw out your name as evil, for the Son of Man’s sake.","<sup class=\"v\">23<\/sup> Rejoice in that day, and leap for joy, for behold, your reward is great in heaven, for their fathers did the same thing to the prophets."]},{"type":"poem","lines":["<sup class=\"v\">24<\/sup> “But woe to you who are rich!","For you have received your consolation.","<sup class=\"v\">25<\/sup> Woe to you, you who are full now,","for you will be hungry.","Woe to you who laugh now,","for you will mourn and weep.","<sup class=\"v\">26<\/sup> Woe, when men speak well of you,","for their fathers did the same thing to the false prophets."]},{"type":"q","id":"6.4","field":"q42","text":"<b>Heart:<\/b> Which of the blessings and woes in verses 20-26 speaks most to you right now? Why?"},{"type":"h2","text":"Love Your Enemies"},{"type":"img","src":"img/luke06-v27.jpg","w":1100,"h":649,"alt":"Two people clasping hands"},{"type":"p","html":"<sup class=\"v\">27<\/sup> “But I tell you who hear: love your enemies, do good to those who hate you, <sup class=\"v\">28<\/sup> bless those who curse you, and pray for those who mistreat you. <sup class
