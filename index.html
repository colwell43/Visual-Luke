the cross, to carry it after Jesus. <sup class=\"v\">27<\/sup> A great multitude of the people followed him, including women who also mourned and lamented him. <sup class=\"v\">28<\/sup> But Jesus, turning to them, said, “Daughters of Jerusalem, don’t weep for me, but weep for yourselves and for your children. <sup class=\"v\">29<\/sup> For behold, the days are coming in which they will say, ‘Blessed are the barren, the wombs that never bore, and the breasts that never nursed.’ <sup class=\"v\">30<\/sup> Then they will begin to tell the mountains, ‘Fall on us!’ and tell the hills, ‘Cover us.’ <sup class=\"v\">31<\/sup> For if they do these things in the green tree, what will be done in the dry?”"},{"type":"q","id":"23.3","field":"q168","text":"<b>Action:<\/b> Consider the image of the heavy load. Soldiers took Simon of Cyrene and laid the cross on him “to carry it after Jesus” (v. 26). Whose burden will you help carry this week?"},{"type":"p","html":"<sup class=\"v\">32<\/sup> There were also others, two criminals, led with him to be put to death. <sup class=\"v\">33<\/sup> When they came to the place that is called “The Skull”, they crucified him there with the criminals, one on the right and the other on the left."},{"type":"p","html":"<sup class=\"v\">34<\/sup> Jesus said, “Father, forgive them, for they don’t know what they are doing.”"},{"type":"p","html":"Dividing his garments among them, they cast lots. <sup class=\"v\">35<\/sup> The people stood watching. The rulers with them also scoffed at him, saying, “He saved others. Let him save himself, if this is the Christ of God, his chosen one!”"},{"type":"p","html":"<sup class=\"v\">36<\/sup> The soldiers also mocked him, coming to him and offering him vinegar, <sup class=\"v\">37<\/sup> and saying, “If you are the King of the Jews, save yourself!”"},{"type":"p","html":"<sup class=\"v\">38<\/sup> An inscription was also written over him in letters of Greek, Latin, and Hebrew: “THIS IS THE KING OF THE JEWS.”"},{"type":"q","id":"23.4","field":"q169","text":"<b>Heart:<\/b> Jesus said, “Father, forgive them, for they don’t know what they are doing” (v. 34). How do these words change the way you think about forgiveness?"},{"type":"h2","text":"The Two Criminals"},{"type":"img","src":"img/luke23-v39.jpg","w":1100,"h":733,"alt":"A sunlit garden with flowers and a small bridge"},{"type":"p","html":"<sup class=\"v\">39<\/sup> One of the criminals who was hanged insulted him, saying, “If you are the Christ, save yourself and us!”"},{"type":"p","html":"<sup class=\"v\">40<\/sup> But the other answered, and rebuking him said, “Don’t you even fear God, seeing you are under the same condemnation? <sup class=\"v\">41<\/sup> And we indeed justly, for we receive the due reward for our deeds, but this man has done nothing wrong.” <sup class=\"v\">42<\/sup> He said to Jesus, “Lord, remember me when you come into your Kingdom.”"},{"type":"p","html":"<sup class=\"v\">43<\/sup> Jesus said to him, “Assuredly I tell you, today you will be with me in Paradise.”"},{"type":"q","id":"23.5","field":"q170","text":"<b>Heart:<\/b> Consider the image of the garden. Jesus said to the criminal, “today you will be with me in Paradise” (v. 43). What gives you hope in Jesus’ answer?"},{"type":"h2","text":"The Death of Jesus"},{"type":"img","src":"img/luke23-v44.jpg","w":1100,"h":1100,"alt":"The sun darkened in an eclipse"},{"type":"p","html":"<sup class=\"v\">44<\/sup> It was now about the sixth hour, and darkness came over the whole land until the ninth hour. <sup class=\"v\">45<\/sup> The sun was darkened, and the veil of the temple was torn in two. <sup class=\"v\">46<\/sup> Jesus, crying with a loud voice, said, “Father, into your hands I commit my spirit!” Having said this, he breathed his last."},{"type":"p","html":"<sup class=\"v\">47<\/sup> When the centurion saw what was done, he glorified God, saying, “Certainly this was a righteous man.” <sup class=\"v\">48<\/sup> All the multitudes that came together to see this, when they saw the things that were done, returned home beating their breasts. <sup class=\"v\">49<\/sup> All his acquaintances and the women who followed with him from Galilee stood at a distance, watching these things."},{"type":"q","id":"23.6","field":"q171","text":"<b>Head:<\/b> Consider the image of the darkness. Jesus cried, “Father, into your hands I commit my spirit!” (v. 46). The centurion said, “Certainly this was a righteous man” (v. 47). What did the centurion see in the way Jesus died?"},{"type":"h2","text":"The Burial of Jesus"},{"type":"p","html":"<sup class=\"v\">50<\/sup> Behold, a man named Joseph, who was a member of the council, a good and righteous man <sup class=\"v\">51<\/sup> (he had not consented to their counsel and deed), from Arimathaea, a city of the Jews, who was also waiting for God’s Kingdom: <sup class=\"v\">52<\/sup> this man went to Pilate, and asked for Jesus’ body. <sup class=\"v\">53<\/sup> He took it down, and wrapped it in a linen cloth, and laid him in a tomb that was cut in stone, where no one had ever been laid. <sup class=\"v\">54<\/sup> It was the day of the Preparation, and the Sabbath was drawing near. <sup class=\"v\">55<\/sup> The women, who had come with him out of Galilee, followed after, and saw the tomb, and how his body was laid. <sup class=\"v\">56<\/sup> They returned and prepared spices and ointments. On the Sabbath they rested according to the commandment."},{"type":"q","id":"23.7","field":"q172","text":"<b>Action:<\/b> Joseph of Arimathea, “a good and righteous man” (v. 50), asked for Jesus’ body, and the women prepared spices (v. 56). How will you show faithful love to Jesus this week, even in a quiet way?"}],"prayer":"Father in heaven, on the cross your Son prayed, “Father, forgive them, for they don’t know what they are doing” (23:34). Give me wisdom as I read, and help me receive your forgiveness and forgive others."},{"num":24,"hero":{"src":"img/luke24-hero.jpg","w":1100,"h":825,"alt":"Rays of the rising sun bursting over a hill"},"blocks":[{"type":"h2","text":"He Is Risen"},{"type":"p","html":"<sup class=\"v\">1<\/sup> But on the first day of the week, at early dawn, they and some others came to the tomb, bringing the spices which they had prepared. <sup class=\"v\">2<\/sup> They found the stone rolled away from the tomb. <sup class=\"v\">3<\/sup> They entered in, and didn’t find the Lord Jesus’ body. <sup class=\"v\">4<\/sup> While they were greatly perplexed about this, behold, two men stood by them in dazzling clothing. <sup class=\"v\">5<\/sup> Becoming terrified, they bowed their faces down to the earth."},{"type":"p","html":"They said to them, “Why do you seek the living among the dead? <sup class=\"v\">6<\/sup> He isn’t here, but is risen. Remember what he told you when he was still in Galilee, <sup class=\"v\">7<\/sup> saying that the Son of Man must be delivered up into the hands of sinful men and be crucified, and the third day rise again?”"},{"type":"p","html":"<sup class=\"v\">8<\/sup> They remembered his words, <sup class=\"v\">9<\/sup> returned from the tomb, and told all these things to the eleven and to all the rest. <sup class=\"v\">10<\/sup> Now they were Mary Magdalene, Joanna, and Mary the mother of James. The other women with them told these things to the apostles. <sup class=\"v\">11<\/sup> These words seemed to them to be nonsense, and they didn’t believe them. <sup class=\"v\">12<\/sup> But Peter got up and ran to the tomb. Stooping and looking in, he saw the strips of linen lying by themselves, and he departed to his home, wondering what had happened."},{"type":"q","id":"24.1","field":"q173","text":"<b>Heart:<\/b> Look at the image that opens this chapter. The men in dazzling clothing asked, “Why do you seek the living among the dead?” (v. 5). Where might you be looking for life in the wrong places?"},{"type":"q","id":"24.2","field":"q174","text":"<b>Head:<\/b> The women’s report seemed to the apostles “to be nonsense” (v. 11). Why do you think the first witnesses of the resurrection were people others did not believe?"},{"type":"h2","text":"On the Road to Emmaus"},{"type":"img","src":"img/luke24-v13.jpg","w":1100,"h":733,"alt":"Two people walking together along a country path"},{"type":"p","html":"<sup class=\"v\">13<\/sup> Behold, two of them were going that very day to a village named Emmaus, which was sixty stadia from Jerusalem. <sup class=\"v\">14<\/sup> They talked with each other about all of these things which had happened. <sup class=\"v\">15<\/sup> While they talked and questioned together, Jesus himself came near, and went with them. <sup class=\"v\">16<\/sup> But their eyes were kept from recognizing him. <sup class=\"v\">17<\/sup> He said to them, “What are you talking about as you walk, and are sad?”"},{"type":"p","html":"<sup class=\"v\">18<\/sup> One of them, named Cleopas, answered him, “Are you the only stranger in Jerusalem who doesn’t know the things which have happened there in these days?”"},{"type":"p","html":"<sup class=\"v\">19<\/sup> He said to them, “What things?”"},{"type":"p","html":"They said to him, “The things concerning Jesus, the Nazarene, who was a prophet mighty in deed and word before God and all the people; <sup class=\"v\">20<\/sup> and how the chief priests and our rulers delivered him up to be condemned to death, and crucified him. <sup class=\"v\">21<\/sup> But we were hoping that it was he who would redeem Israel. Yes, and besides all this, it is now the third day since these things happened. <sup class=\"v\">22<\/sup> Also, certain women of our company amazed us, having arrived early at the tomb; <sup class=\"v\">23<\/sup> and when they didn’t find his body, they came saying that they had also seen a vision of angels, who said that he was alive. <sup class=\"v\">24<\/sup> Some of us went to the tomb, and found it just like the women had said, but they didn’t see him.”"},{"type":"p","html":"<sup class=\"v\">25<\/sup> He said to them, “Foolish men, and slow of heart to believe in all that the prophets have spoken! <sup class=\"v\">26<\/sup> Didn’t the Christ have to suffer these things and to enter into his glory?” <sup class=\"v\">27<\/sup> Beginning from Moses and from all the prophets, he explained to them in all the Scriptures the things concerning himself. <sup class=\"v\">28<\/sup> They came near to the village where they were going, and he acted like he would go further."},{"type":"q","id":"24.3","field":"q175","text":"<b>Head:<\/b> Consider the image of the road. Jesus “explained to them in all the Scriptures the things concerning himself” (v. 27). Why is it important to see Jesus throughout the Old Testament?"},{"type":"img","src":"img/luke24-v29.jpg","w":1100,"h":733,"alt":"Hands breaking food apart to share"},{"type":"p","html":"<sup class=\"v\">29<\/sup> They urged him, saying, “Stay with us, for it is almost evening, and the day is almost over.”"},{"type":"p","html":"He went in to stay with them. <sup class=\"v\">30<\/sup> When he had sat down at the table with them, he took the bread and gave thanks. Breaking it, he gave it to them. <sup class=\"v\">31<\/sup> Their eyes were opened and they recognized him, then he vanished out of their sight. <sup class=\"v\">32<\/sup> They said to one another, “Weren’t our hearts burning within us, while he spoke to us along the way, and while he opened the Scriptures to us?” <sup class=\"v\">33<\/sup> They rose up that very hour, returned to Jerusalem, and found the eleven gathered together, and those who were with them, <sup class=\"v\">34<\/sup> saying, “The Lord is risen indeed, and has appeared to Simon!” <sup class=\"v\">35<\/sup> They related the things that happened along the way, and how he was recognized by them in the breaking of the bread."},{"type":"q","id":"24.4","field":"q176","text":"<b>Heart:<\/b> Consider the image of the bread. They said, “Weren’t our hearts burning within us, while he spoke to us along the way” (v. 32). When has your heart burned as you met Jesus in Scripture?"},{"type":"q","id":"24.5","field":"q177","text":"<b>Action:<\/b> The two friends got up “that very hour” and returned to Jerusalem to tell the others (v. 33-35). Whom will you tell this week how you have met Jesus?"},{"type":"h2","text":"Jesus Appears to His Disciples"},{"type":"p","html":"<sup class=\"v\">36<\/sup> As they said these things, Jesus himself stood among them, and said to them, “Peace be to you.”"},{"type":"p","html":"<sup class=\"v\">37<\/sup> But they were terrified and filled with fear, and supposed that they had seen a spirit."},{"type":"p","html":"<sup class=\"v\">38<\/sup> He said to them, “Why are you troubled? Why do doubts arise in your hearts? <sup class=\"v\">39<\/sup> See my hands and my feet, that it is truly me. Touch me and see, for a spirit doesn’t have flesh and bones, as you see that I have.” <sup class=\"v\">40<\/sup> When he had said this, he showed them his hands and his feet. <sup class=\"v\">41<\/sup> While they still didn’t believe for joy, and wondered, he said to them, “Do you have anything here to eat?”"},{"type":"p","html":"<sup class=\"v\">42<\/sup> They gave him a piece of a broiled fish and some honeycomb. <sup class=\"v\">43<\/sup> He took them, and ate in front of them. <sup class=\"v\">44<\/sup> He said to them, “This is what I told you, while I was still with you, that all things which are written in the law of Moses, the prophets, and the psalms, concerning me must be fulfilled.”"},{"type":"q","id":"24.6","field":"q178","text":"<b>Head:<\/b> Jesus said, “See my hands and my feet, that it is truly me” (v. 39), and he ate in front of them (v. 42-43). Why did Jesus show them that his body was real?"},{"type":"p","html":"<sup class=\"v\">45<\/sup> Then he opened their minds, that they might understand the Scriptures. <sup class=\"v\">46<\/sup> He said to them, “Thus it is written, and thus it was necessary for the Christ to suffer and to rise from the dead the third day, <sup class=\"v\">47<\/sup> and that repentance and remission of sins should be preached in his name to all the nations, beginning at Jerusalem. <sup class=\"v\">48<\/sup> You are witnesses of these things. <sup class=\"v\">49<\/sup> Behold, I send out the promise of my Father on you. But wait in the city of Jerusalem until you are clothed with power from on high.”"},{"type":"q","id":"24.7","field":"q179","text":"<b>Action:<\/b> Jesus said, “You are witnesses of these things” (v. 48). How will you be a witness for Jesus this week?"},{"type":"h2","text":"Jesus Is Taken Up into Heaven"},{"type":"img","src":"img/luke24-v50.jpg","w":1100,"h":733,"alt":"Sunlight breaking through clouds"},{"type":"p","html":"<sup class=\"v\">50<\/sup> He led them out as far as Bethany, and he lifted up his hands, and blessed them. <sup class=\"v\">51<\/sup> While he blessed them, he withdrew from them, and was carried up into heaven. <sup class=\"v\">52<\/sup> They worshiped him, and returned to Jerusalem with great joy, <sup class=\"v\">53<\/sup> and were continually in the temple, praising and blessing God. Amen."},{"type":"q","id":"24.8","field":"q180","text":"<b>Heart:<\/b> Consider the image of the sky. Jesus “lifted up his hands, and blessed them” (v. 50), and they “returned to Jerusalem with great joy” (v. 52). As you look back over the images in Luke, which one will stay with you? Why?"}],"prayer":"God, you raised Jesus from the dead, and he opened his followers’ minds to understand the Scriptures (24:6, 45). Give me wisdom as I read, and let my heart burn within me as he speaks to me (24:32)."}],"discussion":{"intro":"Linking LIFE and SCRIPTURE using IMAGES is best done by asking questions. Visual Luke provides many such questions within the chapters. Below are ten types of image-based questions. These types and examples can help you craft your own questions as you lead group discussions and reflect personally on a passage.","types":[["Image to Story",null,["What story do you see in this image?","If an image is worth a thousand words, what words would you put with this image?"]],["Response to Image",null,["How do you respond to this image?","What emotions or feelings surface in you as you look at the picture?","How might these emotions link to your life story?"]],["Imaginations","a mental image, without looking at a picture",["As you consider the Bible story, how would you imagine it playing out?","How might you imagine yourself in that story?"]],["Link Image to Person",null,["If you put yourself in this picture, where would you be?","What would you be feeling? Thinking? Doing? Saying?","How might this image connect with your longings as a human being? (Consider longings such as: belong, intimacy, protect, provide, build, order, nurture, change, justice, mercy, explore, know, create, transcend.)","What message does this image convey? How might the image appeal to your decisions in life (choice of friends, career, purchases)?"]],["Link Image to Concept",null,["As you look at this image, how might it connect with the concept of grace, mercy, identity or power?","Consider these deep metaphors: balance, transformation, journey, container, connection, resource, control. (Gerald and Lindsay Zaltman, 2008). Which metaphor best relates to this image? Explain."]],["Link Image to Attractions, Aversions and Decisions",null,["Are you attracted to this image? If so, why? How do you usually manage your attractions?","Do you dislike this image? If so, why? How do you usually manage your aversions?","How might this image influence the way you make decisions?"]],["Link Image to God",null,["Where would you imagine God in this picture?","What is he doing? Thinking? Feeling? Saying? Explain why."]],["Link Image to Bible",null,["How do you see this image connecting with this passage?","What image might better connect with this passage for you?"]],["Link Image to Culture",null,["Our culture surrounds us with images. Which images in the past week relate to this passage? How did you respond to them?","What is the message of that image from the culture?","Does that cultural message align with the message of the Bible? Explain."]],["Link Image to Transformation",null,["As you reflect on this image and the passage, what surfaces in your heart? Where are you open to change, or closed to change?","How do this image and passage shape your view of God and his purposes? Is your heart aligned with God’s purposes?","How might this image encourage you in your daily walk with God?"]]]},"credits":[{"where":"Cover","desc":"A winding road through autumn forest toward a glowing sunrise","page":"https://pixabay.com/photos/heaven-5281668/","user":""},{"where":"Welcome page","desc":"A stack of old leather-bound books","page":"https://pixabay.com/photos/books-1177178/","user":""},{"where":"Welcome page","desc":"A grandmother and a small child sharing a meal","page":"https://pixabay.com/photos/grandparents-1019594/","user":""},{"where":"Welcome page","desc":"A shepherd leading his flock of sheep into a village","page":"https://pixabay.com/photos/sheep-298650/","user":""},{"where":"Luke 1, opening photo","desc":"A quill pen and inkwell on an old writing desk","page":"https://pixabay.com/photos/desk-1869579/","user":""},{"where":"Luke 1, An Angel Visits Zacharias","desc":"An elderly couple walking together down a village street","page":"https://pixabay.com/photos/human-189282/","user":""},{"where":"Luke 1, Mary Visits Elizabeth","desc":"Two women in a warm embrace","page":"https://pixabay.com/photos/mother-5978378/","user":""},{"where":"Luke 1, Zacharias’ Song","desc":"Morning mist and golden light over rolling green hills","page":"https://pixabay.com/photos/tea-plantation-7344889/","user":""},{"where":"Luke 2, opening photo","desc":"Hay in an old wooden stable","page":"https://pixabay.com/photos/barn-4460490/","user":""},{"where":"Luke 2, Shepherds Hear the Good News","desc":"A flock of sheep grazing in a field at sunset","page":"https://pixabay.com/photos abay.com/photos/broom-6786528/","user":""},{"where":"Luke 15, The Lost Son","desc":"A father and son sharing a tender moment","page":"https://pixabay.com/photos/father-4104952/","user":""},{"where":"Luke 15, The Older Brother","desc":"A young man standing with his arms crossed","page":"https://pixabay.com/photos/boy-1284509/","user":""},{"where":"Luke 16, opening photo","desc":"Pages of an old handwritten account ledger","page":"https://pixabay.com/photos/ledger-1428230/","user":""},{"where":"Luke 16, The Law and the Kingdom","desc":"Stacks and piles of coins","page":"https://pixabay.com/photos/money-4888195/","user":""},{"where":"Luke 16, The Rich Man and Lazarus","desc":"An old man sitting alone on a city curb","page":"https://pixabay.com/photos/old-man-1775239/","user":""},{"where":"Luke 16, The Rich Man and Lazarus","desc":"A deep canyon between steep red cliffs","page":"https://pixabay.com/photos/cliffs-1866832/","user":""},{"where":"Luke 17, opening photo","desc":"Two friends talking on a park bench","page":"https://pixabay.com/photos/women-7555799/","user":""},{"where":"Luke 17, Unworthy Servants","desc":"A waiter carrying plates of food to a table","page":"https://pixabay.com/photos/restaurant-939434/","user":""},{"where":"Luke 17, Ten Lepers Healed","desc":"A small plant with a “thank you” note","page":"https://pixabay.com/photos/thank-you-3690115/","user":""},{"where":"Luke 17, The Coming of the Kingdom","desc":"Lightning flashing across a purple sky","page":"https://pixabay.com/photos/flash-2568381/","user":""},{"where":"Luke 18, opening photo","desc":"A judge’s gavel on a wooden block","page":"https://pixabay.com/photos/gavel-6485824/","user":""},{"where":"Luke 18, The Pharisee and the Tax Collector","desc":"A man bowed in prayer between church pews","page":"https://pixabay.com/photos/pray-4631303/","user":""},{"where":"Luke 18, Jesus Blesses Children","desc":"A little girl running happily through a field","page":"https://pixabay.com/photos/joy-1740311/","user":""},{"where":"Luke 18, A Blind Beggar Sees","desc":"An older man’s hand resting on a wooden cane","page":"https://pixabay.com/photos/hand-588982/","user":""},{"where":"Luke 19, opening photo","desc":"A child climbing a tree","page":"https://pixabay.com/photos/child-7159635/","user":""},{"where":"Luke 19, The Story of the Ten Servants","desc":"Stacks of coins growing taller","page":"https://pixabay.com/photos/money-2180330/","user":""},{"where":"Luke 19, Jesus Enters Jerusalem","desc":"A donkey grazing on grass","page":"https://pixabay.com/photos/donkey-1268897/","user":""},{"where":"Luke 19, Jesus Weeps over the City","desc":"A hilltop town at dusk","page":"https://pixabay.com/photos/mikulov-1134141/","user":""},{"where":"Luke 20, opening photo","desc":"Rows of a vineyard in autumn","page":"https://pixabay.com/photos/viticulture-7559964/","user":""},{"where":"Luke 20, The Story of the Wicked Tenants","desc":"The stone corner of an old wall","page":"https://pixabay.com/photos/corner-3068121/","user":""},{"where":"Luke 20, Paying Taxes to Caesar","desc":"An ancient gold coin with a ruler’s portrait","page":"https://pixabay.com/photos/ancient-currency-330460/","user":""},{"where":"Luke 20, A Question about the Resurrection","desc":"A small green sprout rising from dark soil","page":"https://pixabay.com/photos/plant-2551467/","user":""},{"where":"Luke 21, opening photo","desc":"Two small copper coins","page":"https://pixabay.com/photos/loss-4890205/","user":""},{"where":"Luke 21, Signs of the End","desc":"The ruins of a great stone abbey","page":"https://pixabay.com/photos/whitby-abbey-2805489/","user":""},{"where":"Luke 21, The Coming of the Son of Man","desc":"Storm clouds and rays of light over a rough sea","page":"https://pixabay.com/photos/sky-264778/","user":""},{"where":"Luke 21, The Lesson of the Fig Tree","desc":"New leaves budding on a branch","page":"https://pixabay.com/photos/leaves-4112335/","user":""},{"where":"Luke 22, opening photo","desc":"Bread and a wooden cup on a table","page":"https://pixabay.com/photos/eucharist-885277/","user":""},{"where":"Luke 22, Who Is the Greatest?","desc":"Hands serving plates of food to people in need","page":"https://pixabay.com/photos/feeding-the-poor-862797/","user":""},{"where":"Luke 22, Jesus Prays on the Mount of Olives","desc":"Ancient olive trees in a grove","page":"https://pixabay.com/photos/landscape-5174546/","user":""},{"where":"Luke 22, Peter Denies Jesus","desc":"A rooster crowing","page":"https://pixabay.com/photos/chicken-8847895/","user":""},{"where":"Luke 23, opening photo","desc":"A wooden cross on a rocky summit against the sky","page":"https://pixabay.com/photos/cross-5615685/","user":""},{"where":"Luke 23, The Crucifixion","desc":"A man carrying a heavy sack on his head","page":"https://pixabay.com/photos/farmer-2008002/","user":""},{"where":"Luke 23, The Two Criminals","desc":"A sunlit garden with flowers and a small bridge","page":"https://pixabay.com/photos/bridge-2767545/","user":""},{"where":"Luke 23, The Death of Jesus","desc":"The sun darkened in an eclipse","page":"https://pixabay.com/photos/solar-eclipse-1115920/","user":""},{"where":"Luke 24, opening photo","desc":"Rays of the rising sun bursting over a hill","page":"https://pixabay.com/photos/sunlight-2323003/","user":""},{"where":"Luke 24, On the Road to Emmaus","desc":"Two people walking together along a country path","page":"https://pixabay.com/photos/elderly-2914879/","user":""},{"where":"Luke 24, On the Road to Emmaus","desc":"Hands breaking food apart to share","page":"https://pixabay.com/photos/bread-5031589/","user":""},{"where":"Luke 24, Jesus Is Taken Up into Heaven","desc":"Sunlight breaking through clouds","page":"https://pixabay.com/photos/sky-5060078/","user":""}],"master":{"welcome":"Master Questions. Three questions go with you through the whole book. You will find them again at the end of every chapter, with a box for your response, and the Summary after Luke 24 reviews them for the whole book. Responses and highlights are kept on this device only.","after":2,"chapter":"Step back and look at Luke {n} as a whole.","items":[["head","HEAD","What was the historical and cultural context of the original readers? What did this passage mean to them? (Context can be hard to know for sure, but it is important and helpful to consider.)"],["heart","HEART","What does this passage reveal about who God is? How does my heart respond to who He is? Is my heart open to Him as He reveals Himself? Am I judging God?"],["action","ACTION","What actions is God impressing on me to take? What should I carry with me into the future from this book?"]]},"summary":{"img":null,"intro":"You have read all 24 chapters of Luke. This Summary looks back over the whole book through the three Master Questions. Read each review, then write your own response in the boxes at the end.","respond":"Now answer the Master Questions for the whole Gospel of Luke.","parts":[["head","Here is what we can say about the people who first read Luke.",[["Written for Theophilus","Luke wrote “to write to you in order, most excellent Theophilus” (1:3), so that he might “know the certainty concerning the things in which you were instructed” (1:4). Theophilus had already been taught about Jesus. Luke wanted him to be sure."],["A careful researcher","Luke was not one of the Twelve. He drew on those “who from the beginning were eyewitnesses and servants of the word” (1:2). Paul calls him “the beloved physician” (Colossians 4:14), and Luke traveled with Paul."],["Good news for Gentiles","Most of Luke’s first readers were probably Gentile believers like Theophilus. Luke traces Jesus’ family line back to Adam (3:38), and Simeon calls Jesus “a light for revelation to the nations” (2:32)."],["What the book meant to them","Luke and Acts were written for believers spread across the Roman world. Luke showed them that the good news was for everyone, to be preached “to all the nations, beginning at Jerusalem” (24:47)."]],"Knowing their world helps you hear Luke as they did. Then ask what God is saying to you through it."],["heart","Jesus said, “For the Son of Man came to seek and to save that which was lost” (19:10). Here is what Luke shows about who God is in Jesus.",[["The Savior of all people","The angel told the shepherds, “For there is born to you today, in David’s city, a Savior, who is Christ the Lord” (2:11)."],["He seeks the lost","The shepherd goes after the lost sheep and the woman searches for her lost coin (15:4, 8). When the lost son came home, his father “ran, and fell on his neck, and kissed him” (15:20)."],["Merciful","“Therefore be merciful, even as your Father is also merciful” (6:36)."],["He welcomes outsiders","Jesus touched a man with leprosy (5:13), ate with tax collectors and sinners (15:1–2) and stayed at the house of Zacchaeus (19:5)."],["He prays","Luke often shows Jesus praying: at his baptism (3:21), all night before he chose the Twelve (6:12), on the mountain (9:28–29) and on the Mount of Olives (22:41–44)."],["He forgives","On the cross Jesus said, “Father, forgive them, for they don’t know what they are doing” (23:34). To the criminal beside him he said, “Today you will be with me in Paradise” (23:43)."],["He is risen","“Why do you seek the living among the dead? He isn’t here, but is risen” (24:5–6)."]],"Am I judging God? The Pharisees and scribes grumbled, “This man welcomes sinners, and eats with them” (15:2). The older brother “was angry, and would not go in” (15:28). How does your heart respond to who Jesus is? Is your heart open to him, or are you judging him?"],["action","Luke ends with Jesus’ followers praising God and waiting to be his witnesses. Here are steps the book impresses on its readers.",[["Say yes to God","“Behold, the servant of the Lord; let it be done to me according to your word” (1:38)."],["Follow Jesus every day","“If anyone desires to come after me, let him deny himself, take up his cross, and follow me” (9:23)."],["Love your neighbor","After the story of the Samaritan, Jesus said, “Go and do likewise” (10:37)."],["Pray and don’t give up","Jesus told a parable to show “that they must always pray, and not give up” (18:1)."],["Be generous","“Give, and it will be given to you” (6:38)."],["Give thanks","One of the ten lepers “turned back, glorifying God with a loud voice” (17:15)."],["Be his witnesses","“You are witnesses of these things” (24:48)."]],"Carry this with you: Jesus came to seek and to save the lost, and that includes you. “Today, salvation has come to this house” (19:9)."]]},"deeper":{"img":null,"intro":"Going Deeper is a short study guide to the whole Gospel of Luke. Use it after you finish reading, or alongside it, to see the big picture: who wrote Luke and when, the world it comes from, how the book is built, the themes and emotions that run through it, and free websites for further study.","sections":[["overview","Author and book overview"],["history","Historical and cultural insights"],["chart","Chart of the book"],["themes","Major themes and emotions"],["resources","Free resources online"]],"overviewLead":"Luke is the longest of the four Gospels and the first of two books by the same author. Luke tells what Jesus “began both to do and to teach” (Acts 1:1), and Acts continues the story. Luke writes carefully and in order, and he shows Jesus as the Savior of all people.","overview":[["Author","The book does not name its author, but the early church agreed that it was written by Luke, a physician and a travel companion of Paul (Colossians 4:14; 2 Timothy 4:11). He also wrote Acts, which is addressed to the same Theophilus (1:3; Acts 1:1)."],["Date","Many evangelical scholars date Luke to the early 60s A.D., because Acts ends about A.D. 62 with Paul still waiting in Rome. Others date it to the 70s or 80s A.D."],["Readers","Luke writes to “most excellent Theophilus” (1:3) and, through him, to a wider circle of mostly Gentile believers who had already been taught about Jesus."],["Sources","Luke carefully used the reports of eyewitnesses (1:2). Much of his material appears in no other Gospel."],["Purpose","That readers might “know the certainty concerning the things in which you were instructed” (1:4)."],["Key verses","1:1–4; 2:10–11; 4:18–19; 9:23; 15:7; 19:10; 23:34; 24:46–47."],["Found only in Luke","The songs of Mary and Zacharias, the shepherds, the boy Jesus in the temple, the good Samaritan, the lost coin and the lost son, Zacchaeus, the criminal on the cross and the road to Emmaus."],["Luke and Acts","Luke ends in Jerusalem with Jesus taken up into heaven (24:50–51). Acts begins there and follows the good news “to the uttermost parts of the earth” (Acts 1:8)."]],"history":[["Herod and Caesar Augustus","Luke ties his story to world history. Herod the Great was king of Judea (1:5), and Caesar Augustus ordered a census of the empire (2:1). Herod died about 4 B.C., so Jesus was born shortly before that."],["The fifteenth year of Tiberius","John began preaching “in the fifteenth year of the reign of Tiberius Caesar” (3:1), about A.D. 28 or 29, while Pontius Pilate governed Judea."],["Priests and the temple","Priests served in the Jerusalem temple in turns. The one who burned incense in the sanctuary was chosen by lot (1:8–9), an honor many priests never received."],["Shepherds","Shepherds lived outdoors with their flocks and were often looked down on. Yet God sent the angels’ news to them first (2:8–10)."],["Samaritans","Jews and Samaritans had been enemies for centuries. A Samaritan village refused to receive Jesus (9:52–53), which makes the hero of his parable all the more surprising (10:33)."],["Tax collectors","Tax collectors worked for Rome and often took more than was due (3:12–13). People saw them as traitors and sinners (19:7)."],["Meals and honor","Where you sat at a meal showed your honor. Jesus told guests to take the lowest place (14:8–11) and hosts to invite “the poor, the maimed, the lame, or the blind” (14:13)."],["Widows and women","Widows often had no one to provide for them. Luke shows Jesus caring for widows (7:12–15; 21:1–4) and women who followed him and supported him from their own means (8:1–3)."],["Passover in Jerusalem","Jesus ate the Passover with his disciples (22:15), the feast that remembered God bringing Israel out of slavery in Egypt."],["Crucifixion","Rome crucified slaves and rebels. The sign over Jesus read, “THIS IS THE KING OF THE JEWS” (23:38)."]],"chart":[["Birth and childhood","1:1–2:52",1,132,"Births of John and Jesus. Songs of praise. The boy Jesus in the temple.","2:11","“For there is born to you today, in David’s city, a Savior, who is Christ the Lord”"],["Preparing for ministry","3:1–4:13",3,51,"John prepares the way. Jesus is baptized and tested in the wilderness.","3:22","“You are my beloved Son. In you I am well pleased.”"],["Ministry in Galilee","4:14–9:50",4,275,"Jesus teaches, heals, forgives and calls the Twelve.","4:18","“The Spirit of the Lord is on me”"],["Toward Jerusalem: teaching","9:51–13:35",9,202,"Jesus sets out for Jerusalem, teaching on love, prayer and readiness.","10:27","“You shall love the Lord your God with all your heart”"],["Toward Jerusalem: the lost found","14:1–19:27",14,205,"The great banquet, parables of the lost, and Zacchaeus.","19:10","“For the Son of Man came to seek and to save that which was lost.”"],["Jesus in Jerusalem","19:28–21:38",19,106,"Jesus enters the city, clears the temple and teaches about the end.","19:38","“Blessed is the King who comes in the name of the Lord!”"],["Suffering and death","22:1–23:56",22,127,"The Last Supper, Jesus’ prayer, arrest, trials and crucifixion.","23:34","“Father, forgive them, for they don’t know what they are doing.”"],["Resurrection","24:1–53",24,53,"The empty tomb, the road to Emmaus and Jesus taken up into heaven.","24:6","“He isn’t here, but is risen.”"]],"chartLead":"The whole Gospel of Luke, drawn to scale by verses. Tap a color to open that part of the book.","chartLabel":"Chart of the Gospel of Luke","ticks":[["Luke 1",0],["6",24.11],["12",51.74],["18",70.94],["24",100]],"refHead":"Passage","refWord":"Luke","roundsTitle":"Three stories of the lost (Luke 15)","roundsHead":["Story","What was lost","Who searched or waited","The celebration"],"roundsEmph":[],"rounds":[["The lost sheep","One sheep out of a hundred (15:4)","The shepherd goes after it until he finds it (15:4–5)","“Rejoice with me, for I have found my sheep which was lost!” (15:6)"],["The lost coin","One coin out of ten (15:8)","The woman lights a lamp and sweeps the house (15:8)","“Rejoice with me, for I have found the drachma which I had lost” (15:9)"],["The lost son","One son out of two (15:11–13)","The father sees him far off and runs to him (15:20)","“for this, my son, was dead, and is alive again” (15:24)"]],"roundsNote":"Jesus told all three stories to Pharisees and scribes who grumbled that he “welcomes sinners, and eats with them” (15:2). Each story ends in joy: “there is joy in the presence of the angels of God over one sinner repenting” (15:10). The older brother is still outside at the end, and his father is pleading with him to come in (15:28).","themes":[["Good news for all people","The angel’s news was “to all the people” (2:10). Luke shows Jesus welcoming Samaritans, Gentiles, women, the poor and the outcast."],["Seeking the lost","“For the Son of Man came to seek and to save that which was lost” (19:10). Luke 15 tells three stories of lost things found."],["Prayer","Jesus prays at his baptism (3:21), before choosing the Twelve (6:12) and on the Mount of Olives (22:41). He teaches his disciples to pray (11:1–13; 18:1–8)."],["The Holy Spirit","The Spirit fills Elizabeth and Zacharias (1:41, 67), comes on Jesus at his baptism (3:22) and leads him (4:1, 14). The Father gives the Spirit to those who ask (11:13)."],["Joy and praise","Luke is full of songs and praise, from Mary’s song (1:46–55) to the disciples, who “were continually in the temple, praising and blessing God” (24:53)."],["Money and the poor","Jesus brings good news to the poor (4:18) and warns about the love of money (12:15; 16:13; 18:24). Zacchaeus gives half of his goods to the poor (19:8)."],["Salvation today","Again and again Luke says “today”: “Today, this Scripture has been fulfilled in your hearing” (4:21); “Today, salvation has come to this house” (19:9); “Today you will be with me in Paradise” (23:43)."]],"emotionsTitle":"Emotions: fear, tears and great joy","emotionsLead":"Luke shows the feelings of Jesus and of the people who met him. Follow them through the book, and let them help you bring your own feelings to God.","emotions":[["Fear","1:12; 2:9"],["Leaping joy","1:44"],["Amazement","2:47"],["Wrath","4:28"],["Compassion","7:13"],["Tears of love","7:38"],["Rejoicing in the Spirit","10:21"],["Weeping over Jerusalem","19:41"],["Agony","22:44"],["Bitter weeping","22:62"],["Burning hearts","24:32"],["Great joy","24:52"]],"resourcesLead":"These free websites can help you study Luke further. They are independent of Visual Luke, and you need an internet connection to open them.","resources":[["Blue Letter Bible: Luke with Greek word study","https://www.blueletterbible.org/kjv/luk/1/1/ss1","Read Luke with Strong’s numbers linked to Greek definitions, plus cross-references and commentaries for every verse."],["Blue Letter Bible: Introduction to Luke","https://www.blueletterbible.org/esv-study-bible/new-testament/introductions/introduction-to-luke.cfm","The ESV Global Study Bible’s introduction, with author, date, themes and an outline of the book."],["Blue Letter Bible: The Gospel of Luke","https://www.blueletterbible.org/study/intros/luke.cfm","A study introduction to Luke’s authorship, date, purpose and structure."],["Matthew Henry’s Commentary on Luke","https://www.biblegateway.com/resources/matthew-henry/Luke","A classic devotional commentary from the early 1700s, chapter by chapter."],["Enduring Word Commentary on Luke","https://enduringword.com/bible-commentary/luke-1/","David Guzik’s verse-by-verse commentary, with audio teaching on each section."],["BibleProject: Videos on Luke","https://bibleproject.com/videos/luke/","Short animated videos on the design and message of Luke."],["OpenBible.info: Map of places in Luke","https://www.openbible.info/geo/luke","An interactive map of the places named in Luke, such as Bethlehem, Nazareth, Capernaum, Jericho and Emmaus."]]},"stats":{"questions":180,"photos":96,"chapters":24}}</script>
<script>
(function () {
  "use strict";
  var BOOK = JSON.parse(document.getElementById("book-data").textContent);
  var CH = BOOK.chapters;
  var main = document.getElementById("main");

  /* ---------- storage (one browser only) ---------- */
  var KEY = "visual-luke2.responses.v1";
  var OLD_KEYS = [];
  var PREF = "visual-luke2.prefs.v1";
  var IN_FRAME = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  var STANDALONE = window.navigator.standalone === true || (!!window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  var IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (STANDALONE) document.documentElement.classList.add("standalone");
  var SHARE_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-label="Share"><path d="M8 1.5v8M5 4.5l3-3 3 3M4.5 7H3.5v7h9V7h-1" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var store = null;
  try { var t = "__vl"; window.localStorage.setItem(t, "1"); window.localStorage.removeItem(t); store = window.localStorage; } catch (e) { store = null; }
  function readJSON(k) { if (!store) return {}; try { return JSON.parse(store.getItem(k) || "{}") || {}; } catch (e) { return {}; } }
  function writeJSON(k, v) { if (!store) return false; try { store.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
  if (store) OLD_KEYS.forEach(function (k) { try { store.removeItem(k); } catch (e) {} });
  var responses = readJSON(KEY);
  var prefs = readJSON(PREF);

  /* ---------- indexes ---------- */
  var QUESTIONS = [];
  CH.forEach(function (c) {
    c.sections = [];
    c.questions = [];
    c.blocks.forEach(function (b, i) {
      b.domId = "c" + c.num + "-b" + i;
      if (b.type === "h2") c.sections.push({ text: b.text, id: b.domId });
      if (b.type === "q") { var q = { ch: c.num, id: b.id, field: b.field, text: b.text, domId: b.domId }; c.questions.push(q); QUESTIONS.push(q); }
    });
  });
  var MQ = BOOK.master.items;
  var MQFIELDS = [];
  CH.forEach(function (c) {
    c.mq = MQ.map(function (m) { var f = { ch: c.num, key: m[0], label: m[1], text: m[2], field: "mq" + c.num + "-" + m[0], domId: "c" + c.num + "-mq-" + m[0] }; MQFIELDS.push(f); return f; });
  });
  var SUMQ = MQ.map(function (m) { var f = { ch: "summary", key: m[0], label: m[1], text: m[2], field: "mqs-" + m[0], domId: "sum-" + m[0] }; MQFIELDS.push(f); return f; });
  function answered(field) { return !!(responses[field] && responses[field].trim()); }
  function mqAnswered() { return MQFIELDS.filter(function (q) { return answered(q.field); }).length; }
  function answeredIn(c) { return c.questions.filter(function (q) { return answered(q.field); }).length; }
  function totalAnswered() { return QUESTIONS.filter(function (q) { return answered(q.field); }).length; }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function strip(h) { return String(h).replace(/<sup class="v">(\d+)<\/sup>/g, "$1").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">"); }
  function img(src, w, h, alt, cls, eager) {
    return '<img src="' + esc(src) + '" width="' + w + '" height="' + h + '" alt="' + esc(alt || "") + '"' +
      (cls ? ' class="' + cls + '"' : "") + (eager ? "" : ' loading="lazy" decoding="async"') + ">";
  }

  /* ---------- chrome ---------- */
  var chapgrid = document.getElementById("chapgrid");
  var chapmenu = document.getElementById("chapmenu");
  ["nav-deeper", "nav-summary"].forEach(function (id) { document.getElementById(id).addEventListener("click", function () { chapmenu.open = false; }); });
  function renderChapGrid(current) {
    chapgrid.innerHTML = CH.map(function (c) {
      var a = answeredIn(c);
      return '<a href="#luke-' + c.num + '"' + (current === c.num ? ' aria-current="page"' : "") + (a ? ' class="done"' : "") +
        ' title="Luke ' + c.num + (a ? " · " + a + " answered" : "") + '">' + c.num + "</a>";
    }).join("");
  }
  function updateCount() { document.getElementById("resp-count").textContent = totalAnswered() + mqAnswered(); }
  document.addEventListener("click", function (e) {
    if (chapmenu.open && !chapmenu.contains(e.target)) chapmenu.open = false;
  });
  chapgrid.addEventListener("click", function () { chapmenu.open = false; });

  /* ---------- search ---------- */
  var SEARCH = [];
  CH.forEach(function (c) {
    var section = "";
    c.blocks.forEach(function (b) {
      if (b.type === "h2") { section = b.text; SEARCH.push({ ch: c.num, domId: b.domId, kind: "Heading", text: strip(b.text), section: section }); }
      else if (b.type === "p") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Text", text: strip(b.html), section: section });
      else if (b.type === "poem") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Text", text: strip(b.lines.join(" ")), section: section });
      else if (b.type === "q") SEARCH.push({ ch: c.num, domId: b.domId, kind: "Question " + b.id, text: strip(b.text), section: section });
    });
  });
  SEARCH.forEach(function (s) { s.lower = s.text.toLowerCase(); });
  var searchBtn = document.getElementById("search-btn");
  var searchbar = document.getElementById("searchbar");
  var searchInput = document.getElementById("search-input");
  var resultsEl = document.getElementById("results");
  var noteEl = document.getElementById("results-note");
  searchBtn.addEventListener("click", function () {
    var open = searchbar.hidden;
    searchbar.hidden = !open;
    searchBtn.setAttribute("aria-expanded", String(open));
    if (open) searchInput.focus();
  });
  function snippet(text, q) {
    var i = text.toLowerCase().indexOf(q);
    var start = Math.max(0, i - 70), end = Math.min(text.length, i + q.length + 110);
    var s = (start > 0 ? "…" : "") + esc(text.slice(start, i)) + "<b>" + esc(text.slice(i, i + q.length)) + "</b>" + esc(text.slice(i + q.length, end)) + (end < text.length ? "…" : "");
    return s;
  }
  var searchTimer;
  searchInput.addEventListener("input", function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 120);
  });
  searchInput.addEventListener("keydown", function (e) { if (e.key === "Escape") { searchbar.hidden = true; searchBtn.setAttribute("aria-expanded", "false"); searchBtn.focus(); } });
  function runSearch() {
    var q = searchInput.value.trim().toLowerCase();
    if (q.length < 2) { resultsEl.innerHTML = ""; noteEl.textContent = q ? "Type at least two letters." : ""; return; }
    var hits = SEARCH.filter(function (s) { return s.lower.indexOf(q) !== -1; });
    var shown = hits.slice(0, 60);
    resultsEl.innerHTML = shown.map(function (h, i) {
      return '<li><button type="button" data-i="' + i + '"><span class="ref">Luke ' + h.ch + " · " + esc(h.kind) + (h.section && h.kind !== "Heading" ? " · " + esc(h.section) : "") + "</span>" + snippet(h.text, q) + "</button></li>";
    }).join("");
    noteEl.textContent = hits.length ? (hits.length > shown.length ? "Showing the first " + shown.length + " of " + hits.length + " matches." : hits.length + (hits.length === 1 ? " match." : " matches.")) : "No matches in Luke or the questions.";
    resultsEl.onclick = function (e) {
      var b = e.target.closest("button[data-i]"); if (!b) return;
      var h = shown[+b.getAttribute("data-i")];
      searchbar.hidden = true; searchBtn.setAttribute("aria-expanded", "false");
      goTo(h.ch, h.domId);
    };
  }

  /* ---------- navigation ---------- */
  var pendingTarget = null;
  function goTo(ch, domId) {
    pendingTarget = domId;
    var want = ch === "summary" ? "#summary" : "#luke-" + ch;
    if (location.hash === want) { scrollToTarget(); } else { location.hash = want; }
  }
  function scrollToTarget() {
    if (!pendingTarget) return;
    var el = document.getElementById(pendingTarget);
    pendingTarget = null;
    if (!el) return;
    el.scrollIntoView({ block: "start" });

      lines.push("LUKE " + c.num);

        lines.push(q.id + "  " + strip(q.text));
        lines.push(responses[q.field].trim());
        lines.push("");

      ms.forEach(function (f) {
        lines.push("Master Question · " + f.label + "  " + strip(f.text));
        lines.push(responses[f.field].trim());
        lines.push("");

    });

    if (ss.length) {
      lines.push("SUMMARY");

        lines.push("Master Question · " + f.label + "  " + strip(f.text));

    if (!parts) { if (hlMode && hlMode.kind === "new") hideBar(); return; }
    var sel = window.getSelection();
    hlMode = { kind: "new", parts: parts, rect: sel.getRangeAt(0).getBoundingClientRect() };
    showBar();
  }
  document.addEventListener("selectionchange", function () {
    if (pressing) return;
    clearTimeout(selTimer);
    selTimer = setTimeout(checkSelection, 220);
  });
  hlbar.addEventListener("pointerdown", function (e) { pressing = true; if (e.pointerType === "mouse") e.preventDefault(); });
  hlbar.addEventListener("mousedown", function (e) { e.preventDefault(); });
  document.addEventListener("pointerup", function () { setTimeout(function () { pressing = false; }, 400); }, true);
  document.addEventListener("pointercancel", function () { pressing = false; }, true);
  hlbar.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    pressing = false;
    if (!b || !hlMode) return;
    var mode = hlMode, c = b.getAttribute("data-hl-color");
    if (c) {
      if (mode.kind === "new") { addHL(mode.parts, c); try { window.getSelection().removeAllRanges(); } catch (x) {} }
      else { var h = findHL(mode.id); if (h) { h.color = c; saveHL(); applyHL(); } }
      hideBar();
    } else if (b.hasAttribute("data-hl-remove")) {
      var g = findHL(mode.id); hideBar();
      if (g) removeHL([g], "Highlight removed.");
    } else if (b.hasAttribute("data-hl-erase")) {
      var before = JSON.stringify(HL);
      cutOut(mode.parts); saveHL(); applyHL();
      try { window.getSelection().removeAllRanges(); } catch (x) {}
      hideBar();
      showToast("Highlight cleared from the selected words.", "Undo", function () { HL = JSON.parse(before); saveHL(); refreshView(); }, 7000);
    }
  });
  // tap a highlight to change or remove it; clear buttons in the guide and on My responses
  main.addEventListener("click", function (e) {
    var m = e.target.closest && e.target.closest("mark.hl");
    if (m) {
      var sel = window.getSelection();
      if (sel && !sel.isCollapsed) return;
      hlMode = { kind: "edit", id: m.getAttribute("data-hl"), el: m };
      showBar();
      return;
    }
    var clr = e.target.closest && e.target.closest("[data-hl-clear]");
    if (clr) {
      var scope = clr.getAttribute("data-hl-clear");
      var list = scope === "chapter" ? hlFor(currentChapter) : HL.slice();
      removeHL(list, plural(list.length, "highlight") + " cleared" + (scope === "chapter" ? " from Luke " + currentChapter : "") + ".");
      return;
    }
    var del = e.target.closest && e.target.closest("[data-hl-del]");
    if (del) { var h = findHL(del.getAttribute("data-hl-del")); if (h) removeHL([h], "Highlight removed."); }
  });
  document.addEventListener("click", function (e) {
    if (hlbar.hidden || !hlMode) return;
    if (hlbar.contains(e.target) || (e.target.closest && e.target.closest("mark.hl"))) return;
    var sel = window.getSelection();
    if (hlMode.kind === "edit" || !sel || sel.isCollapsed) hideBar();
  });
  var barRAF = 0;
  window.addEventListener("scroll", function () {
    if (!hlMode) return;
    if (barRAF) return;
    barRAF = requestAnimationFrame(function () { barRAF = 0; if (hlMode) placeBar(); });
  }, { passive: true });
  window.addEventListener("resize", function () { if (hlMode) placeBar(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && hlMode) hideBar(); });

  /* ---------- toast ---------- */
  var toastTimer = null;
  function showToast(text, label, onClick, ms) {
    var t = document.getElementById("toast");
    clearTimeout(toastTimer);
    document.getElementById("toast-text").textContent = text;
    var b = document.getElementById("toast-btn");
    b.textContent = label; b.onclick = function () { clearTimeout(toastTimer); t.hidden = true; onClick(); };
    t.hidden = false;
    if (ms) toastTimer = setTimeout(function () { t.hidden = true; }, ms);
  }

  /* ---------- offline app (service worker) ---------- */
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !IN_FRAME) {
    var hadController = !!navigator.serviceWorker.controller, updating = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (hadController && updating) location.reload();
    });
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        function offer(worker) {
          showToast("A new version of Visual Luke is ready.", "Update", function () { updating = true; worker.postMessage("skipWaiting"); });
        }
        if (reg.waiting && hadController) offer(reg.waiting);
        reg.addEventListener("updatefound", function () {
          var nw = reg.installing; if (!nw) return;
          nw.addEventListener("statechange", function () {
            if (nw.state === "installed" && navigator.serviceWorker.controller) offer(nw);
          });
        });
      }).catch(function () {});
      if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
    });
  }

  // home-screen card, continue button (delegated, since views re-render)
  main.addEventListener("click", function (e) {
    if (e.target.closest("#install-dismiss")) {
      prefs.hideInstall = true; writeJSON(PREF, prefs);
      var c = document.getElementById("install-card"); if (c) c.remove();
    }
    if (e.target.closest("#continue-btn")) resume = true;
  });

  // keyboard: [ and ] for previous/next chapter when not typing
  document.addEventListener("keydown", function (e) {
    if (e.target.closest && e.target.closest("textarea, input")) return;
    var m = /^#luke-(\d+)$/.exec(location.hash);
    if (!m) return;
    var n = +m[1];
    if (e.key === "]" && n < CH.length) location.hash = "#luke-" + (n + 1);
    if (e.key === "[" && n > 1) location.hash = "#luke-" + (n - 1);
  });

  route();
})();
</script>
</body>
</html>
